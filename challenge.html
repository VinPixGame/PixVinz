<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extra Challenge - PixVinz</title>  
 
 <link rel="stylesheet" href="challenge.css">

</head>
<body>

  <div class="app-container">
 <audio id="challengeBGM" src="sounds/challenge1.mp3" preload="auto" loop></audio>
 <audio id="challengeVictoryBGM" src="sounds/challengevictory.mp3" preload="auto"></audio>

    
    <!-- Top Header Bar -->
    <header class="top-bar" id="mainHeader">
      <button class="icon-btn back-btn" onclick="window.location.href='index.html'"><span>←</span></button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <!-- Header / Title Row -->
    <div class="challenge-header">
      <h2 id="challengeTitle" class="challenge-title">Challenge 1</h2>
    </div>
    <div class="challenge-stats">
      <div class="stat-badge-item">
        <span class="stat-icon-symbol">⏱️</span>
        <div class="stat-text-stack">
          <span class="stat-label-title">TIME</span>
          <span class="stat-main-val" id="timer">00:00</span>
        </div>
      </div>
      <div class="stat-badge-item">
        <span class="stat-icon-symbol">🎲</span>
        <div class="stat-text-stack">
          <span class="stat-label-title">MOVES</span>
          <span class="stat-main-val" id="moveCount">0</span>
        </div>
      </div>
    </div>

    <!-- Puzzle Board Wrapper -->
    <div class="puzzle-board-wrapper">
      
      <!-- Loading & Custom Start Image Button Overlay -->
      <div id="challengeLoadingOverlay">
        <div id="loadingSpinner">
          ⏳ Loading Challenge... <span id="loadingPercent">0%</span>
        </div>
        
        <!-- Loading Progress Bar Added Here -->
        <div id="loadingBarContainer">
          <div id="loadingBarFill"></div>
        </div>

        <!-- Custom Image Start Button -->
        <button id="startChallengeBtn" class="hidden">
          <img src="image/start.png" alt="Start Challenge" />
        </button>
      </div>

      <div id="puzzleBoard" class="puzzle-board">
        <!-- 9 tiles generated dynamically -->
      </div>
    </div>

    <!-- Action Controls -->
    <div class="challenge-actions">
      <button id="previewBtn" class="btn btn-secondary">👁️ Preview</button>
      <button id="shuffleBtn" class="btn btn-primary">🔀 Shuffle</button>
    </div>
  </div>

<canvas id="confettiCanvas"></canvas>

  
<!-- Win Modal Popup -->
<div id="winModal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000;">
  <div class="win-card" style="background: #1a162b; padding: 25px; border-radius: 16px; text-align: center; border: 2px solid #7928ca; width: 85%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
    <h2 style="color: #ffcc00; font-size: 1.4rem; margin-bottom: 10px;">CHALLENGE COMPLETE!</h2>
    
    <!-- ⭐ Star Rating Display -->
    <div id="starContainer" style="font-size: 1.6rem; margin-bottom: 15px; color: #ffcc00; letter-spacing: 4px;"></div>
   
    <!-- Solved Video Preview Box -->
    <div id="winVideoContainer" style="width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; margin-bottom: 15px; background: #000; border: 1px solid #33285c; position: relative;">
      <!-- Solved video injected dynamically -->
    </div>

    <!-- Stats Grid -->
    <div style="display: flex; justify-content: space-around; background: #241e3d; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; color: #fff;">
      <div>⏱️ <span id="finalTime">00:00</span></div>
      <div>🎲 <span id="finalMoves">0</span> moves</div>
    </div>

    <!-- Rewards -->
    <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; font-weight: bold; color: #ffcc00;">
      <div>🪙 +<span id="earnedCoins">0</span> Coins</div>
      <div>✨ +<span id="earnedXp">0</span> XP</div>
    </div>

    <!-- Action Buttons Container -->
    <div style="display: flex; gap: 10px;">
      <button id="homeBtn" class="btn" style="flex: 1; padding: 10px; background: #33285c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Home</button>
      <button id="nextChallengeBtn" class="btn btn-primary" style="flex: 1; padding: 10px; background: #7928ca; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Next Challenge</button>
    </div>
  </div>
</div>

<!-- Preview Modal Popup -->
<div id="challengePreviewModal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000;">
  <div class="win-card" style="background: #1a162b; padding: 25px; border-radius: 16px; text-align: center; border: 2px solid #7928ca; width: 85%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
    <h3 id="challengeModalTitle" style="color: #ffcc00; font-size: 1.2rem; margin-bottom: 15px;">LEVEL 01 PREVIEW</h3>
    
    <!-- Preview Video Container -->
    <div style="width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; margin-bottom: 15px; background: #000; border: 1px solid #33285c; position: relative;">
      <video id="challengeModalVideo" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
    </div>

    <!-- Countdown Timer Display -->
    <div style="font-size: 0.95rem; color: #fff; margin-bottom: 15px;">
      Closing in <span id="challengeCountdownSeconds" style="color: #ffcc00; font-weight: bold;">15</span>s
    </div>

    <button id="closeChallengePreviewBtn" class="btn btn-primary" style="width: 100%; padding: 10px; background: #7928ca; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Close Preview</button>
  </div>
</div>

  
  <script src="playerstat.js"></script>
  <script src="profile.js"></script>
  <script src="challenge.js"></script>
</body>
</html>
