<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extra Challenge - PixVinz</title>  
  <link rel="stylesheet" href="challenge.css">
</head>
<body>

  <!-- Top Header Bar -->
    <header class="top-bar hidden" id="mainHeader">
      <button class="icon-btn" id="profileHeaderBtn" onclick="showView('profileView')" style="background-color: #2a1147; border: 2px solid #9c27b0; overflow: hidden; padding: 0;">
        <span id="profileIconFallback">👤</span>
        <img id="profileHeaderImg" src="" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;">
      </button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto" style="background: transparent;">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>
  
  <div class="challenge-container">
    <!-- Header -->
    <div class="challenge-header">
      <button class="back-btn" onclick="window.location.href='index.html'"><span>←</span>Back</button>
      <h2 class="challenge-title">Extra Challenge</h2>
      <div style="width: 60px;"></div>
    </div>

    <!-- Stats Bar -->
    <div class="challenge-stats">
      <div class="stat-box">Time: <span id="timer">00:00</span></div>
      <div class="stat-box">Moves: <span id="moveCount">0</span></div>
    </div>

    <!-- Puzzle Board Wrapper -->
    <div class="puzzle-board-wrapper">
      <div id="puzzleBoard" class="puzzle-board">
        <!-- 9 tiles generated dynamically -->
      </div>
    </div>

    <!-- Action Controls -->
    <div class="challenge-actions">
      <button id="previewBtn" class="btn btn-secondary">👁️ Preview</button>
      <button id="shuffleBtn" class="btn btn-primary">🔀 Shuffle</button>
    </div>
  </div>

  <!-- Win Modal Popup -->
  <div id="winModal" class="modal-overlay hidden">
    <div class="win-card">
      <h2>🎉 Challenge Completed!</h2>
      <p>You solved the video puzzle!</p>
      <p>Time: <span id="finalTime">00:00</span> | Moves: <span id="finalMoves">0</span></p>
      <button id="nextChallengeBtn" class="btn btn-primary">Next Level</button>
    </div>
  </div>

  <script src="challenge.js"></script>
</body>
</html>
