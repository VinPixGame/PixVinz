<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Extra Challenge - PixVinz</title>  
 
 <link rel="stylesheet" href="challenge.css">

</head>
<body>

  <div class="app-container">
 
 <audio id="challengeVictoryBGM" src="sounds/challengevictory.mp3" preload="auto"></audio>

     
    <!-- Top Header Bar -->
    <header class="top-bar" id="mainHeader">
      <button class="icon-btn back-btn" onclick="window.location.href='index.html'"><span>‹</span></button>
        <div class="logo-container">
        <img id="logoImage" src="image/vinz.png" alt="PixVinz Logo" style="background: transparent; max-height: 100%; width: auto;">
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <!-- Header / Title Row -->
    <div class="challenge-header">
      <h2 id="challengeTitle" class="challenge-title">Challenge 1</h2>
    </div>
    <div class="challenge-stats">
      <div class="stat-badge-item">
        <span class="stat-icon-symbol">⏱️</span>
        <div class="stat-text-stack">
          <span class="stat-label-title">TIME</span>
          <span class="stat-main-val" id="timer">00:00</span>
        </div>
      </div>
      <div class="stat-badge-item">
        <span class="stat-icon-symbol">🎲</span>
        <div class="stat-text-stack">
          <span class="stat-label-title">MOVES</span>
          <span class="stat-main-val" id="moveCount">0</span>
        </div>
      </div>
    </div>

    <!-- Puzzle Board Wrapper -->
    <div class="puzzle-board-wrapper">
      
      <!-- Loading & Custom Start Image Button Overlay -->
      <div id="challengeLoadingOverlay">
        <div id="loadingSpinner">
          ⏳ Loading Challenge... <span id="loadingPercent">0%</span>
        </div>
        
        <!-- Loading Progress Bar Added Here -->
        <div id="loadingBarContainer">
          <div id="loadingBarFill"></div>
        </div>

        <!-- Custom Image Start Button -->
        <button id="startChallengeBtn" class="hidden">
          <img src="image/start.png" alt="Start Challenge" />
        </button>
      </div>

      <div id="puzzleBoard" class="puzzle-board">
        <!-- 9 tiles generated dynamically -->
      </div>
    </div>

    <!-- Action Controls -->
    <div class="challenge-actions">
      <button id="previewBtn" class="btn btn-secondary">👁️ Preview (-🪙10)</button>
      <button id="shuffleBtn" class="btn btn-primary">🔀 Shuffle</button>
    </div>
  </div>

<canvas id="confettiCanvas"></canvas>

  
<!-- Win Modal Popup -->
<div id="winModal" class="modal-overlay hidden">

  <div class="win-card">

    <h2 class="challenge-win-title">CHALLENGE COMPLETE!</h2>

    <!-- ⭐ Star Rating -->
    <div id="starContainer" class="challenge-star-container"></div>

    <!-- Solved Video Preview -->
    <div id="winVideoContainer" class="challenge-win-video-wrap">
      <!-- Solved video injected dynamically -->
    </div>

    <!-- Stats -->
    <div class="challenge-stats-panel">
      <div>⏱️ <span id="finalTime">00:00</span></div>
      <div>🎲 <span id="finalMoves">0</span> moves</div>
    </div>

    <!-- Rewards -->
    <div class="challenge-rewards">
      <div>🪙 +<span id="earnedCoins">0</span> Coins</div>
      <div>✨ +<span id="earnedXp">0</span> XP</div>
    </div>

    <!-- Action Buttons -->
    <div class="challenge-win-buttons">
      <button id="homeBtn" class="btn challenge-home-btn">
        Home
      </button>

      <button id="nextChallengeBtn" class="btn btn-primary challenge-next-btn">
        Next Challenge
      </button>
    </div>

  </div>

</div>

<!-- Challenge Preview Modal Popup -->
<div id="challengePreviewModal" class="challenge-preview-popup hidden">

  <div class="challenge-preview-overlay">

    <div class="challenge-preview-box">

      <div class="challenge-preview-header">
        <span id="challengeModalTitle">👁️ CHALLENGE 01 PREVIEW</span>

        <span id="challengeCountdownSeconds">15</span>
      </div>

      <div class="challenge-preview-video-container">
        <video
          id="challengeModalVideo"
          autoplay
          loop
          playsinline
        ></video>
      </div>

       <button id="closeChallengePreviewBtn" class="challenge-preview-close-btn">
        CLOSE
      </button>

    </div>

  </div>

</div>

  
 <script src="playerstat.js"></script>
 <script src="profile.js"></script>
 <script src="challenge.js"></script>
</body>
</html>
