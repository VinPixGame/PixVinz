<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixVinz Scratch Card Arena</title>
    <style>
        :root {
            --bg-deep: #0a0b10;
            --surface: #141722;
            --surface-card: #1c2133;
            --primary: #00e5ff;
            --gold: #ffd700;
            --accent-purple: #9d00ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Confetti canvas overlay */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .audio-toggle-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .back-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }

        .currency-cluster {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .badge-pill {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 20px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            color: var(--gold);
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .poster-card {
            background: linear-gradient(135deg, #1e0033 0%, #0c0219 50%, #050b1a 100%);
            border: 2px solid rgba(157, 0, 255, 0.4);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(157, 0, 255, 0.2);
        }

        .poster-card svg {
            width: 54px;
            height: 54px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(0,229,255,0.6));
        }

        .poster-title {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(90deg, #00e5ff, #ffffff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .poster-sub {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .arena-action-box {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .buy-btn {
            background: linear-gradient(135deg, #00e5ff 0%, #0088cc 100%);
            color: #050b1a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        .buy-btn:active { transform: scale(0.98); }
        .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .scratch-board-wrapper {
            background: linear-gradient(145deg, #1c2133, #11141e);
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .card-meta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .card-code-badge {
            color: var(--gold);
            font-family: monospace;
            font-weight: bold;
            background: rgba(255,215,0,0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .scratch-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            position: relative;
        }

        .scratch-slot {
            aspect-ratio: 1;
            background: #11141e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-size: 24px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .scratch-slot img {
            width: 75%;
            height: 75%;
            object-fit: contain;
        }

        .scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
            border-radius: 10px;
        }

        /* Winning Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(145deg, #1c2133, #121522);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.25);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-trophy {
            font-size: 48px;
            margin-bottom: 10px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .claim-form-box {
            background: rgba(0,0,0,0.6);
            border: 1px dashed var(--gold);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 12px;
            line-height: 1.5;
        }

        .claim-form-box textarea {
            width: 100%;
            height: 90px;
            background: #0a0b10;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            box-sizing: border-box;
            margin-top: 6px;
        }

        .modal-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #ff8800 100%);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,215,0,0.3);
        }

        .history-section {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .history-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 3px solid var(--text-muted);
        }

        .history-item.epic {
            border-left-color: var(--gold);
            background: rgba(255, 215, 0, 0.05);
        }

        .winner-tag {
            font-weight: 700;
            color: #fff;
        }

        .prize-highlight {
            color: var(--gold);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <!-- Audio Elements -->
    <audio id="bgMusic" src="sounds/scratch.mp3" loop></audio>
    <audio id="scratchSfx" src="https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3" preload="auto"></audio>
    <audio id="winSfx" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>
    <audio id="loseSfx" src="https://assets.mixkit.co/active_storage/sfx/2704/2704-preview.mp3" preload="auto"></audio>

    <div class="header-bar">
        <button class="back-btn" onclick="window.location.href='index.html'">← Home</button>
        <button class="audio-toggle-btn" id="audioToggleBtn" onclick="toggleBackgroundMusic()">🎵 Music: OFF</button>
        <div class="currency-cluster">
            <div class="badge-pill">🪙 <span id="headerCoins">0</span></div>
            <div class="badge-pill" style="border-color: rgba(0,229,255,0.3); color: var(--primary);">⭐ <span id="headerXp">0</span></div>
        </div>
    </div>

    <div class="main-container">
        
        <!-- Premium SVG Poster -->
        <div class="poster-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#goldGradient)" stroke="#ffd700"/>
                <defs>
                    <linearGradient id="goldGradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#ffd700"/>
                        <stop offset="1" stop-color="#ff8800"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="poster-title">1,000,000 XP Jackpot</div>
            <div class="poster-sub">Scratch to match 3 identical icons & win big! Cost: 500 Coins per card.</div>
        </div>

        <!-- Arena Action & Scratch Matrix -->
        <div class="arena-action-box">
            <button id="buyCardBtn" class="buy-btn" onclick="buyScratchCard()">Buy Scratch Card (500 🪙)</button>
            
            <div id="scratchContainer" style="display:none; margin-top: 20px;">
                <div class="scratch-board-wrapper">
                    <div class="card-meta-header">
                        <span>PIXVINZ SECURE TICKET</span>
                        <span>CODE: <span id="displayCardCode" class="card-code-badge">----</span></span>
                    </div>
                    <div class="scratch-grid" id="scratchGrid">
                        <!-- 12 Scratch Slots populated dynamically -->
                    </div>
                </div>
                <div id="resultMessage" style="margin-top: 15px; font-weight: 800; font-size: 15px;"></div>
            </div>
        </div>

        <!-- Recent Payouts History -->
        <div class="history-section">
            <div class="history-title">Recent Elite Payouts</div>
            <div class="history-list" id="payoutHistoryList">
                <div class="history-item">
                    <div>Loading payouts from vault...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Winning / Result Modal Overlay -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-trophy" id="modalTrophy">🏆</div>
            <div class="modal-title" id="modalTitle">Victory!</div>
            <div class="modal-subtitle" id="modalSubtitle">You matched 3 items!</div>
            <div id="modalContentBody"></div>
            <button class="modal-btn" onclick="closeResultModal()">Awesome!</button>
        </div>
    </div>

    <!-- Firebase Initialization Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPFmx35ClB3c5vGBtv8rzVAiTK4rcwAik",
            authDomain: "pixvinz2026.firebaseapp.com",
            projectId: "pixvinz2026",
            storageBucket: "pixvinz2026.firebasestorage.app",
            messagingSenderId: "45609077809",
            appId: "1:45609077809:web:575611e46acda9f64c5910",
            measurementId: "G-W7FSERE8ZJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.pixvinzDb = { db, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit };

        function getCurrentUsername() {
            try {
                const userObj = JSON.parse(localStorage.getItem('loggedInUser'));
                if (userObj && userObj.username) return userObj.username;
            } catch (e) {}
            return localStorage.getItem('vinpix_username') || 'GuestPlayer';
        }

        window.updateTopBalances = function() {
            const username = getCurrentUsername();
            const prefix = username ? username + '_' : '';
            const coins = parseInt(localStorage.getItem(prefix + 'totalCoins')) || 0;
            const xp = parseInt(localStorage.getItem(prefix + 'totalXp')) || 0;

            document.getElementById('headerCoins').textContent = coins.toLocaleString();
            document.getElementById('headerXp').textContent = xp.toLocaleString();
        }

        // Audio & Music Manager
        let musicPlaying = false;
        window.toggleBackgroundMusic = function() {
            const bgMusic = document.getElementById('bgMusic');
            const toggleBtn = document.getElementById('audioToggleBtn');
            if (musicPlaying) {
                bgMusic.pause();
                musicPlaying = false;
                toggleBtn.textContent = "🎵 Music: OFF";
            } else {
                bgMusic.play().then(() => {
                    musicPlaying = true;
                    toggleBtn.textContent = "🎵 Music: ON";
                }).catch(e => {
                    console.error("Audio playback blocked:", e);
                    alert("Click anywhere on the page first to enable background audio.");
                });
            }
        }

        function playSound(type) {
            try {
                const sfx = document.getElementById(type);
                if (sfx) {
                    sfx.currentTime = 0;
                    sfx.play().catch(e => {});
                }
            } catch(e) {}
        }

        let activeCardData = null;
        let activeCardId = null;
        let evaluated = false;
        let scratchSfxTimer = null;

        window.buyScratchCard = async function() {
            const username = getCurrentUsername();
            const prefix = username ? username + '_' : '';
            let coins = parseInt(localStorage.getItem(prefix + 'totalCoins')) || 0;

            if (coins < 500) {
                alert("Not enough coins! You need 500 coins to buy a scratch card.");
                return;
            }

            coins -= 500;
            localStorage.setItem(prefix + 'totalCoins', coins);
            window.updateTopBalances();

            const buyBtn = document.getElementById('buyCardBtn');
            buyBtn.disabled = true;
            buyBtn.textContent = "Fetching Card from Vault...";

            try {
                evaluated = false;
                const randomCardNum = String(Math.floor(Math.random() * 1000) + 1).padStart(4, '0');
                activeCardId = `card_${randomCardNum}`;
                document.getElementById('displayCardCode').textContent = activeCardId.toUpperCase();

                const cardRef = doc(db, "scratch_cards", activeCardId);
                const cardSnap = await getDoc(cardRef);

                if (!cardSnap.exists()) {
                    throw new Error("Card data not found in vault.");
                }

                activeCardData = cardSnap.data();

                if (auth.currentUser) {
                    await updateDoc(cardRef, {
                        isBought: true,
                        boughtBy: auth.currentUser.uid
                    });
                }
                
                renderScratchBoard(activeCardData);

                buyBtn.style.display = 'none';
                document.getElementById('scratchContainer').style.display = 'block';
                document.getElementById('resultMessage').textContent = '';

            } catch (err) {
                console.error(err);
                alert("Error fetching scratch card. Refund issued.");
                coins += 500;
                localStorage.setItem(prefix + 'totalCoins', coins);
                window.updateTopBalances();
                buyBtn.disabled = false;
                buyBtn.textContent = "Buy Scratch Card (500 🪙)";
            }
        }

        function renderScratchBoard(cardData) {
            const gridEl = document.getElementById('scratchGrid');
            gridEl.innerHTML = '';

            cardData.grid.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'scratch-slot';

                let contentHTML = item;
                if (item.endsWith('.png')) {
                    contentHTML = `<img src="image/${item}" alt="icon">`;
                }

                slot.innerHTML = `
                    ${contentHTML}
                    <canvas class="scratch-canvas" id="scratchCanvas_${index}"></canvas>
                `;
                gridEl.appendChild(slot);

                initScratchCanvas(`scratchCanvas_${index}`);
            });
        }

        function initScratchCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#c0c0c0');
            gradient.addColorStop(0.3, '#e8e8e8');
            gradient.addColorStop(0.5, '#9a9a9a');
            gradient.addColorStop(0.7, '#f0f0f0');
            gradient.addColorStop(1, '#a8a8a8');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (let i = 0; i < 15; i++) {
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 3, 3);
            }

            ctx.fillStyle = '#555';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SCRATCH', canvas.width / 2, canvas.height / 2);

            let isDrawing = false;

            function scratch(e) {
                if (!isDrawing || evaluated) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                if (!clientX || !clientY) return;

                const x = clientX - rect.left;
                const y = clientY - rect.top;

                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 16, 0, Math.PI * 2, false);
                ctx.fill();

                // Play scratch effect audio intermittently while actively scratching
                if (!scratchSfxTimer) {
                    playSound('scratchSfx');
                    scratchSfxTimer = setTimeout(() => { scratchSfxTimer = null; }, 250);
                }

                checkScratchProgress(canvas);
            }

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('mousemove', scratch);
            window.addEventListener('mouseup', () => { isDrawing = false; });

            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); e.preventDefault(); });
            canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); });
            canvas.addEventListener('touchend', () => { isDrawing = false; });
        }

        function checkScratchProgress(canvas) {
            if (evaluated) return;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let transparentPixels = 0;
            const totalPixels = imgData.data.length / 4;

            for (let i = 3; i < imgData.data.length; i += 4) {
                if (imgData.data[i] === 0) {
                    transparentPixels++;
                }
            }

            if ((transparentPixels / totalPixels) > 0.40) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            const canvases = document.querySelectorAll('.scratch-canvas');
            let allScratched = true;
            canvases.forEach(c => {
                const cCtx = c.getContext('2d');
                const cData = cCtx.getImageData(0, 0, c.width, c.height);
                let trans = 0;
                for (let i = 3; i < cData.data.length; i += 4) {
                    if (cData.data[i] === 0) trans++;
                }
                if ((trans / (cData.data.length / 4)) < 0.35) {
                    allScratched = false;
                }
            });

            if (allScratched && !evaluated) {
                evaluated = true;
                evaluateCardResult(activeCardData);
            }
        }

        async function evaluateCardResult(card) {
            const username = getCurrentUsername();
            const prefix = username ? username + '_' : '';
            const modal = document.getElementById('resultModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalSubtitle = document.getElementById('modalSubtitle');
            const modalBody = document.getElementById('modalContentBody');
            const modalTrophy = document.getElementById('modalTrophy');

            modalBody.innerHTML = '';

            if (card.isWinner) {
                playSound('winSfx');
                startConfetti();
                modalTrophy.textContent = '🏆';

                const isMassiveWin = (card.prizeType === 'coin' && card.prizeValue >= 20000) || 
                                     (card.prizeType === 'xp' && card.prizeValue >= 50000);

                if (isMassiveWin) {
                    modalTitle.textContent = 'MASSIVE JACKPOT!';
                    modalSubtitle.textContent = `You won ${card.prizeValue.toLocaleString()} ${card.prizeType.toUpperCase()}!`;
                    
                    const claimText = `claiming prize\nsend the following info to pixvinz.official@gmail.com\n\nusername: ${username}\ncard unique code: ${activeCardId}\nprize amount: ${card.prizeValue.toLocaleString()} ${card.prizeType.toUpperCase()}`;
                    
                    modalBody.innerHTML = `
                        <div class="claim-form-box">
                            📌 <b>Claim Instructions:</b><br>
                            Send the details below to <b>pixvinz.official@gmail.com</b><br>
                            <textarea id="claimTextArea" readonly>${claimText}</textarea>
                            <button style="background:var(--gold); border:none; padding:6px 10px; font-weight:bold; border-radius:6px; cursor:pointer; margin-top:6px; font-size:11px;" onclick="navigator.clipboard.writeText(document.getElementById('claimTextArea').value); alert('Copied claim info!');">Copy Claim Info</button>
                        </div>
                    `;
                } else {
                    modalTitle.textContent = 'YOU WON!';
                    modalSubtitle.textContent = `Prize credited: ${card.prizeValue.toLocaleString()} ${card.prizeType.toUpperCase()}`;

                    if (card.prizeType === 'coin') {
                        let totalCoins = parseInt(localStorage.getItem(prefix + 'totalCoins')) || 0;
                        totalCoins += card.prizeValue;
                        localStorage.setItem(prefix + 'totalCoins', totalCoins);
                    } else if (card.prizeType === 'xp') {
                        let totalXp = parseInt(localStorage.getItem(prefix + 'totalXp')) || 0;
                        totalXp += card.prizeValue;
                        localStorage.setItem(prefix + 'totalXp', totalXp);
                    }
                    window.updateTopBalances();
                }

                try {
                    if (auth.currentUser) {
                        await setDoc(doc(collection(db, "payout_history")), {
                            winner: auth.currentUser.uid,
                            winnerUsername: username,
                            prizeValue: card.prizeValue,
                            prizeType: card.prizeType,
                            cardCode: activeCardId,
                            isManualClaim: isMassiveWin,
                            status: isMassiveWin ? 'pending_verification' : 'auto_credited',
                            timestamp: Date.now()
                        });
                        loadPayoutHistory();
                    }
                } catch (e) {
                    console.error("Error logging payout to Firestore:", e);
                }

                if (typeof window.saveUserDataToCloud === 'function' && !isMassiveWin) {
                    window.saveUserDataToCloud();
                }
            } else {
                playSound('loseSfx');
                modalTrophy.textContent = '❌';
                modalTitle.textContent = 'NO MATCH';
                modalSubtitle.textContent = 'Better luck on your next scratch ticket!';
            }

            modal.classList.add('active');
        }

        window.closeResultModal = function() {
            document.getElementById('resultModal').classList.remove('active');
            stopConfetti();

            const buyBtn = document.getElementById('buyCardBtn');
            buyBtn.disabled = false;
            buyBtn.textContent = "Buy Another Card (500 🪙)";
            buyBtn.style.display = 'block';
        }

        // Confetti Canvas Engine
        let confettiAnimId = null;
        function startConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#00e5ff', '#ffd700', '#9d00ff', '#ff3366', '#ffffff'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 4 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 10
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.fillStyle = p.color;
                    ctx.ellipse(p.x, p.y, p.r, p.r * 0.6, p.tilt, 0, Math.PI * 2);
                    ctx.fill();

                    p.y += p.dy;
                    p.x += p.dx;
                    if (p.y > canvas.height) p.y = -10;
                });
                confettiAnimId = requestAnimationFrame(render);
            }
            render();
        }

        function stopConfetti() {
            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        async function loadPayoutHistory() {
            try {
                const historyListEl = document.getElementById('payoutHistoryList');
                if (!historyListEl) return;

                const q = query(collection(db, "payout_history"), orderBy("timestamp", "desc"), limit(10));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    historyListEl.innerHTML = '<div class="history-item"><div>No recent payouts recorded yet.</div></div>';
                    return;
                }

                historyListEl.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const isEpic = data.prizeValue >= 50000;
                    
                    const item = document.createElement('div');
                    item.className = `history-item ${isEpic ? 'epic' : ''}`;
                    item.innerHTML = `
                        <div><span class="winner-tag">${data.winnerUsername || 'Anonymous'}</span> won <span class="prize-highlight">${data.prizeValue.toLocaleString()} ${(data.prizeType || 'xp').toUpperCase()}</span></div>
                        <span style="font-size:11px; color:var(--text-muted);">Recently</span>
                    `;
                    historyListEl.appendChild(item);
                });
            } catch (e) {
                console.error("Error loading payouts:", e);
                const historyListEl = document.getElementById('payoutHistoryList');
                if (historyListEl) {
                    historyListEl.innerHTML = '<div class="history-item"><div>Failed to load payouts from vault.</div></div>';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.updateTopBalances();
            loadPayoutHistory();
        });
    </script>
</body>
</html>
