<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PixVinz Scratch Card Seeder</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 16px; background: #00e5ff; color: #111; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00b3cc; }
        #status { margin-top: 20px; font-size: 14px; color: #ffd700; white-space: pre-line; }
    </style>
</head>
<body>

    <h1>PixVinz 1,000 Scratch Cards Seeder</h1>
    <p>Click the button below to generate and upload the 1,000 pre-determined scratch cards to Firestore.</p>
    <button id="seedBtn">Generate & Upload 1,000 Cards</button>
    <div id="status">Ready...</div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPFmx35ClB3c5vGBtv8rzVAiTK4rcwAik",
            authDomain: "pixvinz2026.firebaseapp.com",
            projectId: "pixvinz2026",
            storageBucket: "pixvinz2026.firebasestorage.app",
            messagingSenderId: "45609077809",
            appId: "1:45609077809:web:575611e46acda9f64c5910",
            measurementId: "G-W7FSERE8ZJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const customImages = [
            { id: "100.png", type: "coin", value: 100, wins: 100 },
            { id: "500.png", type: "coin", value: 500, wins: 70 },
            { id: "1k.png", type: "coin", value: 1000, wins: 50 },
            { id: "5k.png", type: "coin", value: 5000, wins: 20 },
            { id: "20k.png", type: "coin", value: 20000, wins: 10, teaserCount: 700 },
            { id: "1kxp.png", type: "xp", value: 1000, wins: 100 },
            { id: "5kxp.png", type: "xp", value: 5000, wins: 30 },
            { id: "10kxp.png", type: "xp", value: 10000, wins: 20, teaserCount: 700 },
            { id: "50kxp.png", type: "xp", value: 50000, wins: 10, teaserCount: 600 },
            { id: "jpxp.png", type: "xp", value: 1000000, wins: 2, teaserCount: 500 }
        ];

        const fillers = ['🧩', '🪩', '💎', '🎡', '🎮', '🎲'];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.getElementById('seedBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Building 1,000 cards dataset...";

            try {
                let winningCardsPool = [];

                // 1. Build Winning Cards (362 total)
                customImages.forEach(img => {
                    for (let i = 0; i < img.wins; i++) {
                        let slots = [img.id, img.id, img.id];
                        while (slots.length < 12) {
                            let candidate = Math.random() < 0.5 
                                ? customImages[Math.floor(Math.random() * customImages.length)].id 
                                : fillers[Math.floor(Math.random() * fillers.length)];
                            
                            if (candidate === img.id) continue;
                            
                            let count = slots.filter(s => s === candidate).length;
                            if (count < 2) {
                                slots.push(candidate);
                            }
                        }
                        shuffle(slots);
                        winningCardsPool.push({
                            isWinner: true,
                            prizeType: img.type,
                            prizeValue: img.value,
                            winningIcon: img.id,
                            grid: slots
                        });
                    }
                });

                // 2. Build Losing Cards (638 total)
                let losingCardsPool = [];
                while (losingCardsPool.length < 638) {
                    let slots = [];
                    let valid = true;
                    while (slots.length < 12) {
                        let candidate = Math.random() < 0.5
                            ? customImages[Math.floor(Math.random() * customImages.length)].id
                            : fillers[Math.floor(Math.random() * fillers.length)];
                        
                        let count = slots.filter(s => s === candidate).length;
                        if (count >= 2) {
                            valid = false;
                            break;
                        }
                        slots.push(candidate);
                    }

                    if (valid) {
                        let counts = {};
                        slots.forEach(s => counts[s] = (counts[s] || 0) + 1);
                        let maxFreq = Math.max(...Object.values(counts));
                        if (maxFreq < 3) {
                            losingCardsPool.push({
                                isWinner: false,
                                prizeType: null,
                                prizeValue: 0,
                                winningIcon: null,
                                grid: slots
                            });
                        }
                    }
                }

                // Combine and shuffle all 1,000 cards
                let allCards = shuffle([...winningCardsPool, ...losingCardsPool]);

                // Apply Teaser Mechanics safely using 'of' instead of ':'
                const teaserRules = {
                    'jpxp.png': 500,
                    '50kxp.png': 600,
                    '10kxp.png': 700,
                    '20k.png': 700
                };

                for (let [iconId, targetCount] of Object.entries(teaserRules)) {
                    let applied = 0;
                    for (let card of allCards) {
                        if (applied >= targetCount) break;
                        if (!card.isWinner && !card.grid.includes(iconId)) {
                            let replacements = 0;
                            for (let i = 0; i < card.grid.length && replacements < 2; i++) {
                                if (card.grid[i] !== iconId) {
                                    card.grid[i] = iconId;
                                    replacements++;
                                }
                            }
                            let counts = {};
                            card.grid.forEach(s => counts[s] = (counts[s] || 0) + 1);
                            if (Math.max(...Object.values(counts)) < 3) {
                                applied++;
                            } else {
                                card.grid = shuffle([...card.grid]); 
                            }
                        }
                    }
                }

                statusEl.textContent = "Uploading 1,000 cards to Firestore collection 'scratch_cards'...";

                // Batch upload to Firestore
                for (let i = 0; i < allCards.length; i++) {
                    const cardId = `card_${String(i + 1).padStart(4, '0')}`;
                    await setDoc(doc(db, "scratch_cards", cardId), {
                        cardId: cardId,
                        isWinner: allCards[i].isWinner,
                        prizeType: allCards[i].prizeType,
                        prizeValue: allCards[i].prizeValue,
                        winningIcon: allCards[i].winningIcon,
                        grid: allCards[i].grid,
                        createdAt: new Date()
                    });
                    if ((i + 1) % 100 === 0) {
                        statusEl.textContent = `Uploaded ${i + 1} / 1000 cards...`;
                    }
                }

                statusEl.textContent = "Success! All 1,000 scratch cards have been successfully generated and uploaded to Firestore.";

            } catch (err) {
                console.error(err);
                statusEl.textContent = "Error during generation/upload: " + err.message;
            }
        });
    </script>
</body>
</html>
