<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixVinz Scratch Card Arena</title>
    <style>
        :root {
            --bg-deep: #0a0b10;
            --surface: #141722;
            --surface-card: #1c2133;
            --primary: #00e5ff;
            --gold: #ffd700;
            --accent-purple: #9d00ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .back-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }

        .currency-cluster {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .badge-pill {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 20px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            color: var(--gold);
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .poster-card {
            background: linear-gradient(135deg, #1e0033 0%, #0c0219 50%, #050b1a 100%);
            border: 2px solid rgba(157, 0, 255, 0.4);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(157, 0, 255, 0.2);
        }

        .poster-card svg {
            width: 54px;
            height: 54px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(0,229,255,0.6));
        }

        .poster-title {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(90deg, #00e5ff, #ffffff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .poster-sub {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .arena-action-box {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .buy-btn {
            background: linear-gradient(135deg, #00e5ff 0%, #0088cc 100%);
            color: #050b1a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        .buy-btn:active { transform: scale(0.98); }
        .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .scratch-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: var(--surface-card);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            min-height: 280px;
        }

        .scratch-slot {
            aspect-ratio: 1;
            background: #11141e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            font-size: 26px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .scratch-slot img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .scratch-cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2c3247 0%, #1a1e2e 100%);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            transition: opacity 0.3s;
            user-select: none;
        }
        .scratch-cover.revealed { opacity: 0; pointer-events: none; }

        .history-section {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .history-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 3px solid var(--text-muted);
        }

        .history-item.epic {
            border-left-color: var(--gold);
            background: rgba(255, 215, 0, 0.05);
        }

        .winner-tag {
            font-weight: 700;
            color: #fff;
        }

        .prize-highlight {
            color: var(--gold);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="back-btn" onclick="window.location.href='index.html'">← Home</button>
        <div class="currency-cluster">
            <div class="badge-pill">🪙 <span id="headerCoins">0</span></div>
            <div class="badge-pill" style="border-color: rgba(0,229,255,0.3); color: var(--primary);">⭐ <span id="headerXp">0</span></div>
        </div>
    </div>

    <div class="main-container">
        
        <!-- Premium SVG Poster -->
        <div class="poster-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#goldGradient)" stroke="#ffd700"/>
                <defs>
                    <linearGradient id="goldGradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#ffd700"/>
                        <stop offset="1" stop-color="#ff8800"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="poster-title">1,000,000 XP Jackpot</div>
            <div class="poster-sub">Match exactly 3 identical icons to win big & climb the leaderboard! Cost: 505 Coins per card.</div>
        </div>

        <!-- Arena Action & Scratch Matrix -->
        <div class="arena-action-box">
            <button id="buyCardBtn" class="buy-btn" onclick="buyScratchCard()">Buy Scratch Card (500 🪙)</button>
            
            <div id="scratchContainer" style="display:none; margin-top: 20px;">
                <div class="scratch-grid" id="scratchGrid">
                    <!-- 12 Slots populated dynamically -->
                </div>
                <div id="resultMessage" style="margin-top: 15px; font-weight: 800; font-size: 15px;"></div>
            </div>
        </div>

        <!-- Recent Payouts History -->
        <div class="history-section">
            <div class="history-title">Recent Elite Payouts</div>
            <div class="history-list" id="payoutHistoryList">
                <div class="history-item epic">
                    <div><span class="winner-tag">Sovereign_X</span> won <span class="prize-highlight">1,000,000 XP Jackpot</span></div>
                    <span style="font-size:11px; color:var(--text-muted);">Just now</span>
                </div>
                <div class="history-item epic">
                    <div><span class="winner-tag">CryptoKing99</span> won <span class="prize-highlight">50,000 XP</span></div>
                    <span style="font-size:11px; color:var(--text-muted);">2m ago</span>
                </div>
                <div class="history-item">
                    <div><span class="winner-tag">PixVinzPlayer</span> won <span class="prize-highlight">20,000 Coins</span></div>
                    <span style="font-size:11px; color:var(--text-muted);">5m ago</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Initialization Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPFmx35ClB3c5vGBtv8rzVAiTK4rcwAik",
            authDomain: "pixvinz2026.firebaseapp.com",
            projectId: "pixvinz2026",
            storageBucket: "pixvinz2026.firebasestorage.app",
            messagingSenderId: "45609077809",
            appId: "1:45609077809:web:575611e46acda9f64c5910",
            measurementId: "G-W7FSERE8ZJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.pixvinzDb = { db, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit };

        function getCurrentUsername() {
            try {
                const userObj = JSON.parse(localStorage.getItem('loggedInUser'));
                if (userObj && userObj.username) return userObj.username;
            } catch (e) {}
            return localStorage.getItem('vinpix_username') || 'GuestPlayer';
        }

        window.updateTopBalances = function() {
            const username = getCurrentUsername();
            const prefix = username ? username + '_' : '';
            const coins = parseInt(localStorage.getItem(prefix + 'totalCoins')) || 0;
            const xp = parseInt(localStorage.getItem(prefix + 'totalXp')) || 0;

            document.getElementById('headerCoins').textContent = coins.toLocaleString();
            document.getElementById('headerXp').textContent = xp.toLocaleString();
        }

        let activeCardData = null;

        window.buyScratchCard = async function() {
            const username = getCurrentUsername();
            const prefix = username ? username + '_' : '';
            let coins = parseInt(localStorage.getItem(prefix + 'totalCoins')) || 0;

            if (coins < 500) {
                alert("Not enough coins! You need 500 coins to buy a scratch card.");
                return;
            }

            // Deduct 500 coins
            coins -= 500;
            localStorage.setItem(prefix + 'totalCoins', coins);
            window.updateTopBalances();

            const buyBtn = document.getElementById('buyCardBtn');
            buyBtn.disabled = true;
            buyBtn.textContent = "Fetching Card from Vault...";

            try {
                // Fetch a random card from Firestore pool (card_0001 to card_1000)
                const randomCardNum = String(Math.floor(Math.random() * 1000) + 1).padStart(4, '0');
                const cardRef = doc(db, "scratch_cards", `card_${randomCardNum}`);
                const cardSnap = await getDoc(cardRef);

                if (!cardSnap.exists()) {
                    throw new Error("Card data not found in vault.");
                }

                activeCardData = cardSnap.data();
                renderScratchBoard(activeCardData);

                buyBtn.style.display = 'none';
                document.getElementById('scratchContainer').style.display = 'block';

            } catch (err) {
                console.error(err);
                alert("Error fetching scratch card. Refund issued.");
                coins += 500;
                localStorage.setItem(prefix + 'totalCoins', coins);
                window.updateTopBalances();
                buyBtn.disabled = false;
                buyBtn.textContent = "Buy Scratch Card (500 🪙)";
            }
        }

        function renderScratchBoard(cardData) {
            const gridEl = document.getElementById('scratchGrid');
            gridEl.innerHTML = '';

            cardData.grid.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'scratch-slot';

                // Check if item is custom image file or filler emoji
                let contentHTML = item;
                if (item.endsWith('.png')) {
                    contentHTML = `<img src="image/${item}" alt="icon">`;
                }

                slot.innerHTML = `
                    ${contentHTML}
                    <div class="scratch-cover" onclick="revealSlot(this)">SCRATCH</div>
                `;
                gridEl.appendChild(slot);
            });
        }

        window.revealSlot = function(coverElement) {
            coverElement.classList.add('revealed');

            // Check if all slots are scratched
            const covers = document.querySelectorAll('.scratch-cover');
            const unrevealed = Array.from(covers).some(c => !c.classList.contains('revealed'));

            if (!unrevealed) {
                evaluateCardResult(activeCardData);
            }
        }

        function evaluateCardResult(card) {
            const resultMsg = document.getElementById('resultMessage');
            const username = getCurrentUsername();
            const prefix = username ? username + '_' : '';

            if (card.isWinner) {
                resultMsg.style.color = 'var(--gold)';
                resultMsg.textContent = `🎉 WINNER! You won ${card.prizeValue.toLocaleString()} ${card.prizeType.toUpperCase()}`;

                if (card.prizeType === 'coin') {
                    let totalCoins = parseInt(localStorage.getItem(prefix + 'totalCoins')) || 0;
                    totalCoins += card.prizeValue;
                    localStorage.setItem(prefix + 'totalCoins', totalCoins);
                } else if (card.prizeType === 'xp') {
                    let totalXp = parseInt(localStorage.getItem(prefix + 'totalXp')) || 0;
                    totalXp += card.prizeValue;
                    localStorage.setItem(prefix + 'totalXp', totalXp);
                }
                window.updateTopBalances();

                // Trigger cloud synchronization if available
                if (typeof window.saveUserDataToCloud === 'function') {
                    window.saveUserDataToCloud();
                }
            } else {
                resultMsg.style.color = '#ff5252';
                resultMsg.textContent = `❌ No match! Better luck next time.`;
            }

            // Show play again button
            setTimeout(() => {
                const buyBtn = document.getElementById('buyCardBtn');
                buyBtn.disabled = false;
                buyBtn.textContent = "Buy Another Card (500 🪙)";
                buyBtn.style.display = 'block';
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.updateTopBalances();
        });
    </script>
</body>
</html>
