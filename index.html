<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixVinz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header Bar -->
    <header class="top-bar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline>
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <!-- HOME PAGE VIEW -->
    <section id="homeView" class="view active">
      <div class="card welcome-card">
        <p class="sub-title">WELCOME</p>
        <h2 class="user-name">Vinz</h2>
        <button class="btn btn-primary" id="playBtn">▶ PLAY</button>
      </div>

      <div class="card menu-card" id="navLevels">
        <div class="card-icon">🎮</div>
        <div class="card-text">
          <h3>LEVELS</h3>
          <p>Play and unlock new puzzles</p>
        </div>
        <span class="arrow">›</span>
      </div>

      <div class="card menu-card" id="navCollections">
        <div class="card-icon">✨</div>
        <div class="card-text">
          <h3>COLLECTIONS</h3>
          <p>View your solved puzzles</p>
        </div>
        <span class="arrow">›</span>
      </div>

      <div class="card menu-card" id="navSettings">
        <div class="card-icon">⚙️</div>
        <div class="card-text">
          <h3>SETTINGS</h3>
          <p>Sound, account and more</p>
        </div>
        <span class="arrow">›</span>
      </div>
    </section>

    <!-- LEVELS PAGE VIEW -->
    <section id="levelsView" class="view">
      <div class="view-header">
        <button class="icon-btn back-btn">‹</button>
        <h2>LEVELS</h2>
      </div>
      <div class="levels-grid" id="levelsGrid"></div>
      <div class="bottom-info-bar">
        🔒 <span id="unlockInfoText">COMPLETE LEVEL 01 TO UNLOCK LEVEL 02</span>
      </div>
    </section>

    <!-- COLLECTIONS PAGE VIEW -->
    <section id="collectionsView" class="view">
      <div class="view-header">
        <button class="icon-btn back-btn">‹</button>
        <h2>COLLECTIONS</h2>
      </div>
      <div class="collections-grid" id="collectionsGrid"></div>
    </section>
  </div>

  <!-- ENLARGED IMAGE POPUP MODAL FOR COLLECTIONS -->
  <div id="imageModal" class="modal-overlay hidden">
    <div class="image-modal-card">
      <div class="image-modal-header">
        <span id="modalLevelTitle">LEVEL 01</span>
        <button class="icon-btn close-modal-btn" id="closeImageModal">✕</button>
      </div>
      <div class="modal-img-container">
        <img id="modalPreviewImg" src="" alt="Enlarged Preview">
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="settings-card">
      <div class="settings-header">
        <h3>SETTINGS</h3>
        <button class="icon-btn close-modal-btn" id="closeSettingsModal">✕</button>
      </div>
      
      <div class="setting-item">
        <span>Sound Effects</span>
        <label class="switch">
          <input type="checkbox" id="sfxToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-item">
        <span>Music</span>
        <label class="switch">
          <input type="checkbox" id="musicToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="settings-actions">
        <button class="btn btn-secondary" id="aboutBtn">ℹ️ ABOUT</button>
        <button class="btn btn-danger" id="logoutBtn">🚪 LOG OUT</button>
      </div>
    </div>
  </div>

  <!-- ABOUT MODAL -->
  <div id="aboutModal" class="modal-overlay hidden">
    <div class="about-card">
      <button class="icon-btn close-modal-btn close-about" id="closeAboutModal">✕</button>
      <div class="about-logo">
        <video autoplay loop muted playsinline>
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <h2>PixVinz</h2>
      <p class="about-dev">Developer: <strong>Kuya Vinz</strong></p>
      <p class="about-year">© 2026</p>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="script.js"></script>
</body>
</html>
