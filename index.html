<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixVinz - Piece Together The Fun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- SCREENS WILL SWITCH HERE -->
        
        <!-- 1. HOME SCREEN -->
        <div id="screen-home" class="screen active">
            <div class="header-logo-container">
                <img src="your-logo-path.png" alt="PixVinz Logo" class="game-logo">
            </div>
            <div class="user-top-bar">
                <div class="user-avatar-level">
                    <img src="avatar.png" alt="Avatar">
                    <span>Level 12</span>
                </div>
                <div class="coin-badge">
                    <span>🪙 160</span>
                </div>
            </div>
            
            <div class="hero-play-section">
                <button class="btn-play-gold">▶ PLAY</button>
                <p class="play-subtext">Continue your journey</p>
            </div>

            <!-- Daily Challenge Card -->
            <div class="card daily-challenge-card">
                <div class="challenge-info">
                    <h3>⚡ DAILY CHALLENGE</h3>
                    <p>Complete today's puzzle</p>
                </div>
                <button class="btn-purple">PLAY NOW</button>
            </div>
        </div>

        <!-- 2. OTHER SCREENS (Levels, Collections, Profile, Settings) -->
        <div id="screen-levels" class="screen">
            <h2>Levels Page</h2>
        </div>
        <div id="screen-collections" class="screen">
            <h2>Collections Page</h2>
        </div>
        <div id="screen-profile" class="screen">
            <h2>Profile Page</h2>
        </div>
        <div id="screen-settings" class="screen">
            <h2>Settings Page</h2>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchScreen('home')">
                🏠<span>Home</span>
            </button>
            <button class="nav-item" onclick="switchScreen('levels')">
                🎮<span>Levels</span>
            </button>
            <button class="nav-item" onclick="switchScreen('collections')">
                🖼️<span>Collections</span>
            </button>
            <button class="nav-item" onclick="switchScreen('profile')">
                👤<span>Profile</span>
            </button>
            <button class="nav-item" onclick="switchScreen('settings')">
                ⚙️<span>Settings</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
