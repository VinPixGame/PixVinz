<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PixVinz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- MAIN MENU -->
<div id="mainMenu" class="menu">
    <video class="logo-video" autoplay loop muted playsinline>
        <source src="image/logo.webm" type="video/webm">
    </video>
    <p style="margin-bottom: 16px;">Piece Together The Fun!</p>

    <button class="btn" onclick="playClick(); startGame()">▶ PLAY</button>
    <button class="btn" onclick="playClick(); openLevels()">🏆 LEVELS</button>
    <button class="btn" onclick="playClick(); openSettings()">⚙ SETTINGS</button>
</div>

<!-- LEVEL SELECT -->
<div id="levelScreen" class="screen hidden">
    <div class="header">
        <button class="btn-sm" onclick="playClick(); closeLevels()">⬅ Back</button>
        <h2>Select Level</h2>
    </div>
    <div id="levelGrid" class="level-grid"></div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="screen hidden">
    <div class="header">
        <span>⏳ <span id="timer">00:00</span></span>
        <span>👣 Moves: <span id="moves">0</span></span>
        <button class="btn-sm" onclick="playClick(); quitGame()">🔙 Menu</button>
    </div>
    <div id="puzzleBoard" class="board"></div>
    <button class="btn" onclick="playClick(); shuffleTiles()">🔀 Shuffle</button>
</div>

<!-- SETTINGS POPUP -->
<div id="settingsPopup" class="popup hidden">
    <div class="popup-box">
        <h2 style="margin-bottom: 16px;">⚙ Settings</h2>
        <div class="setting-row">
            <span>🎵 Sound</span>
            <input type="checkbox" id="soundToggle" checked onchange="toggleSound(this.checked)">
        </div>
        <button class="btn" onclick="playClick(); closeSettings()">❌ Close</button>
    </div>
</div>

<script src="audio.js?v=3"></script>
<script src="app.js.js?v=3"></script>
</body>
</html>
