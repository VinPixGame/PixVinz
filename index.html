<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixVinz</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="screen active">
        <div class="loading-content">
            <h1 class="game-title">PixVinz</h1>
            <div class="loader-bar-container">
                <div id="loading-progress-fill" class="loader-fill"></div>
            </div>
            <p id="loading-percentage-text">Loading... 0%</p>
        </div>
    </div>

    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen">
        <div class="menu-container">
            <h1 class="game-title">PixVinz</h1>
            <p class="game-subtitle">Match, Solve, and Conquer!</p>
            <div class="menu-buttons">
                <button id="play-btn" class="primary-btn"><i class="fa-solid fa-play"></i> Play Game</button>
                <button id="levels-btn" class="secondary-btn"><i class="fa-solid fa-list"></i> Level Select</button>
                <button id="settings-btn" class="secondary-btn"><i class="fa-solid fa-gear"></i> Settings</button>
            </div>
        </div>
    </div>

    <!-- Level Select Screen -->
    <div id="levels-screen" class="screen">
        <header class="screen-header">
            <button class="back-btn" data-target="menu-screen"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>Select Level</h2>
            <div class="user-stats">
                <span><i class="fa-solid fa-coins text-gold"></i> <span id="coin-count">0</span></span>
            </div>
        </header>
        <div class="levels-grid-container">
            <div id="levels-grid" class="levels-grid">
                <!-- Dynamically populated level nodes -->
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <header class="game-header">
            <button class="back-btn" data-target="levels-screen"><i class="fa-solid fa-house"></i></button>
            <div class="level-indicator">Level <span id="current-level-num">1</span></div>
            <div class="game-stats">
                <span><i class="fa-solid fa-fire text-orange"></i> <span id="streak-count">0</span></span>
            </div>
        </header>
        <main class="game-board-container">
            <div id="puzzle-board" class="puzzle-board">
                <!-- Dynamic puzzle elements will go here -->
                <p class="game-placeholder-text">Puzzle Board Active</p>
            </div>
        </main>
        <footer class="game-footer">
            <button id="hint-btn" class="action-btn"><i class="fa-solid fa-lightbulb"></i> Hint</button>
            <button id="restart-btn" class="action-btn"><i class="fa-solid fa-rotate-right"></i> Restart</button>
        </footer>
    </div>

    <!-- Settings Screen -->
    <div id="settings-screen" class="screen">
        <header class="screen-header">
            <button class="back-btn" data-target="menu-screen"><i class="fa-solid fa-arrow-left"></i></button>
            <h2>Settings</h2>
        </header>
        <div class="settings-content">
            <div class="setting-item">
                <span>Background Music</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>Sound Effects</span>
                <label class="switch">
                    <input type="checkbox" id="sfx-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>Reset Game Progress</span>
                <button id="reset-data-btn" class="danger-btn">Reset Data</button>
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
