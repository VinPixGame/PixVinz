<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixVinz - Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container game-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="icon-btn" id="backToHome">‹</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline>
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <!-- Level Header & Premium Stats Badges -->
    <div class="game-header">
      <h2 id="levelTitle">LEVEL <span id="levelDisplay">01</span></h2>
      <div class="premium-stats-bar">
        <div class="stat-badge">
          <span class="stat-icon">⏱️</span>
          <div class="stat-info">
            <span class="stat-label">TIME</span>
            <span class="stat-value" id="timerDisplay">00:00</span>
          </div>
        </div>
        <div class="stat-badge">
          <span class="stat-icon">🔄</span>
          <div class="stat-info">
            <span class="stat-label">MOVES</span>
            <span class="stat-value" id="movesDisplay">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3x3 TAP-TO-SWAP BOARD -->
    <div class="puzzle-wrapper">
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>

    <!-- Game Actions -->
    <div class="game-actions">
      <button class="btn btn-secondary" id="collectionsBtn">🖼️ PREVIEW</button>
      <button class="btn btn-primary" id="shuffleBtn">🔀 SHUFFLE</button>
    </div>
  </div>

  <!-- VICTORY POPUP MODAL -->
  <div id="victoryModal" class="modal-overlay hidden">
    <canvas id="confettiCanvas"></canvas>
    <div class="victory-card">
      <h2 class="victory-title">LEVEL CLEARED!</h2>
      <div class="victory-img-container">
        <img id="victoryImg" src="" alt="Completed Puzzle">
      </div>
      <div class="star-rating" id="victoryStars">
        <span class="star active">★</span>
        <span class="star active">★</span>
        <span class="star active">★</span>
      </div>
      <div class="victory-stats">
        <p>Time: <strong id="vTime">00:00</strong></p>
        <p>Moves: <strong id="vMoves">0</strong></p>
        <p>Earned: <strong id="vCoins" style="color:#ffd700;">+0</strong> 🪙</p>
      </div>
      <div class="victory-buttons">
        <button class="btn btn-secondary" id="victoryHomeBtn">🏠 HOME</button>
        <button class="btn btn-primary" id="nextLevelBtn">NEXT ▶</button>
      </div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
