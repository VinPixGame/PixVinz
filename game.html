<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixVinz - Game</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .game-page-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .puzzle-board {
      display: grid;
      gap: 4px;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      background: #11052c;
      padding: 8px;
      border-radius: 16px;
      border: 3px solid #7b2cbf;
      box-shadow: 0 0 20px rgba(123, 44, 191, 0.4);
    }
    .tile {
      background-size: 360px 360px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease;
      box-shadow: inset 0 0 4px rgba(255,255,255,0.3);
    }
    .tile.empty {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }
    .game-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 360px;
    }
    .game-controls .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="app-container game-page-container">
    <header class="top-bar" style="width: 100%;">
      <button class="icon-btn" id="gameBackBtn">‹</button>
      <h2 id="gameLevelTitle" style="color: #ffd700; font-size: 18px;">LEVEL 01</h2>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <div class="puzzle-board" id="puzzleBoard"></div>

    <div class="game-controls">
      <button class="btn btn-secondary" id="shuffleBtn">🔀 SHUFFLE</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
