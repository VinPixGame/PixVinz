<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixVinz - Game</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="top-bar">
      <button class="icon-btn" id="backToHome">‹</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline width="100">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-label">LEVEL</span>
        <span class="stat-value" id="levelDisplay">01</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">TIME</span>
        <span class="stat-value" id="timerDisplay">00:00</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">MOVES</span>
        <span class="stat-value" id="movesDisplay">0</span>
      </div>
    </div>

    <!-- Puzzle Grid Area -->
    <div class="puzzle-container">
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>

    <!-- Action Controls -->
    <div class="action-buttons">
      <button class="btn btn-action" id="shuffleBtn">🔀 SHUFFLE</button>
      <button class="btn btn-action" id="collectionsBtn">✨ COLLECTIONS</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
