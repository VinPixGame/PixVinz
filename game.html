<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixVinz - Isolated Game Test</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- ISOLATED STYLES FOR PREVIEW -->
  <style>
    .pv-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .pv-wrapper.pv-hidden {
      display: none !important;
    }
    .pv-card {
      background: #1a0b2e;
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #ffd700;
      width: 90%;
      max-width: 320px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 100000;
      position: relative;
    }
    .pv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }
    #pv-title {
      color: #ffd700;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .pv-timer-text {
      color: #fff;
      font-size: 12px;
    }
    #pv-countdown {
      color: #ffd700;
      font-weight: bold;
    }
    .pv-icon-close {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .pv-img-box {
      width: 100%;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      overflow: hidden;
    }
    #pv-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="app-container game-container">
    <header class="top-bar">
      <button class="icon-btn" id="backToHome">‹</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto" style="background: transparent;">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">50</span></div>
    </header>

    <h2 id="levelTitle" class="centered-level-title">LEVEL <span id="levelDisplay">01</span></h2>

    <div class="game-header">
      <div class="premium-stats-bar">
        <div class="stat-badge">
          <span class="stat-icon">⏱️</span>
          <div class="stat-info">
            <span class="stat-label">TIME</span>
            <span class="stat-value" id="timerDisplay">00:00</span>
          </div>
        </div>
        <div class="stat-badge">
          <span class="stat-icon">🔄</span>
          <div class="stat-info">
            <span class="stat-label">MOVES</span>
            <span class="stat-value" id="movesDisplay">0</span>
          </div>
        </div>
      </div>
    </div>

    <div class="puzzle-wrapper">
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>

    <div class="game-actions">
      <!-- ISOLATED PREVIEW BUTTON ID -->
      <button class="btn btn-secondary" id="pv-trigger-btn">🖼️ PREVIEW (🪙5)</button>
      <button class="btn btn-primary" id="shuffleBtn">🔀 SHUFFLE</button>
    </div>
  </div>

  <!-- ISOLATED PREVIEW HTML CONTAINER -->
  <div id="pv-container" class="pv-wrapper pv-hidden">
    <div class="pv-card">
      <div class="pv-header">
        <span id="pv-title">LEVEL 01 PREVIEW</span>
        <span class="pv-timer-text">Closing in <span id="pv-countdown">10</span>s</span>
        <button id="pv-close-btn" class="pv-icon-close">✕</button>
      </div>
      <div class="pv-img-box">
        <img id="pv-image" src="" alt="Level Solution Preview">
      </div>
    </div>
  </div>

  <!-- ISOLATED EMBEDDED SCRIPT FOR TESTING -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentLevel = 1;
      const imageSrc = 'image/level1.jpeg'; // Hardcoded test path

      const container = document.getElementById('pv-container');
      const imgElement = document.getElementById('pv-image');
      const titleElement = document.getElementById('pv-title');
      const countdownSpan = document.getElementById('pv-countdown');
      const triggerBtn = document.getElementById('pv-trigger-btn');
      const closeBtn = document.getElementById('pv-close-btn');

      let pvTimer = null;
      let pvCountdownInterval = null;

      function dismissPreview() {
        if (container) container.classList.add('pv-hidden');
        if (pvTimer) clearTimeout(pvTimer);
        if (pvCountdownInterval) clearInterval(pvCountdownInterval);
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', dismissPreview);
      }

      if (triggerBtn) {
        triggerBtn.addEventListener('click', () => {
          console.log("Isolated Preview clicked!");
          if (imgElement) imgElement.src = imageSrc;
          if (titleElement) titleElement.innerText = `LEVEL 01 PREVIEW`;
          
          let timeLeft = 10;
          if (countdownSpan) countdownSpan.innerText = timeLeft;
          if (container) container.classList.remove('pv-hidden');

          if (pvTimer) clearTimeout(pvTimer);
          if (pvCountdownInterval) clearInterval(pvCountdownInterval);

          pvCountdownInterval = setInterval(() => {
            timeLeft--;
            if (countdownSpan) countdownSpan.innerText = timeLeft;
            if (timeLeft <= 0) clearInterval(pvCountdownInterval);
          }, 1000);

          pvTimer = setTimeout(() => {
            dismissPreview();
          }, 10000);
        });
      }
    });
  </script>

</body>
</html>
