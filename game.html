<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixVinz - Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container game-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="icon-btn" id="backToHome">‹</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto" style="background: transparent;">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <!-- Level Header & Premium Stats Badges -->
    <div class="game-header">
      <h2 id="levelTitle">LEVEL <span id="levelDisplay">01</span></h2>
      <div class="premium-stats-bar">
        <div class="stat-badge">
          <span class="stat-icon">⏱️</span>
          <div class="stat-info">
            <span class="stat-label">TIME</span>
            <span class="stat-value" id="timerDisplay">00:00</span>
          </div>
        </div>
        <div class="stat-badge">
          <span class="stat-icon">🔄</span>
          <div class="stat-info">
            <span class="stat-label">MOVES</span>
            <span class="stat-value" id="movesDisplay">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 3x3 TAP-TO-SWAP BOARD -->
    <div class="puzzle-wrapper">
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>

    <!-- Game Actions -->
    <div class="game-actions">
      <button class="btn btn-secondary" id="previewBtn">🖼️ PREVIEW</button>
      <button class="btn btn-primary" id="shuffleBtn">🔀 SHUFFLE</button>
    </div>
  </div>

 <!-- Image Preview Modal (10s Popup with Countdown & Close Button) -->
  <div id="imageModal" class="modal-overlay hidden" style="display: flex; align-items: center; justify-content: center;">
    <div class="modal-content modal-img-container" style="text-align: center; background: #1a0b2e; padding: 18px; border-radius: 16px; border: 2px solid #ffd700; max-width: 90%; width: 320px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;">
      <h3 id="modalLevelTitle" style="color: #ffd700; margin-bottom: 8px; font-size: 16px; letter-spacing: 1px;">LEVEL PREVIEW</h3>
      <img id="modalPreviewImg" src="" alt="Level Preview" style="width: 100%; max-height: 45vh; object-fit: contain; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 10px;">
      <div id="previewCountdown" style="color: #fff; font-size: 13px; margin-bottom: 10px;">Closing in <span id="countdownSeconds" style="color: #ffd700; font-weight: bold;">10</span>s</div>
      <button id="closePreviewBtn" class="btn btn-primary" style="width: 100%; padding: 10px; font-weight: bold; background: #ffd700; color: #1a0b2e; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;">CLOSE</button>
    </div>
  </div>

  <!-- Victory Modal -->
  <div id="victoryModal" class="modal-overlay hidden">
    <canvas id="confettiCanvas"></canvas>

    <div class="victory-card-pro">
      <div class="top-crest-badge">
        <div class="badge-shield">⭐</div>
      </div>

      <div class="banner-ribbon">
        <h1 class="victory-title-pro">LEVEL CLEARED!</h1>
      </div>
      <div class="victory-subtitle-pro">✦ Amazing work! ✦</div>

      <div class="victory-img-container-pro">
        <img id="victoryImg" src="" alt="Solved Puzzle">
      </div>

      <div class="star-rating-pro" id="victoryStars">
        <span class="star star-pro active">★</span>
        <span class="star star-pro active">★</span>
        <span class="star star-pro active">★</span>
      </div>

      <div class="stats-panel-pro">
        <div class="stat-col">
          <span class="stat-icon-pro">⏱️</span>
          <span class="stat-label-pro">TIME</span>
          <span class="stat-value-pro" id="vTime">00:00</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-col">
          <span class="stat-icon-pro">👣</span>
          <span class="stat-label-pro">MOVES</span>
          <span class="stat-value-pro" id="vMoves">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-col">
          <span class="stat-icon-pro">🪙</span>
          <span class="stat-label-pro">EARNED</span>
          <span class="stat-value-pro gold-val" id="vCoins">+0</span>
        </div>
      </div>

      <div class="victory-buttons-pro">
        <button class="btn-pro btn-home-pro" id="victoryHomeBtn">
          <span>🏠</span> HOME
        </button>
        <button class="btn-pro btn-next-pro" id="nextLevelBtn">
          NEXT ▶
        </button>
      </div>
    </div>
  </div>
    
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
