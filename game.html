<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PixVinz - Game</title>
  <link rel="stylesheet" href="style.css">

  <!-- EMBEDDED PREVIEW STYLES -->
  <style>
    .pv-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .pv-wrapper.pv-hidden {
      display: none !important;
    }
    .pv-card {
      background: #1a0b2e;
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #ffd700;
      width: 90%;
      max-width: 320px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 100000;
      position: relative;
    }
    .pv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }
    #pv-title {
      color: #ffd700;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .pv-timer-text {
      color: #fff;
      font-size: 12px;
    }
    #pv-countdown {
      color: #ffd700;
      font-weight: bold;
    }
    .pv-icon-close {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    .pv-img-box {
      width: 100%;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      overflow: hidden;
    }
    #pv-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="app-container game-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="icon-btn" id="backToHome">‹</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto" style="background: transparent;">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <!-- Level Title -->
    <h2 id="levelTitle" class="centered-level-title">LEVEL <span id="levelDisplay">01</span></h2>

    <!-- Premium Stats Bar -->
    <div class="game-header">
      <div class="premium-stats-bar">
        <div class="stat-badge">
          <span class="stat-icon">⏱️</span>
          <div class="stat-info">
            <span class="stat-label">TIME</span>
            <span class="stat-value" id="timerDisplay">00:00</span>
          </div>
        </div>
        <div class="stat-badge">
          <span class="stat-icon">🔄</span>
          <div class="stat-info">
            <span class="stat-label">MOVES</span>
            <span class="stat-value" id="movesDisplay">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Puzzle Board -->
    <div class="puzzle-wrapper">
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>

    <!-- Game Actions -->
    <div class="game-actions">
      <button class="btn btn-secondary" id="pv-trigger-btn">🖼️ PREVIEW (🪙5)</button>
      <button class="btn btn-primary" id="shuffleBtn">🔀 SHUFFLE</button>
    </div>
  </div>

  <!-- EMBEDDED PREVIEW MODAL CONTAINER -->
  <div id="pv-container" class="pv-wrapper pv-hidden">
    <div class="pv-card">
      <div class="pv-header">
        <span id="pv-title">LEVEL 01 PREVIEW</span>
        <span class="pv-timer-text">Closing in <span id="pv-countdown">10</span>s</span>
        <button id="pv-close-btn" class="pv-icon-close">✕</button>
      </div>
      <div class="pv-img-box">
        <img id="pv-image" src="" alt="Level Solution Preview">
      </div>
    </div>
  </div>

  <!-- Victory Modal -->
  <div id="victoryModal" class="modal-overlay hidden">
    <canvas id="confettiCanvas"></canvas>
    <div class="victory-card-pro">
      <div class="top-crest-badge"><div class="badge-shield">⭐</div></div>
      <div class="banner-ribbon"><h1 class="victory-title-pro">LEVEL CLEARED!</h1></div>
      <div class="victory-subtitle-pro">✦ Amazing work! ✦</div>
      <div class="victory-img-container-pro"><img id="victoryImg" src="" alt="Solved Puzzle"></div>
      <div class="star-rating-pro" id="victoryStars">
        <span class="star star-pro active">★</span>
        <span class="star star-pro active">★</span>
        <span class="star star-pro active">★</span>
      </div>
      <div class="stats-panel-pro">
        <div class="stat-col"><span class="stat-icon-pro">⏱️</span><span class="stat-label-pro">TIME</span><span class="stat-value-pro" id="vTime">00:00</span></div>
        <div class="stat-divider"></div>
        <div class="stat-col"><span class="stat-icon-pro">👣</span><span class="stat-label-pro">MOVES</span><span class="stat-value-pro" id="vMoves">0</span></div>
        <div class="stat-divider"></div>
        <div class="stat-col"><span class="stat-icon-pro">🪙</span><span class="stat-label-pro">EARNED</span><span class="stat-value-pro gold-val" id="vCoins">+0</span></div>
        <div class="stat-divider"></div>
        <div class="stat-col"><span class="stat-icon-pro">⚡️</span><span class="stat-label-pro">XP GAINED</span><span class="stat-value-pro" id="vXp">+0</span></div>
      </div>
      <div class="victory-buttons-pro">
        <button class="btn-pro btn-home-pro" id="victoryHomeBtn"><span>🏠</span> HOME</button>
        <button class="btn-pro btn-next-pro" id="nextLevelBtn">NEXT ▶</button>
      </div>
    </div>
  </div>

  <script src="audio.js"></script>

  <!-- Player Stats & Main Game Scripts -->
  <script src="playerstat.js"></script>
  <script type="module" src="game.js"></script>

  <!-- EMBEDDED PREVIEW SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const currentLevel = parseInt(urlParams.get('level')) || 1;

      function getLevelImageIndex(levelNum) {
        return ((levelNum - 1) % 55) + 1;
      }
      const imageSrc = `image/level${getLevelImageIndex(currentLevel)}.jpeg`;

      const container = document.getElementById('pv-container');
      const imgElement = document.getElementById('pv-image');
      const titleElement = document.getElementById('pv-title');
      const countdownSpan = document.getElementById('pv-countdown');
      const triggerBtn = document.getElementById('pv-trigger-btn');
      const closeBtn = document.getElementById('pv-close-btn');

      let pvTimer = null;
      let pvCountdownInterval = null;

      function dismissPreview() {
        if (container) container.classList.add('pv-hidden');
        if (pvTimer) clearTimeout(pvTimer);
        if (pvCountdownInterval) clearInterval(pvCountdownInterval);
      }

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          if (typeof AudioManager !== 'undefined') AudioManager.playClick();
          dismissPreview();
        });
      }

      if (triggerBtn) {
        triggerBtn.addEventListener('click', async () => {
          if (typeof AudioManager !== 'undefined') AudioManager.playClick();

          const previewCost = 5;
          let success = true;

          // Deduct coins using playerstat function or fallback
          if (typeof spendCoins === 'function') {
            success = await spendCoins(previewCost);
          } else {
            let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
            if (totalCoins < previewCost) {
              success = false;
            } else {
              localStorage.setItem('totalCoins', totalCoins - previewCost);
            }
          }

          if (!success) {
            alert("Not enough coins! You need 5 coins to preview the image.");
            return;
          }

          if (typeof updateCoinDisplay === 'function') updateCoinDisplay();

          if (imgElement) imgElement.src = imageSrc;
          if (titleElement) titleElement.innerText = `LEVEL ${currentLevel.toString().padStart(2, '0')} PREVIEW`;
          
          let timeLeft = 10;
          if (countdownSpan) countdownSpan.innerText = timeLeft;
          if (container) container.classList.remove('pv-hidden');

          if (pvTimer) clearTimeout(pvTimer);
          if (pvCountdownInterval) clearInterval(pvCountdownInterval);

          pvCountdownInterval = setInterval(() => {
            timeLeft--;
            if (countdownSpan) countdownSpan.innerText = timeLeft;
            if (timeLeft <= 0) clearInterval(pvCountdownInterval);
          }, 1000);

          pvTimer = setTimeout(() => {
            dismissPreview();
          }, 10000);
        });
      }
    });
  </script>
</body>
</html>
