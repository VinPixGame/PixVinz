<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixVinz - Coin Craze</title>
    <link rel="stylesheet" href="coincraze.css">
</head>
<body>

    <header class="top-bar">
      <button class="icon-btn" id="backBtn">←</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </header>

    <main class="game-wrapper">
      <div class="coin-pusher-container" id="pusherContainer">
        <!-- Ornate frame background asset -->
        <img src="image/coincraze1.png" alt="Coin Craze Frame" class="game-frame-bg">
        
        <!-- Internal gameplay area mapped precisely inside the frame cutout -->
        <div class="game-play-area" id="playArea">
          <!-- Mechanical Pusher Plate -->
          <div class="pusher-plate" id="pusherPlate"></div>
        </div>

        <!-- Control Deck: Shake Meter & Drop Button -->
        <div class="drop-control-deck">
          <div class="shake-panel">
            <div class="shake-bar-container">
              <div class="shake-bar-fill" id="shakeBarFill"></div>
            </div>
            <button class="shake-btn" id="shakeBtn" disabled>⚡ SHAKE (0%)</button>
          </div>
          <button class="drop-btn" id="dropCoinBtn">🪙 DROP COIN (-5.00)</button>
        </div>
      </div>
    </main>


    <script src="profile.js"></script>
    <script src="audio.js"></script>
    <script src="coincraze.js"></script>
</body>
</html>
