<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Craze - 3D Two-Tier Coin Pusher</title>
  <link rel="stylesheet" href="coincraze.css">
</head>
<body>
  <div class="arcade-cabinet">
    <!-- Top Header / Scoreboard -->
    <header class="arcade-header">
      <button id="backBtn" class="arcade-btn secondary-btn">← Back</button>
      <div class="score-board">
        <span class="label">Coins:</span> <span id="coinCount">0.00</span>
      </div>
    </header>

    <!-- Main Game Frame (Interactive Border) -->
    <div id="pusherContainer" class="pusher-container">
      <div id="playArea" class="play-area">
        <!-- Mechanical Pusher Plate -->
        <div id="pusherPlate" class="pusher-plate"></div>
      </div>
    </div>

    <!-- Control Deck -->
    <div class="control-deck">
      <button id="dropCoinBtn" class="arcade-btn primary-btn">Drop Coin (5 Coins)</button>
      <div class="shake-container">
        <div class="shake-bar-bg">
          <div id="shakeBarFill" class="shake-bar-fill"></div>
        </div>
        <button id="shakeBtn" class="arcade-btn shake-btn" disabled>⚡ SHAKE (0%)</button>
      </div>
    </div>
  </div>

  <script src="coincraze.js"></script>
</body>
</html>
