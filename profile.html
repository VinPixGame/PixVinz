<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile - VinPixGame</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="profile-container">
        <!-- Header with Back Button -->
        <div class="profile-header" style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 20px;">
            <button class="back-btn" onclick="goHome()" style="position: absolute; left: 0;">← Back</button>
            <h1 style="margin: 0; font-size: 1.5rem; text-align: center;">Player Profile</h1>
        </div>

        <!-- Profile Card -->
        <div class="profile-card">
            <!-- Avatar Display & Upload -->
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img id="avatar-preview" src="image/default-avatar.png" alt="Profile Avatar" onerror="this.src='https://via.placeholder.com/120/4a154b/ffffff?text=Avatar'">
                </div>
                <label for="avatar-input" class="upload-btn">Choose Avatar</label>
                <input type="file" id="avatar-input" accept="image/*" style="display: none;">
            </div>

            <!-- Player Name Display Row with Small Edit Button -->
            <div class="profile-info-row" style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px;">
                <div class="info-label-group">
                    <span style="font-size: 0.85rem; opacity: 0.7; display: block;">Player Name</span>
                    <h3 id="displayPlayerName" style="margin: 2px 0 0 0; font-size: 1.2rem;">Ulala</h3>
                </div>
                <button class="btn btn-secondary" id="openEditNameModal" style="padding: 6px 14px; font-size: 0.85rem; width: auto;">Edit</button>
            </div>

            <!-- Badges Section -->
            <div class="badges-section" style="margin-top: 20px;">
                <h3 style="font-size: 1rem; margin-bottom: 10px; opacity: 0.9;">Badges</h3>
                <div class="badges-grid" id="badgesGrid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                    <div class="badge-item unlocked" title="First Step: Completed Level 1" style="background: rgba(156,39,176,0.2); border: 1px solid #9c27b0; border-radius: 10px; padding: 10px; text-align: center; font-size: 1.5rem;">🧩</div>
                    <div class="badge-item locked" title="Speed Demon: Beat a level fast" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; text-align: center; font-size: 1.5rem; opacity: 0.4;">⚡</div>
                    <div class="badge-item locked" title="Coin Collector: Earn 500 coins" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; text-align: center; font-size: 1.5rem; opacity: 0.4;">🪙</div>
                    <div class="badge-item locked" title="Pixel Master: Complete all levels" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; text-align: center; font-size: 1.5rem; opacity: 0.4;">⭐</div>
                </div>
            </div>
        </div>
    </div>

<!-- Badges Section -->
<div class="badges-section" style="margin-top: 20px;">
    <h3 style="font-size: 1rem; margin-bottom: 12px; opacity: 0.9;">Badges</h3>
    <div class="badges-grid" id="badgesGrid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
        
        <!-- Badge 1 -->
        <div class="badge-card unlocked" style="background: rgba(255,255,255,0.05); border: 1px solid #9c27b0; border-radius: 12px; padding: 12px; text-align: center; display: flex; align-items: center; gap: 12px;">
            <div style="font-size: 1.8rem; background: rgba(156,39,176,0.2); padding: 8px; border-radius: 8px;">🧩</div>
            <div style="text-align: left;">
                <div style="font-weight: bold; font-size: 0.9rem; color: #fff;">First Step</div>
                <div style="font-size: 0.7rem; opacity: 0.6;">Completed Level 1</div>
            </div>
        </div>

        <!-- Badge 2 -->
        <div class="badge-card locked" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; text-align: center; display: flex; align-items: center; gap: 12px; opacity: 0.4;">
            <div style="font-size: 1.8rem; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px;">⚡</div>
            <div style="text-align: left;">
                <div style="font-weight: bold; font-size: 0.9rem; color: #fff;">Speed Demon</div>
                <div style="font-size: 0.7rem; opacity: 0.6;">Beat a level fast</div>
            </div>
        </div>

        <!-- Badge 3 -->
        <div class="badge-card locked" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; text-align: center; display: flex; align-items: center; gap: 12px; opacity: 0.4;">
            <div style="font-size: 1.8rem; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px;">🪙</div>
            <div style="text-align: left;">
                <div style="font-weight: bold; font-size: 0.9rem; color: #fff;">Coin Collector</div>
                <div style="font-size: 0.7rem; opacity: 0.6;">Earn 500 coins</div>
            </div>
        </div>

        <!-- Badge 4 -->
        <div class="badge-card locked" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; text-align: center; display: flex; align-items: center; gap: 12px; opacity: 0.4;">
            <div style="font-size: 1.8rem; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px;">⭐</div>
            <div style="text-align: left;">
                <div style="font-weight: bold; font-size: 0.9rem; color: #fff;">Pixel Master</div>
                <div style="font-size: 0.7rem; opacity: 0.6;">Complete all levels</div>
            </div>
        </div>

    </div>
</div>

    
    <!-- EDIT NAME POPUP MODAL -->
    <div id="editNameModal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div class="settings-card" style="background: #2a1147; padding: 25px; border-radius: 16px; width: 90%; max-width: 350px; border: 2px solid #9c27b0; position: relative;">
            <div class="settings-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; font-size: 1.1rem;">EDIT PLAYER NAME</h3>
                <button class="icon-btn close-modal-btn" id="closeEditNameModal" style="background: transparent; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;">✕</button>
            </div>
            
            <div class="input-group" style="margin-bottom: 15px;">
                <input type="text" id="username-input" placeholder="Enter new name..." maxlength="15" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #9c27b0; background: rgba(0,0,0,0.2); color: #fff;">
            </div>
            <p id="save-status" class="save-status" style="margin: 5px 0 15px 0; font-size: 0.9rem; text-align: center;"></p>

            <div class="settings-actions">
                <button id="save-profile-btn" class="btn btn-primary" style="width: 100%;">Save Name</button>
            </div>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
