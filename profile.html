<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Player Profile - PixVinz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="profile-container">
        <!-- Header with Back Button -->
        <div class="profile-header">
            <button class="back-btn" onclick="goHome()"><span>←</span> Back</button>
            <h1>Player Profile</h1>
        </div>

        <!-- Profile Card -->
        <div class="profile-card">
            <!-- Avatar Display & Upload with Loading State -->
            <div class="avatar-section">
                <div class="avatar-wrapper" id="avatarWrapper">
                    <img id="avatar-preview" src="image/default-avatar.png" alt="Profile Avatar" onerror="this.src='https://via.placeholder.com/120/4a154b/ffffff?text=Avatar'">
                    <div class="avatar-loader" id="avatarLoader" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </div>
                <label for="avatar-input" class="upload-btn">Choose Avatar</label>
                <input type="file" id="avatar-input" accept="image/*" style="display: none;">
            </div>

            <!-- Player Name Display Row with Small Edit Button -->
            <div class="profile-info-row">
                <div class="info-label-group">
                    <span class="info-subtitle">Player Name</span>
                    <h3 id="displayPlayerName">Ulala</h3>
                </div>
                <button class="btn btn-secondary" id="openEditNameModal">Edit</button>
            </div>

            <!-- Badges Section -->
            <div class="badges-section">
                <h3>Badges</h3>
                <div class="badges-grid" id="badgesGrid">
                    
                    <!-- Emerald Badge -->
                    <div class="badge-card emerald unlocked">
                        <div class="badge-gem">🧩</div>
                        <div class="badge-info">
                            <div class="badge-title">First Step</div>
                            <div class="badge-desc">Completed Level 1</div>
                        </div>
                    </div>

                    <!-- Sapphire Badge -->
                    <div class="badge-card sapphire locked">
                        <div class="badge-gem">⚡</div>
                        <div class="badge-info">
                            <div class="badge-title">Speed Demon</div>
                            <div class="badge-desc">Beat a level fast</div>
                        </div>
                    </div>

                    <!-- Ruby Badge -->
                    <div class="badge-card ruby locked">
                        <div class="badge-gem">🪙</div>
                        <div class="badge-info">
                            <div class="badge-title">Coin Collector</div>
                            <div class="badge-desc">Earn 500 coins</div>
                        </div>
                    </div>

                    <!-- Diamond Badge -->
                    <div class="badge-card diamond locked">
                        <div class="badge-gem">⭐</div>
                        <div class="badge-info">
                            <div class="badge-title">Pixel Master</div>
                            <div class="badge-desc">Complete all levels</div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- XP Progress Bar Section -->
            <div class="xp-section">
                <div class="xp-header-row">
                    <span id="displayLevelBadge">LEVEL 1</span>
                    <span id="displayXpText">0 / 500 XP</span>
                </div>
                <!-- Progress Track -->
                <div class="xp-track">
                    <div id="displayXpBarFill" class="xp-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT NAME POPUP MODAL -->
    <div id="editNameModal" class="modal-overlay hidden">
        <div class="settings-card">
            <div class="settings-header">
                <h3>EDIT PLAYER NAME</h3>
                <button class="icon-btn close-modal-btn" id="closeEditNameModal">✕</button>
            </div>
            
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Enter new name..." maxlength="15">
            </div>
            <p id="save-status" class="save-status"></p>

            <div class="settings-actions">
                <button id="save-profile-btn" class="btn btn-primary">Save Name</button>
            </div>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
