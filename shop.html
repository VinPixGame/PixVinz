<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PixVinz - Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Header Bar -->
  <header class="top-bar" id="mainHeader">
    <button class="icon-btn" id="profileHeaderBtn" onclick="window.location.href='index.html'">
      <span id="profileIconFallback">👤</span>
      <img id="profileHeaderImg" src="" alt="Avatar">
    </button>
    <div class="logo-container">
      <video id="logoVideo" autoplay loop muted playsinline preload="auto">
        <source src="image/logo.webm" type="video/webm">
      </video>
    </div>
    <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
  </header>

  <!-- SHOP PAGE VIEW -->
  <section id="shopView" class="view">
    <div class="view-header">
      <button class="icon-btn back-btn" onclick="window.location.href='index.html'">‹</button>
      <div class="header-title-group">
        <div class="level-title-wrapper">
          <span class="diamond-line">◇───</span>
          <h2>SHOP</h2>
          <span class="diamond-line">───◇</span>
        </div>
      </div>
    </div>

    <!-- 3-COLUMN GRID CONTENT (6 BOXES) -->
    <div class="shop-container">
      <div class="shop-grid">

        <!-- Box 1 -->
        <div class="shop-card">
          <div class="shop-card-icon">🪙</div>
          <div class="shop-card-title">100 Coins</div>
          <div class="shop-card-desc">Handful of coins</div>
          <button class="shop-buy-btn" onclick="buyItem('100 Coins', '$0.99')">$0.99</button>
        </div>

        <!-- Box 2 -->
        <div class="shop-card">
          <div class="shop-card-icon">💰</div>
          <div class="shop-card-title">500 Coins</div>
          <div class="shop-card-desc">+50 Bonus</div>
          <button class="shop-buy-btn" onclick="buyItem('500 Coins', '$3.99')">$3.99</button>
        </div>

        <!-- Box 3 -->
        <div class="shop-card">
          <div class="shop-card-icon">💎</div>
          <div class="shop-card-title">1200 Coins</div>
          <div class="shop-card-desc">+200 Bonus</div>
          <button class="shop-buy-btn" onclick="buyItem('1200 Coins', '$7.99')">$7.99</button>
        </div>

        <!-- Box 4 -->
        <div class="shop-card">
          <div class="shop-card-icon">💡</div>
          <div class="shop-card-title">3x Hints</div>
          <div class="shop-card-desc">Puzzle clues</div>
          <button class="shop-buy-btn" onclick="buyItem('3x Hints', '50 Coins')">🪙 50</button>
        </div>

        <!-- Box 5 -->
        <div class="shop-card">
          <div class="shop-card-icon">⏱️</div>
          <div class="shop-card-title">Time Freeze</div>
          <div class="shop-card-desc">+30 Secs</div>
          <button class="shop-buy-btn" onclick="buyItem('Time Freeze', '30 Coins')">🪙 30</button>
        </div>

        <!-- Box 6 -->
        <div class="shop-card">
          <div class="shop-card-icon">🎁</div>
          <div class="shop-card-title">VIP Pass</div>
          <div class="shop-card-desc">Unlock all</div>
          <button class="shop-buy-btn" onclick="buyItem('VIP Pass', '$9.99')">$9.99</button>
        </div>

      </div>
    </div>
  </section>

  <script>
    function buyItem(itemName, price) {
      alert(`Selected: ${itemName} for ${price}`);
    }
  </script>
</body>
</html>
