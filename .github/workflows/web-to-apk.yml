name: Build Web APK

on:
  push:
    branches: [ apk-build-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and Build Android APK
        run: |
          npm install -g cordova
          cordova create myApp com.pixvinz.app PixVinzApp
          cd myApp
          cordova platform add android
          cp -r ../* www/ 2>/dev/null || true
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixVinz-App
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
