name: Build Web APK

on:
  push:
    branches: [ Sample  ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and Build Android APK
        run: |
          npm install -g cordova
          cordova create myApp com.pixvinz.app PixVinz
          cd myApp
          cordova platform add android
          
          # Point the app to your live GitHub Pages URL for automatic online updates
          sed -i 's|<content src="index.html" />|<content src="https://vinpixgame.github.io/PixVinz/" />|g' config.xml
          
          # Set the visible display name of the app to PixVinz
          sed -i 's|<name>PixVinzApp</name>|<name>PixVinz</name>|g' config.xml
          
          # Force the app to stay inside the app container instead of opening an external browser
          sed -i '/<widget /a \    <allow-navigation href="https://vinpixgame.github.io/*" />' config.xml
          sed -i '/<widget /a \    <access origin="https://vinpixgame.github.io/*" />' config.xml
          
          # Match the native splash background with your dark theme color
          sed -i '/<widget /a \    <preference name="BackgroundColor" value="0xFF1A0B2E" />' config.xml
          sed -i '/<widget /a \    <preference name="SplashScreenBackgroundColor" value="#1a0b2e" />' config.xml
          
          # Use your custom logo and ensure it scales correctly to match your web loading screen
          if [ -f ../image/logo.png ]; then
            mkdir -p res/screen/android
            cp ../image/logo.png res/screen/android/splash.png
            sed -i '/<widget /a \    <splash src="res/screen/android/splash.png" />' config.xml
            sed -i '/<widget /a \    <preference name="SplashScreenDelay" value="3000" />' config.xml
            sed -i '/<widget /a \    <preference name="FadeSplashScreen" value="true" />' config.xml
            sed -i '/<widget /a \    <preference name="FadeSplashScreenDuration" value="500" />' config.xml
            sed -i '/<widget /a \    <preference name="ShowSplashScreenSpinner" value="false" />' config.xml
            sed -i '/<widget /a \    <preference name="SplashMaintainAspectRatio" value="true" />' config.xml
          fi
          
          # Set up your custom app icon from the image folder
          if [ -f ../image/pixvinz.png ]; then
            mkdir -p res/icon/android
            cp ../image/pixvinz.png res/icon/android/icon.png
            sed -i '/<widget /a \    <icon src="res/icon/android/icon.png" />' config.xml
          fi


          cordova build android --debug

      - name: Rename and Prepare APK
        run: |
          mkdir -p final-apk
          cp myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk final-apk/PixVinz.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixVinz
          path: final-apk/PixVinz.apk
          
