name: Build Web APK

on:
  push:
    branches: [ Sample ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Cordova
        run: |
          npm install -g cordova
          cordova --version
          node --version
          npm --version

      - name: Create PixVinz Cordova App
        run: |
          cordova create myApp com.pixvinz.app PixVinz

      - name: Configure PixVinz
        working-directory: myApp
        run: |
          cordova platform add android

          # Load the live PixVinz website
          sed -i 's|<content src="index.html" />|<content src="https://vinpixgame.github.io/PixVinz/" />|' config.xml

          # App name
          sed -i 's|<name>PixVinzApp</name>|<name>PixVinz</name>|' config.xml

          # Allow the PixVinz website and Firebase services
          sed -i '/<widget /a \    <allow-navigation href="*" />' config.xml
          sed -i '/<widget /a \    <access origin="*" />' config.xml

          # Remove Cordova splash delay
          sed -i '/<widget /a \    <preference name="SplashScreenDelay" value="0" />' config.xml
          sed -i '/<widget /a \    <preference name="AutoHideSplashScreen" value="true" />' config.xml
          sed -i '/<widget /a \    <preference name="FadeSplashScreen" value="false" />' config.xml

          # Background shown only while the WebView starts
          sed -i '/<widget /a \    <preference name="BackgroundColor" value="0xFF1A0B2E" />' config.xml

          # PixVinz icon
          if [ -f ../image/pixvinz.png ]; then
            mkdir -p res/icon/android
            cp ../image/pixvinz.png res/icon/android/icon.png
            sed -i '/<widget /a \    <icon src="res/icon/android/icon.png" />' config.xml
          fi

          echo "===== CONFIG.XML ====="
          cat config.xml
          echo "======================"

      - name: Build PixVinz APK
        working-directory: myApp
        run: |
          cordova build android --debug --verbose

      - name: Prepare APK
        run: |
          mkdir -p final-apk

          if [ ! -f myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK was not created."
            find myApp/platforms/android -type f -name "*.apk" -print
            exit 1
          fi

          cp myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk final-apk/PixVinz.apk

          ls -lh final-apk/PixVinz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixVinz
          path: final-apk/PixVinz.apk
