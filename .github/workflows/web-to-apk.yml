name: Build Web APK

on:
  push:
    branches: [ Sample ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and Build Android APK
        run: |
          npm install -g cordova

          cordova create myApp com.pixvinz.app PixVinz
          cd myApp

          cordova platform add android

          # Copy the actual PixVinz website into the APK
          rm -rf www/*
          cp -r ../* www/

          # Remove repository-only files from the Cordova web folder
          rm -rf www/.git
          rm -rf www/.github
          rm -rf www/myApp

          # Set the visible display name
          sed -i 's|<name>PixVinzApp</name>|<name>PixVinz</name>|g' config.xml

          # Keep network access available for Firebase, Firestore and other services
          sed -i '/<widget /a \    <access origin="*" />' config.xml
          sed -i '/<widget /a \    <allow-navigation href="*" />' config.xml

          # Native background
          sed -i '/<widget /a \    <preference name="BackgroundColor" value="0xFF1A0B2E" />' config.xml

          # Remove artificial splash delay
          sed -i '/<widget /a \    <preference name="SplashScreenDelay" value="0" />' config.xml
          sed -i '/<widget /a \    <preference name="FadeSplashScreen" value="false" />' config.xml
          sed -i '/<widget /a \    <preference name="ShowSplashScreenSpinner" value="false" />' config.xml
          sed -i '/<widget /a \    <preference name="AutoHideSplashScreen" value="true" />' config.xml

          # Use PixVinz logo as the app icon
          if [ -f ../image/pixvinz.png ]; then
            mkdir -p res/icon/android
            cp ../image/pixvinz.png res/icon/android/icon.png
            sed -i '/<widget /a \    <icon src="res/icon/android/icon.png" />' config.xml
          fi

          cordova build android --debug

      - name: Rename and Prepare APK
        run: |
          mkdir -p final-apk
          cp myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk final-apk/PixVinz.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixVinz
          path: final-apk/PixVinz.apk
