<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PixVinz - Login</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="manifest" href="/PixVinz/manifest.json">
    <meta name="theme-color" content="#121212">
    
</head>
<body>
    <div class="app-container">
        
    <!-- 1. LOGIN PAGE -->
    <section id="loginView" class="view active">

        <button id="install-app-btn" class="install-app-btn glass-install-btn">
            📱 DOWNLOAD APP
        </button>

        <div class="auth-card">

            <div class="auth-logo">
                <video autoplay loop muted playsinline preload="auto" style="background: transparent;">
                    <source src="image/logo.webm" type="video/webm">
                </video>
            </div>

            <h2>LOG IN</h2>

            <form id="loginForm">

                <!-- LOGIN USERNAME -->
                <div class="input-group">
                    <input
                        type="text"
                        id="loginUser"
                        placeholder="Username (min 6 chars, lowercase & number)"
                        required
                    >
                </div>

                <!-- LOGIN PASSWORD -->
                <div class="input-group">

                    <div style="position: relative;">
                        <input
                            type="password"
                            id="loginPass"
                            placeholder="Password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleLoginPass"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #b388ff; font-weight: bold; font-size: 0.85rem;"
                        >Show</button>
                    </div>

                </div>

                <p id="loginError" class="auth-error"></p>

                <button type="submit" class="btn btn-primary">
                    LOG IN
                </button>

            </form>

            <p
                class="auth-switch"
                style="position: relative; z-index: 10; pointer-events: auto;"
            >
                Don't have an account?
                <a
                    href="#"
                    id="toRegister"
                    style="position: relative; z-index: 11; display: inline-block; padding: 5px;"
                >Create Account</a>
            </p>

        </div>
    </section>


    <!-- 2. REGISTER PAGE -->
    <section id="registerView" class="view">

        <button
            id="install-app-btn-ref"
            class="install-app-btn-ref glass-install-btn"
        >
            📱 DOWNLOAD APP
        </button>

        <div class="auth-card">

            <h2>CREATE ACCOUNT</h2>

            <form id="registerForm">

                <!-- DISPLAY NAME -->
                <div class="input-group">
                    <input
                        type="text"
                        id="regDisplayName"
                        placeholder="Display Name (e.g. Vinz)"
                        required
                    >
                </div>


                <!-- USERNAME -->
                <div class="input-group">

                    <div style="display: flex; align-items: center;">

                        <input
                            type="text"
                            id="regUser"
                            placeholder="Username (min 6 chars, lowercase & number)"
                            required
                            style="flex: 1; border-top-right-radius: 0; border-bottom-right-radius: 0;"
                        >

                        <span
                            style="background: rgba(255, 255, 255, 0.1); padding: 12px 10px; border: 1px solid rgba(255, 255, 255, 0.2); border-left: none; border-top-right-radius: 8px; border-bottom-right-radius: 8px; color: #b388ff; font-size: 0.85rem; font-weight: bold; white-space: nowrap;"
                        >@pixvinz.com</span>

                    </div>

                    <!-- USERNAME REQUIREMENT -->
                    <span
                        id="regUserIndicator"
                        style="display: none; color: #ff4d4d; font-size: 0.85rem; font-weight: bold; text-align: left; margin-top: 6px;"
                    ></span>

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <div style="position: relative;">

                        <input
                            type="password"
                            id="regPass"
                            placeholder="Password (6-12 chars, Aa1)"
                            required
                        >

                        <button
                            type="button"
                            id="toggleRegPass"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #b388ff; font-weight: bold; font-size: 0.85rem;"
                        >Show</button>

                    </div>

                    <!-- PASSWORD REQUIREMENT -->
                    <span
                        id="regPassIndicator"
                        style="display: none; color: #ff4d4d; font-size: 0.85rem; font-weight: bold; text-align: left; margin-top: 6px;"
                    ></span>

                </div>


                <!-- REPEAT PASSWORD -->
                <div class="input-group">

                    <div style="position: relative;">

                        <input
                            type="password"
                            id="regPassConfirm"
                            placeholder="Repeat Password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleRegPassConfirm"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #b388ff; font-weight: bold; font-size: 0.85rem;"
                        >Show</button>

                    </div>

                </div>


                <!-- REGISTER ERROR -->
                <p id="regError" class="auth-error"></p>

                <!-- REGISTER BUTTON -->
                <button type="submit" class="btn btn-primary">
                    REGISTER
                </button>

            </form>


            <!-- LOGIN SWITCH -->
            <p
                class="auth-switch"
                style="position: relative; z-index: 10; pointer-events: auto;"
            >
                Already have an account?
                <a
                    href="#"
                    id="toLogin"
                    style="position: relative; z-index: 11; display: inline-block; padding: 5px;"
                >Log In</a>
            </p>

        </div>
    </section>

</div>

    <!-- Firebase Initialization Module Script -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDPFmx35ClB3c5vGBtv8rzVAiTK4rcwAik",
        authDomain: "pixvinz2026.firebaseapp.com",
        projectId: "pixvinz2026",
        storageBucket: "pixvinz2026.firebasestorage.app",
        messagingSenderId: "45609077809",
        appId: "1:45609077809:web:575611e46acda9f64c5910",
        measurementId: "G-W7FSERE8ZJ"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.pixvinzDb = { db, doc, getDoc, setDoc };
      window.pixvinzAuth = { auth, createUserWithEmailAndPassword };
    </script>

    <script src="auth.js"></script>
</body>
</html>
