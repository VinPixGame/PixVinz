<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PixVinz Card Generator</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    button {
      background: #eab308;
      color: #0f172a;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    #status {
      font-size: 0.95rem;
      color: #94a3b8;
    }
  </style>

  <!-- Firebase SDK v12.18.0 Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPFmx35ClB3c5vGBtv8rzVAiTK4rcwAik",
      authDomain: "pixvinz2026.firebaseapp.com",
      projectId: "pixvinz2026",
      storageBucket: "pixvinz2026.firebasestorage.app",
      messagingSenderId: "45609077809",
      appId: "1:45609077809:web:575611e46acda9f64c5910",
      measurementId: "G-W7FSERE8ZJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Expose generator function globally so the HTML button can trigger it
    window.runGenerator = async function() {
      const btn = document.getElementById('gen-btn');
      const statusDiv = document.getElementById('status');
      btn.disabled = true;
      statusDiv.textContent = "Generating 1,000 cards... Please wait.";

      try {
        const prizeDefinitions = [
          { id: 'jackpot', name: '1,000,000 XP', type: 'xp', value: 1000000, count: 2, matchIcon: 'images/jpxp.png' },
          { id: 'xp_50k', name: '50,000 XP', type: 'xp', value: 50000, count: 10, matchIcon: 'images/50kxp.png' },
          { id: 'xp_10k', name: '10,000 XP', type: 'xp', value: 10000, count: 20, matchIcon: 'images/10kxp.png' },
          { id: 'xp_5k', name: '5,000 XP', type: 'xp', value: 5000, count: 50, matchIcon: 'images/5kxp.png' },
          { id: 'xp_1k', name: '1,000 XP', type: 'xp', value: 1000, count: 100, matchIcon: 'images/1kxp.png' },
          { id: 'coin_20k', name: '20,000 Coins', type: 'coins', value: 20000, count: 10, matchIcon: 'images/20k.png' },
          { id: 'coin_5k', name: '5,000 Coins', type: 'coins', value: 5000, count: 20, matchIcon: 'images/5k.png' },
          { id: 'coin_1k', name: '1,000 Coins', type: 'coins', value: 1000, count: 30, matchIcon: 'images/1k.png' },
          { id: 'coin_500', name: '500 Coins', type: 'coins', value: 500, count: 100, matchIcon: 'images/500.png' },
          { id: 'coin_100', name: '100 Coins', type: 'coins', value: 100, count: 200, matchIcon: 'images/100.png' },
          { id: 'none', name: 'No Win', type: 'none', value: 0, count: 458, matchIcon: null }
        ];

        const allImages = [
          'images/100.png', 'images/500.png', 'images/1k.png', 'images/5k.png', 'images/20k.png',
          'images/1kxp.png', 'images/5kxp.png', 'images/10kxp.png', 'images/50kxp.png', 'images/jpxp.png'
        ];

        let masterPool = [];
        prizeDefinitions.forEach(tier => {
          for (let i = 0; i < tier.count; i++) {
            masterPool.push(tier);
          }
        });

        // Randomize pool order
        masterPool.sort(() => Math.random() - 0.5);

        let batch = writeBatch(db);
        let batchCount = 0;
        let totalUploaded = 0;

        for (let i = 0; i < masterPool.length; i++) {
          let cardConfig = masterPool[i];
          let cardDocId = `card_${String(i + 1).padStart(4, '0')}`;
          let uniqueCode = `PV-${Math.random().toString(36).substring(2, 6).toUpperCase()}-${Math.random().toString(36).substring(2, 6).toUpperCase()}`;
          let gridSlots = [];

          if (cardConfig.id === 'none') {
            let imgA = allImages[Math.floor(Math.random() * allImages.length)];
            let imgB;
            do { imgB = allImages[Math.floor(Math.random() * allImages.length)]; } while (imgA === imgB);

            for (let s = 0; s < 12; s++) {
              gridSlots.push({ imageUrl: s < 6 ? imgA : imgB });
            }
            gridSlots.sort(() => Math.random() - 0.5);
          } else {
            let winningIcon = cardConfig.matchIcon;
            let winningIndices = [];
            while (winningIndices.length < 3) {
              let idx = Math.floor(Math.random() * 12);
              if (!winningIndices.includes(idx)) winningIndices.push(idx);
            }

            let distractorImg;
            do { distractorImg = allImages[Math.floor(Math.random() * allImages.length)]; } while (distractorImg === winningIcon);

            for (let s = 0; s < 12; s++) {
              if (winningIndices.includes(s)) {
                gridSlots.push({ imageUrl: winningIcon });
              } else {
                gridSlots.push({ imageUrl: distractorImg });
              }
            }
          }

          let cardRef = doc(db, 'scratch_cards', cardDocId);
          batch.set(cardRef, {
            uniqueCode: uniqueCode,
            tierId: cardConfig.id,
            prizeName: cardConfig.name,
            prizeType: cardConfig.type,
            prizeValue: cardConfig.value,
            isBought: false,
            isScratched: false,
            ownerId: null,
            gridSlots: gridSlots,
            createdAt: serverTimestamp()
          });

          batchCount++;
          totalUploaded++;

          // Commit every 400 writes to stay safely beneath Firestore's 500-limit per batch
          if (batchCount === 400 || i === masterPool.length - 1) {
            await batch.commit();
            statusDiv.textContent = `Uploaded ${totalUploaded} / 1000 cards...`;
            batch = writeBatch(db);
            batchCount = 0;
          }
        }

        statusDiv.textContent = "SUCCESS! All 1,000 cards generated and uploaded.";
        alert("Done! You can now check your Firebase Firestore console and delete this file.");
      } catch (err) {
        console.error(err);
        statusDiv.textContent = "Error occurred. Check console for details.";
        btn.disabled = false;
      }
    };
  </script>
</head>
<body>

  <h1>PixVinz Card Generator</h1>
  <button id="gen-btn" onclick="runGenerator()">Generate 1,000 Cards Now</button>
  <div id="status">Ready to initialize Firestore collection.</div>

</body>
</html>
