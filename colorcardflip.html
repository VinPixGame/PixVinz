<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PixVinz Memory</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      outline: none !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f051d;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 12px;
      user-select: none;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 0.5cm;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      position: relative;
      margin-top: 24px;
      height: 48px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: rgba(20, 10, 35, 0.8);
      border: 2px solid #ffd700;
      color: #ffd700;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
      z-index: 3;
    }

    .game-title-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .game-title-container img {
      height: 100%;
      width: auto;
      max-width: 240px;
      object-fit: contain;
    }

    .coin-badge {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #ffd700;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
      color: #ffd700;
      z-index: 3;
      display: flex;         
      align-items: center;   
      gap: 4px;   
    }

    .stage-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
      flex-shrink: 0;
    }

    .stats-container {
      display: flex;
      width: 100%;
      height: 44px;
      background: #18082e;
      border: 1.5px solid #3c1968;
      border-radius: 8px;
      padding: 4px;
      flex-shrink: 0;
    }

    .stat-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .stat-box:not(:last-child) {
      border-right: 1px solid #3c1968;
    }

    .stat-icon { font-size: 1rem; }
    .stat-details { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.6rem; color: #9a88b5; font-weight: bold; }
    .stat-value { font-size: 0.85rem; font-weight: bold; color: #fff; }
    #xp-count-display { color: #00f2fe; }

    .visualizer-container {
      width: 100%;
      max-width: 420px;
      height: 36px;
      min-height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    #music-visualizer {
      width: 100%;
      height: 100%;
      background: rgba(24, 8, 46, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
    }

    .board-container {
      flex: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      padding: 4px 8px;
      position: relative;
      overflow: hidden;
    }

    .board-wrapper {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      max-width: 100%;
      max-height: 100%;
    }

    #shape-border-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }

    #shape-border-path {
      fill: url(#bgGradient);
      stroke: url(#borderGradient);
      stroke-width: 2.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0px 0px 6px rgba(157, 78, 221, 0.5));
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 3;
      max-width: 100%;
    }

    .board-row {
      display: flex;
      gap: 3px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .card {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s ease, z-index 0.3s ease;
      cursor: pointer;
      width: var(--card-size, 40px);
      height: var(--card-size, 40px);
      flex-shrink: 0;
    }

    .card.flip, .card.matched { transform: rotateY(180deg); }
    .card.matched { cursor: default; }

    /* Floating zoom effect showing the image side */
    .card.floating {
      transform: scale(2.2) translateY(-15px) rotateY(180deg) !important;
      z-index: 100;
      overflow: visible;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
    }

    .card-face {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      border: 1px solid #ffd700;
      overflow: hidden;
    }

    .card-front {
      background-color: #250a48;
      background-image: url("image/vinz.png");
      background-size: 8px 8px;
      background-repeat: repeat;
      background-position: center;
    }

    .card-back {
      background: #351063;
      transform: rotateY(180deg);
      padding: 1px;
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
    }

    .card.matched .card-face {
      border-color: #00ff66 !important;
      box-shadow: 0 0 4px #00ff66 !important;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 2, 16, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .overlay.active { opacity: 1; pointer-events: auto; }

    #confetti-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 105;
    }

    .modal {
      background: linear-gradient(160deg, #280a50 0%, #120324 100%);
      border: 2px solid #ffd700;
      padding: 20px 16px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      width: 85%;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
      z-index: 102;
    }

    .modal-trophy { font-size: 2.5rem; margin-bottom: 4px; }
    .modal h2 { color: #ffd700; margin-bottom: 4px; font-size: 1.3rem; font-weight: 900; }
    .modal p { font-size: 0.8rem; color: #bfa8e0; font-weight: 600; }

    .reward-breakdown {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #4a1d82;
      border-radius: 10px;
      padding: 8px;
      margin: 12px 0;
      display: flex;
      justify-content: space-around;
    }

    .reward-item { display: flex; flex-direction: column; align-items: center; }
    .reward-item .val { font-weight: 900; font-size: 1.1rem; }
    .reward-item.coins .val { color: #ffd700; }
    .reward-item.xp .val { color: #00f2fe; }

    .modal-actions { display: flex; gap: 8px; width: 100%; }

    .btn {
      flex: 1;
      background: linear-gradient(180deg, #ffe033 0%, #ffa800 100%);
      color: #120324;
      border: none;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 900;
      border-radius: 16px;
      cursor: pointer;
    }

    .btn-secondary {
      background: linear-gradient(180deg, #3c1968 0%, #1a0833 100%);
      color: #ffd700;
      border: 1.5px solid #ffd700;
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="sounds/bgmusic1.mp3" loop crossorigin="anonymous"></audio>
  <audio id="tap-sound" src="select.mp3"></audio>
  <audio id="victory-music" crossorigin="anonymous"></audio>

  <header>
    <div class="top-bar">
      <button class="icon-btn" id="backToHome" onclick="window.location.href='index.html'">‹</button>
      <div class="game-title-container">
        <img src="image/pixvinzmemory.png" alt="PixVinz Memory Logo" />
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </div>

    <div class="stage-title" id="stage-title">Stage 1</div>

    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-icon">⏱️</span>
        <div class="stat-details">
          <span class="stat-label">TIME</span>
          <span class="stat-value" id="time-count">00:00</span>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon">🔄</span>
        <div class="stat-details">
          <span class="stat-label">FLIPS</span>
          <span class="stat-value" id="flip-count">0</span>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon">⚡</span>
        <div class="stat-details">
          <span class="stat-label">XP</span>
          <span class="stat-value" id="xp-count-display">0</span>
        </div>
      </div>
    </div>

    <div class="visualizer-container">
      <canvas id="music-visualizer"></canvas>
    </div>
  </header>

  <div class="board-container" id="board-container">
    <div class="board-wrapper" id="board-wrapper">
      <svg id="shape-border-svg">
        <defs>
          <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#180730" />
            <stop offset="100%" stop-color="#0d031a" />
          </linearGradient>

          <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffd700" />
            <stop offset="35%" stop-color="#9d4edd" />
            <stop offset="70%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#ffd700" />
          </linearGradient>
        </defs>
        <path id="shape-border-path" d="" />
      </svg>
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <canvas id="confetti-canvas"></canvas>
    <div class="modal">
      <div class="modal-trophy">🏆</div>
      <h2 id="modal-title">STAGE CLEARED!</h2>
      <p id="modal-msg">Time: 00:00 | Flips: 0</p>
      
      <div class="reward-breakdown">
        <div class="reward-item coins">
          <span class="val" id="reward-coins">+0</span>
          <span class="stat-label">COINS</span>
        </div>
        <div class="reward-item xp">
          <span class="val" id="reward-xp">+0</span>
          <span class="stat-label">XP</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">HOME</button>
        <button class="btn" id="next-btn" onclick="nextStage()">NEXT STAGE</button>
      </div>
    </div>
  </div>

  <script>
    function getActiveUserPrefix() {
      let username = '';
      try {
        const userObj = JSON.parse(localStorage.getItem('loggedInUser'));
        if (userObj && userObj.username) username = userObj.username;
      } catch (e) {}
      if (!username) username = localStorage.getItem('vinpix_username') || '';
      return username ? `${username}_` : '';
    }

    function getActiveUsername() {
      try {
        const userObj = JSON.parse(localStorage.getItem('loggedInUser'));
        if (userObj && userObj.username) return userObj.username;
      } catch (e) {}
      return localStorage.getItem('vinpix_username') || '';
    }

    let prefix = getActiveUserPrefix();
    let coinKey = `${prefix}totalCoins`;
    let xpKey = `${prefix}xp`;
    let stageKey = `${prefix}memoryStage`;

    let coinCount = Math.round(parseFloat(localStorage.getItem(coinKey))) || 500;
    let xpCount = parseInt(localStorage.getItem(xpKey), 10) || 0;
    let currentStage = parseInt(localStorage.getItem(stageKey), 10) || 1;

    // Function to update URL path to match current stage without breaking relative image paths
    function updateStageUrl(stage) {
      try {
        const newPath = `/level${stage}`;
        window.history.replaceState({ stage: stage }, `Stage ${stage}`, newPath);
      } catch (e) {}
    }

    window.saveUserDataToCloud = async function() {
      const username = getActiveUsername();
      if (!username || !window.pixvinzDb) return;

      try {
        const { db, doc, setDoc } = window.pixvinzDb;
        const userDocRef = doc(db, 'players', username);
        
        const payload = {
          coins: Math.round(coinCount),
          xp: xpCount,
          stage: parseInt(currentStage, 10),
          lastUpdated: new Date().toISOString()
        };

        await setDoc(userDocRef, payload, { merge: true });
        console.log("Stage saved successfully to cloud:", currentStage);
      } catch (e) {
        console.error("Error saving stage to cloud:", e);
      }
    };

    window.fetchUserDataFromCloud = async function() {
      const username = getActiveUsername();
      if (!username || !window.pixvinzDb) return;

      try {
        const { db, doc, getDoc } = window.pixvinzDb;
        const userDocRef = doc(db, 'players', username);
        const docSnap = await getDoc(userDocRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.coins !== undefined) coinCount = Math.round(parseFloat(data.coins));
          if (data.xp !== undefined) xpCount = parseInt(data.xp, 10);
          if (data.stage !== undefined) currentStage = parseInt(data.stage, 10);

          updateUserData(false);
          startStage(currentStage);
        }
      } catch (e) {
        console.error("Error fetching from cloud:", e);
      }
    };

    function updateUserData(shouldSaveToCloud = true) {
      prefix = getActiveUserPrefix();
      coinKey = `${prefix}totalCoins`;
      xpKey = `${prefix}totalXp`;
      stageKey = `${prefix}memoryStage`;

      const coinCountEl = document.getElementById('coinCount');
      const xpCountEl = document.getElementById('xp-count-display');

      if (coinCountEl) coinCountEl.textContent = Math.round(coinCount).toLocaleString();
      if (xpCountEl) xpCountEl.textContent = xpCount.toLocaleString();

      localStorage.setItem(coinKey, Math.round(coinCount));
      localStorage.setItem(xpKey, xpCount);
      localStorage.setItem(stageKey, currentStage);

      updateStageUrl(currentStage);

      if (typeof updateProfileStats === 'function') updateProfileStats();
      if (shouldSaveToCloud && typeof window.saveUserDataToCloud === 'function') {
        window.saveUserDataToCloud();
      }
    }

    let flips = 0;
    let flippedCards = [];
    let matchedPairs = 0;
    let totalPairs = 0;
    let lockBoard = false;
    let timerInterval = null;
    let secondsElapsed = 0;

    const bgMusic = document.getElementById('bg-music');
    const tapSound = document.getElementById('tap-sound');
    const victoryMusic = document.getElementById('victory-music');

    let audioCtx = null;
    let analyser = null;
    let isVisualizerInit = false;

    function initAudioVisualizer() {
      if (isVisualizerInit) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        const sourceBg = audioCtx.createMediaElementSource(bgMusic);
        sourceBg.connect(analyser);

        const sourceVic = audioCtx.createMediaElementSource(victoryMusic);
        sourceVic.connect(analyser);

        analyser.connect(audioCtx.destination);
        isVisualizerInit = true;
        renderVisualizer();
      } catch (e) {}
    }

    function renderVisualizer() {
      const canvas = document.getElementById('music-visualizer');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barCount = 20;
        const barWidth = (canvas.width / barCount) - 2;
        let x = 1;

        for (let i = 0; i < barCount; i++) {
          const dataIndex = Math.floor((i / barCount) * bufferLength);
          const barHeight = (dataArray[dataIndex] / 255) * (canvas.height - 4);

          const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
          gradient.addColorStop(0, '#3c1968');
          gradient.addColorStop(0.5, '#ffd700');
          gradient.addColorStop(1, '#00f2fe');

          ctx.fillStyle = gradient;
          ctx.fillRect(x, canvas.height - barHeight - 2, barWidth, barHeight + 2);

          x += barWidth + 2;
        }
      }
      draw();
    }

    function initAudio() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      initAudioVisualizer();

      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
    }

    function playTapSound() {
      tapSound.currentTime = 0;
      tapSound.play().catch(() => {});
    }

    function playVictoryMusic(stage) {
      bgMusic.pause();
      let musicIndex = ((stage - 1) % 10) + 1;
      victoryMusic.src = `sounds/victory${musicIndex}.mp3`;
      victoryMusic.currentTime = 0;
      victoryMusic.play().catch(() => {});
    }

    function stopVictoryMusic() {
      victoryMusic.pause();
      victoryMusic.currentTime = 0;
      initAudio();
    }

    function getCardCountForStage(stage) {
      if (stage === 100) return 134;
      return 4 + (Math.floor((stage - 1) / 2) * 2);
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('time-count').textContent = `${mins}:${secs}`;
    }

    function getSymmetricalRowDistribution(cardCount) {
      if (cardCount === 134) {
        return [8, 10, 10, 10, 10, 10, 9, 9, 10, 10, 10, 10, 10, 8];
      }

      const container = document.getElementById('board-container');
      const containerW = container ? container.clientWidth - 8 : 400;
      const containerH = container ? container.clientHeight - 8 : 400;
      const gap = 2;

      let bestCols = 1;
      let maxCardSize = 0;
      let bestRows = cardCount;

      for (let cols = 1; cols <= cardCount; cols++) {
        let rows = Math.ceil(cardCount / cols);
        let cardW = (containerW - (cols - 1) * gap) / cols;
        let cardH = (containerH - (rows - 1) * gap) / rows;
        let cardSize = Math.min(cardW, cardH);

        if (cardSize > maxCardSize) {
          maxCardSize = cardSize;
          bestCols = cols;
          bestRows = rows;
        }
      }

      let base = Math.floor(cardCount / bestRows);
      let extra = cardCount % bestRows;

      let rawLayout = [];
      for (let i = 0; i < bestRows; i++) {
        rawLayout.push(base + (i < extra ? 1 : 0));
      }

      let layout = new Array(bestRows);
      let left = 0;
      let right = bestRows - 1;

      for (let i = rawLayout.length - 1; i >= 0; i--) {
        if ((rawLayout.length - i) % 2 === 1) {
          layout[right] = rawLayout[i];
          right--;
        } else {
          layout[left] = rawLayout[i];
          left++;
        }
      }

      return layout;
    }

    function configureGridAndSizing(rowLayout) {
      const container = document.getElementById('board-container');
      if (!container) return;

      const rows = rowLayout.length;
      const maxCols = Math.max(...rowLayout);
      const gap = 3;

      const maxAvailableW = container.clientWidth - 20;
      const maxAvailableH = container.clientHeight - 20;

      let cardW = (maxAvailableW - (maxCols - 1) * gap) / maxCols;
      let cardH = (maxAvailableH - (rows - 1) * gap) / rows;

      let cardSize = Math.floor(Math.min(cardW, cardH));
      cardSize = Math.max(10, cardSize);

      document.documentElement.style.setProperty('--card-size', `${cardSize}px`);
    }

    function updateDynamicShapeBorder() {
      const wrapper = document.getElementById('board-wrapper');
      const rows = document.querySelectorAll('.board-row');
      const pathEl = document.getElementById('shape-border-path');
      if (!wrapper || !rows.length || !pathEl) return;

      const wrapperRect = wrapper.getBoundingClientRect();
      const pad = 4;

      let rowData = [];

      rows.forEach((row) => {
        const cards = row.querySelectorAll('.card');
        if (cards.length > 0) {
          const firstRect = cards[0].getBoundingClientRect();
          const lastRect = cards[cards.length - 1].getBoundingClientRect();

          rowData.push({
            top: Math.round(firstRect.top - wrapperRect.top - pad),
            bottom: Math.round(firstRect.bottom - wrapperRect.top + pad),
            left: Math.round(firstRect.left - wrapperRect.left - pad),
            right: Math.round(lastRect.right - wrapperRect.left + pad)
          });
        }
      });

      if (rowData.length === 0) return;

      let d = `M ${rowData[0].left} ${rowData[0].top}`;
      
      for (let i = 0; i < rowData.length; i++) {
        let cur = rowData[i];
        let nxt = rowData[i + 1];
        d += ` L ${cur.right} ${cur.top}`;
        if (nxt) {
          d += ` L ${cur.right} ${nxt.top}`;
        } else {
          d += ` L ${cur.right} ${cur.bottom}`;
        }
      }

      let lastRow = rowData[rowData.length - 1];
      d += ` L ${lastRow.left} ${lastRow.bottom}`;

      for (let i = rowData.length - 1; i >= 0; i--) {
        let cur = rowData[i];
        let prv = rowData[i - 1];
        d += ` L ${cur.left} ${cur.bottom}`;
        if (prv) {
          d += ` L ${cur.left} ${prv.bottom}`;
        } else {
          d += ` L ${cur.left} ${cur.top}`;
        }
      }

      d += ' Z';
      pathEl.setAttribute('d', d);
    }

    function startStage(stage) {
      currentStage = stage;
      updateStageUrl(stage);

      const board = document.getElementById('board');
      board.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      flips = 0;
      lockBoard = false;

      const numCards = getCardCountForStage(stage);
      totalPairs = numCards / 2;

      document.getElementById('stage-title').textContent = `Stage ${stage}`;
      document.getElementById('flip-count').textContent = flips;

      let imagePool = Array.from({ length: 70 }, (_, i) => i + 1);

      function seededRandom(seed) {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
      }

      let seed = stage * 999;
      for (let i = imagePool.length - 1; i > 0; i--) {
        let j = Math.floor(seededRandom(seed + i) * (i + 1));
        [imagePool[i], imagePool[j]] = [imagePool[j], imagePool[i]];
      }

      let selectedImages = [];
      for (let i = 0; i < totalPairs; i++) {
        selectedImages.push(`image/level${imagePool[i % imagePool.length]}.png`);
      }

      let cardDeck = [...selectedImages, ...selectedImages];
      cardDeck.sort(() => Math.random() - 0.5);

      const rowLayout = getSymmetricalRowDistribution(numCards);
      let cardIndex = 0;

      rowLayout.forEach((countInRow) => {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('board-row');

        for (let c = 0; c < countInRow; c++) {
          if (cardIndex >= cardDeck.length) break;
          const imgSrc = cardDeck[cardIndex++];

          const card = document.createElement('div');
          card.classList.add('card');
          card.dataset.symbol = imgSrc;

          card.innerHTML = `
            <div class="card-face card-front"></div>
            <div class="card-face card-back">
              <img src="${imgSrc}" alt="card front image" />
            </div>
          `;

          card.addEventListener('click', flipCard);
          rowDiv.appendChild(card);
        }
        board.appendChild(rowDiv);
      });

      requestAnimationFrame(() => {
        configureGridAndSizing(rowLayout);
        requestAnimationFrame(() => {
          setTimeout(updateDynamicShapeBorder, 100);
        });
      });

      startTimer();
    }

    function flipCard() {
      initAudio();
      if (lockBoard) return;
      if (this.classList.contains('flip') || this.classList.contains('matched')) return;

      playTapSound();

      const cardComputedSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-size')) || 40;
      const isSmallCard = cardComputedSize <= 45;

      if (isSmallCard) {
        this.classList.add('floating');
        lockBoard = true;

        setTimeout(() => {
          this.classList.remove('floating');
          lockBoard = false;
          executeFlip(this);
        }, 900);
      } else {
        executeFlip(this);
      }
    }

    function executeFlip(card) {
      card.classList.add('flip');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        flips++;
        document.getElementById('flip-count').textContent = flips;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.symbol === card2.dataset.symbol;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        flippedCards = [];

        if (matchedPairs === totalPairs) {
          stopTimer();
          setTimeout(stageComplete, 400);
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flip');
          card2.classList.remove('flip');
          flippedCards = [];
          lockBoard = false;
        }, 750);
      }
    }

    function stageComplete() {
      playVictoryMusic(currentStage);

      const timePenalty = Math.floor(secondsElapsed / 3) * 10;
      const coinsEarned = Math.max(0, 500 - timePenalty);

      const flipPenalty = flips * 10;
      const xpEarned = Math.max(0, 1000 - flipPenalty);

      coinCount += coinsEarned;
      xpCount += xpEarned;
      
      currentStage++;

      document.getElementById('reward-coins').textContent = `+${Math.round(coinsEarned).toLocaleString()}`;
      document.getElementById('reward-xp').textContent = `+${xpEarned.toLocaleString()}`;

      const overlay = document.getElementById('overlay');
      const title = document.getElementById('modal-title');
      const msg = document.getElementById('modal-msg');
      const btn = document.getElementById('next-btn');

      if (currentStage > 100) {
        title.textContent = "STAGE 100 CLEARED!";
        msg.textContent = `Time: ${document.getElementById('time-count').textContent} | Flips: ${flips}`;
        btn.textContent = "PLAY AGAIN";
        btn.onclick = () => {
          stopVictoryMusic();
          currentStage = 1;
          updateUserData(true);
          stopConfetti();
          overlay.classList.remove('active');
          startStage(currentStage);
        };
      } else {
        title.textContent = `STAGE ${currentStage - 1} CLEARED!`;
        msg.textContent = `Time: ${document.getElementById('time-count').textContent} | Flips: ${flips}`;
        btn.textContent = "NEXT STAGE";
        btn.onclick = nextStage;
      }

      updateUserData(true);

      startConfetti();
      overlay.classList.add('active');
    }

    function nextStage() {
      stopVictoryMusic();
      stopConfetti();
      document.getElementById('overlay').classList.remove('active');
      startStage(currentStage);
    }

    let confettiAnimationId = null;
    let confettiParticles = [];

    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#ffd700', '#00f2fe', '#00ff66', '#ff007f', '#ffffff', '#ff9900'];
      confettiParticles = [];

      for (let i = 0; i < 140; i++) {
        const isLeft = i % 2 === 0;
        const angle = isLeft 
          ? (Math.random() * 30 + 60) * (Math.PI / 180)
          : (Math.random() * 30 + 90) * (Math.PI / 180);

        const speed = Math.random() * 18 + 14;

        confettiParticles.push({
          x: isLeft ? 0 : canvas.width,
          y: canvas.height * 0.85,
          vx: Math.cos(angle) * speed,
          vy: -Math.sin(angle) * speed,
          gravity: 0.45,
          drag: 0.96,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: Math.random() * 20 - 10,
          opacity: 1
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        confettiParticles.forEach((p) => {
          p.vx *= p.drag;
          p.vy *= p.drag;
          p.vy += p.gravity;

          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.rotationSpeed;

          if (p.y > canvas.height * 0.7) {
            p.opacity -= 0.015;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        confettiParticles = confettiParticles.filter(p => p.opacity > 0);

        if (confettiParticles.length > 0) {
          confettiAnimationId = requestAnimationFrame(animate);
        }
      }

      animate();
    }

    function stopConfetti() {
      if (confettiAnimationId) {
        cancelAnimationFrame(confettiAnimationId);
        confettiAnimationId = null;
      }
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', () => {
      const numCards = getCardCountForStage(currentStage);
      const rowLayout = getSymmetricalRowDistribution(numCards);
      configureGridAndSizing(rowLayout);
      updateDynamicShapeBorder();
      const canvas = document.getElementById('confetti-canvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    document.addEventListener('click', initAudio, { once: true });

    updateUserData(false);
    startStage(currentStage);
    if (typeof window.fetchUserDataFromCloud === 'function') {
      window.fetchUserDataFromCloud();
    }
  </script>
</body>
