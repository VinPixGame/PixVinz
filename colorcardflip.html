<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PixVinz Memory</title>
  <style>
    /* RESET AND BASIC LAYOUT */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      outline: none !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f051d;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      user-select: none;
    }

    /* TOP BAR CONTAINER */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 420px;
      position: relative;
      height: 50px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: rgba(20, 10, 35, 0.8);
      border: 2px solid #ffd700;
      color: #ffd700;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 3;
    }

    .game-title-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .game-title-container img {
      height: 100%;
      width: auto;
      max-width: 180px;
      object-fit: contain;
    }

    .coin-badge {
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid #ffd700;
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
      color: #ffd700;
      z-index: 3;
      display: flex;         
      align-items: center;   
      gap: 4px;   
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .stage-title {
      font-size: 1rem;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
    }

    .stats-container {
      display: flex;
      width: 100%;
      background: #18082e;
      border: 1.5px solid #3c1968;
      border-radius: 10px;
      padding: 4px;
    }

    .stat-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .stat-box:not(:last-child) {
      border-right: 1px solid #3c1968;
    }

    .stat-icon { font-size: 1rem; }
    .stat-details { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.55rem; color: #9a88b5; font-weight: bold; }
    .stat-value { font-size: 0.85rem; font-weight: bold; color: #fff; }
    #xp-count-display { color: #00f2fe; }

    .visualizer-container {
      width: 100%;
      max-width: 420px;
      height: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    #music-visualizer {
      width: 100%;
      height: 100%;
      background: rgba(24, 8, 46, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 6px;
    }

    /* FULLY CONSTRAINED AUTO-SCALING BOARD WRAPPER */
    .board-wrapper {
      flex: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #180730, #0d031a);
      border: 2px solid transparent;
      border-image: linear-gradient(135deg, #ffd700, #3c1968, #ffd700) 1;
      border-radius: 14px;
      padding: 8px;
      margin: 4px 0;
      overflow: hidden;
      min-height: 0; /* CRITICAL: Allows flex child to shrink below contents */
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    .board-row {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* CARDS SCALING COMPUTED BY JS AUTOMATICALLY */
    .card {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
      cursor: pointer;
      width: var(--card-size, 50px);
      height: var(--card-size, 50px);
      flex-shrink: 0;
    }

    .card.flip, .card.matched { transform: rotateY(180deg); }
    .card.matched { cursor: default; }

    .card-face {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      border: 1.5px solid #ffd700;
      overflow: hidden;
    }

    .card-front {
      background-color: #250a48;
      background-image: url("image/vinz.png");
      background-size: 16px 16px;
      background-repeat: repeat;
      background-position: center;
    }

    .card-back {
      background: #351063;
      transform: rotateY(180deg);
      padding: 2px;
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .card.matched .card-face {
      border-color: #00ff66 !important;
      filter: drop-shadow(0px 0px 6px #00ff66);
    }

    /* MODAL OVERLAY */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 2, 16, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .overlay.active { opacity: 1; pointer-events: auto; }

    #confetti-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 105;
    }

    .modal {
      background: linear-gradient(160deg, #280a50 0%, #120324 100%);
      border: 2px solid #ffd700;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 300px;
      width: 85%;
      z-index: 102;
    }

    .modal-trophy { font-size: 2.5rem; margin-bottom: 4px; }
    .modal h2 { color: #ffd700; margin-bottom: 4px; font-size: 1.4rem; }
    .modal p { font-size: 0.8rem; color: #bfa8e0; }

    .reward-breakdown {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #4a1d82;
      border-radius: 10px;
      padding: 8px;
      margin: 10px 0;
      display: flex;
      justify-content: space-around;
    }

    .reward-item { display: flex; flex-direction: column; align-items: center; }
    .reward-item .val { font-weight: 900; font-size: 1.1rem; }
    .reward-item.coins .val { color: #ffd700; }
    .reward-item.xp .val { color: #00f2fe; }

    .modal-actions { display: flex; gap: 8px; width: 100%; }

    .btn {
      flex: 1;
      background: linear-gradient(180deg, #ffe033 0%, #ffa800 100%);
      color: #120324;
      border: none;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
    }

    .btn-secondary {
      background: linear-gradient(180deg, #3c1968 0%, #1a0833 100%);
      color: #ffd700;
      border: 1.5px solid #ffd700;
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="sounds/bgmusic1.mp3" loop crossOrigin="anonymous"></audio>
  <audio id="tap-sound" src="select.mp3"></audio>
  <audio id="victory-music" crossOrigin="anonymous"></audio>

  <header>
    <div class="top-bar">
      <button class="icon-btn" id="backToHome" onclick="window.location.href='index.html'">‹</button>
      <div class="game-title-container">
        <img src="image/pixvinzmemory.png" alt="PixVinz Memory Logo" />
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">0</span></div>
    </div>

    <div class="stage-title" id="stage-title">Stage 15</div>

    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-icon">⏱️</span>
        <div class="stat-details">
          <span class="stat-label">TIME</span>
          <span class="stat-value" id="time-count">00:00</span>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon">🔄</span>
        <div class="stat-details">
          <span class="stat-label">FLIPS</span>
          <span class="stat-value" id="flip-count">0</span>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon">⚡</span>
        <div class="stat-details">
          <span class="stat-label">XP</span>
          <span class="stat-value" id="xp-count-display">0</span>
        </div>
      </div>
    </div>
  </header>

  <div class="visualizer-container">
    <canvas id="music-visualizer"></canvas>
  </div>

  <div class="board-wrapper" id="board-wrapper">
    <div class="board" id="board"></div>
  </div>

  <div class="overlay" id="overlay">
    <canvas id="confetti-canvas"></canvas>
    <div class="modal">
      <div class="modal-trophy">🏆</div>
      <h2 id="modal-title">STAGE CLEARED!</h2>
      <p id="modal-msg">Time: 00:00 | Flips: 0</p>
      
      <div class="reward-breakdown">
        <div class="reward-item coins">
          <span class="val" id="reward-coins">+0</span>
          <span class="stat-label">COINS</span>
        </div>
        <div class="reward-item xp">
          <span class="val" id="reward-xp">+0</span>
          <span class="stat-label">XP</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">HOME</button>
        <button class="btn" id="next-btn" onclick="nextStage()">NEXT STAGE</button>
      </div>
    </div>
  </div>

  <script>
    function getActiveUserPrefix() {
      let username = '';
      try {
        const userObj = JSON.parse(localStorage.getItem('loggedInUser'));
        if (userObj && userObj.username) username = userObj.username;
      } catch (e) {}
      if (!username) username = localStorage.getItem('vinpix_username') || '';
      return username ? `${username}_` : '';
    }

    function getActiveUsername() {
      try {
        const userObj = JSON.parse(localStorage.getItem('loggedInUser'));
        if (userObj && userObj.username) return userObj.username;
      } catch (e) {}
      return localStorage.getItem('vinpix_username') || '';
    }

    let prefix = getActiveUserPrefix();
    let coinKey = `${prefix}totalCoins`;
    let xpKey = `${prefix}totalXp`;
    let stageKey = `${prefix}memoryStage`;

    let coinCount = Math.round(parseFloat(localStorage.getItem(coinKey))) || 500;
    let xpCount = parseInt(localStorage.getItem(xpKey), 10) || 0;
    let currentStage = parseInt(localStorage.getItem(stageKey), 10) || 15;

    function updateUserData(shouldSaveToCloud = true) {
      prefix = getActiveUserPrefix();
      coinKey = `${prefix}totalCoins`;
      xpKey = `${prefix}totalXp`;
      stageKey = `${prefix}memoryStage`;

      const coinCountEl = document.getElementById('coinCount');
      const xpCountEl = document.getElementById('xp-count-display');

      if (coinCountEl) coinCountEl.textContent = Math.round(coinCount).toLocaleString();
      if (xpCountEl) xpCountEl.textContent = xpCount.toLocaleString();

      localStorage.setItem(coinKey, Math.round(coinCount));
      localStorage.setItem(xpKey, xpCount);
      localStorage.setItem(stageKey, currentStage);
    }

    let flips = 0;
    let flippedCards = [];
    let matchedPairs = 0;
    let totalPairs = 0;
    let lockBoard = false;
    let timerInterval = null;
    let secondsElapsed = 0;

    const bgMusic = document.getElementById('bg-music');
    const tapSound = document.getElementById('tap-sound');
    const victoryMusic = document.getElementById('victory-music');

    function initAudio() {
      if (bgMusic.paused) bgMusic.play().catch(() => {});
    }

    function playTapSound() {
      tapSound.currentTime = 0;
      tapSound.play().catch(() => {});
    }

    function getCardCountForStage(stage) {
      let count = 4 + (Math.floor((stage - 1) / 2) * 2);
      return Math.min(count, 36); 
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('time-count').textContent = `${mins}:${secs}`;
    }

    /* SPECIFIC ROW DISTRIBUTION DEFINITION */
    function getSymmetricalRowDistribution(cardCount) {
      if (cardCount === 10) return [3, 4, 3];
      if (cardCount === 14) return [3, 4, 4, 3];
      if (cardCount === 18) return [3, 4, 4, 4, 3];  /* 18 CARDS SET TO EXACTLY 3, 4, 4, 4, 3 */
      if (cardCount === 22) return [4, 5, 5, 5, 3];
      if (cardCount === 26) return [4, 6, 6, 6, 4];
      if (cardCount === 30) return [5, 5, 5, 5, 5, 5];
      if (cardCount === 34) return [5, 6, 6, 6, 6, 5];

      let maxCols = Math.ceil(Math.sqrt(cardCount));
      while (cardCount % maxCols !== 0) maxCols++;
      let rows = cardCount / maxCols;
      let rowArray = [];
      for (let i = 0; i < rows; i++) rowArray.push(maxCols);
      return rowArray;
    }

    function configureGridAndSizing(rowLayout) {
      const wrapper = document.getElementById('board-wrapper');
      if (!wrapper) return;

      const rows = rowLayout.length;
      const maxCols = Math.max(...rowLayout);
      const gap = 4;

      // Real dimensions inside board-wrapper container
      const availableWidth = wrapper.clientWidth - 16;
      const availableHeight = wrapper.clientHeight - 16;

      let cardW = (availableWidth - (maxCols - 1) * gap) / maxCols;
      let cardH = (availableHeight - (rows - 1) * gap) / rows;

      // Force card to remain a square fitted strictly within available box
      let size = Math.floor(Math.min(cardW, cardH));
      size = Math.max(24, size); // Prevent collapsing below visible threshold

      document.documentElement.style.setProperty('--card-size', `${size}px`);
    }

    function startStage(stage) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      flips = 0;
      lockBoard = false;

      const numCards = getCardCountForStage(stage);
      totalPairs = numCards / 2;

      document.getElementById('stage-title').textContent = `Stage ${stage}`;
      document.getElementById('flip-count').textContent = flips;

      let themeIndex = Math.floor((stage - 1) / 10) % 7; 
      let baseStartImage = (themeIndex * 10) + 1;
      let stageOffset = (stage - 1) % 10;

      let selectedImages = [];
      for (let i = 0; i < totalPairs; i++) {
        let imgNum = ((baseStartImage - 1 + stageOffset + i) % 70) + 1;
        selectedImages.push(`image/level${imgNum}.png`);
      }

      let cardDeck = [...selectedImages, ...selectedImages];
      cardDeck.sort(() => Math.random() - 0.5);

      const rowLayout = getSymmetricalRowDistribution(numCards);
      let cardIndex = 0;

      rowLayout.forEach((countInRow) => {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('board-row');

        for (let c = 0; c < countInRow; c++) {
          if (cardIndex >= cardDeck.length) break;
          const imgSrc = cardDeck[cardIndex++];

          const card = document.createElement('div');
          card.classList.add('card');
          card.dataset.symbol = imgSrc;

          card.innerHTML = `
            <div class="card-face card-front"></div>
            <div class="card-face card-back">
              <img src="${imgSrc}" alt="card front" />
            </div>
          `;

          card.addEventListener('click', flipCard);
          rowDiv.appendChild(card);
        }
        board.appendChild(rowDiv);
      });

      // Double-pass layout calculation for precise dynamic container dimensions
      requestAnimationFrame(() => {
        configureGridAndSizing(rowLayout);
      });

      startTimer();
    }

    function flipCard() {
      initAudio();
      if (lockBoard) return;
      if (this.classList.contains('flip') || this.classList.contains('matched')) return;

      playTapSound();
      this.classList.add('flip');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        flips++;
        document.getElementById('flip-count').textContent = flips;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.symbol === card2.dataset.symbol;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        flippedCards = [];

        if (matchedPairs === totalPairs) {
          stopTimer();
          setTimeout(stageComplete, 400);
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flip');
          card2.classList.remove('flip');
          flippedCards = [];
          lockBoard = false;
        }, 750);
      }
    }

    function stageComplete() {
      const overlay = document.getElementById('overlay');
      overlay.classList.add('active');
    }

    function nextStage() {
      document.getElementById('overlay').classList.remove('active');
      currentStage++;
      updateUserData(true);
      startStage(currentStage);
    }

    window.addEventListener('resize', () => {
      const numCards = getCardCountForStage(currentStage);
      const rowLayout = getSymmetricalRowDistribution(numCards);
      configureGridAndSizing(rowLayout);
    });

    document.addEventListener('click', initAudio, { once: true });

    updateUserData(false);
    startStage(currentStage);
  </script>
</body>
</html>
