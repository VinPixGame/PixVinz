<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Neon Glass 3D Color Card Game - PixVinz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #2a085c 0%, #140a23 60%, #090314 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .btn-back {
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid #ffcc00;
      color: #ffcc00;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .coin-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid #ffcc00;
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: bold;
      color: #ffcc00;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }

    .title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff, #ffea75, #ff9900);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
      text-transform: uppercase;
      text-align: center;
    }

    .xp-display {
      font-size: 11px;
      font-weight: 700;
      color: #00e676;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-align: center;
      text-shadow: 0 0 8px rgba(0,230,118,0.4);
    }

    .instruction {
      font-size: 10px;
      color: #ffcc00;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Arena Table */
    .arena {
      width: 100%;
      max-width: 480px;
      background: rgba(15, 8, 30, 0.85);
      border: 1.5px solid rgba(255, 204, 0, 0.3);
      border-radius: 14px;
      padding: 8px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 6px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      justify-items: center;
      width: 100%;
      position: relative;
    }

    /* 3D Glass Neon Cards */
    .card-slot {
      width: 100%;
      aspect-ratio: 2 / 3;
      perspective: 1000px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 0 8px rgba(255,255,255,0.15);
    }

    .card-slot.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 7px;
      text-transform: uppercase;
    }

    /* Glass Back Face */
    .card-back {
      background: linear-gradient(135deg, rgba(70, 30, 130, 0.8), rgba(25, 10, 55, 0.9));
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 204, 0, 0.4);
      color: #ffcc00;
      font-size: 12px;
      box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.25);
    }

    /* Glass Neon Front Face */
    .card-front {
      transform: rotateY(180deg);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Neon Glass Color Shaders */
    .glass-red    { background: linear-gradient(135deg, rgba(255, 51, 102, 0.85), rgba(130, 0, 35, 0.9)); box-shadow: inset 0 0 12px rgba(255, 51, 102, 0.7), 0 3px 10px rgba(255, 51, 102, 0.3); color: #fff; }
    .glass-blue   { background: linear-gradient(135deg, rgba(37, 117, 252, 0.85), rgba(0, 45, 130, 0.9)); box-shadow: inset 0 0 12px rgba(37, 117, 252, 0.7), 0 3px 10px rgba(37, 117, 252, 0.3); color: #fff; }
    .glass-white  { background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(160, 160, 160, 0.85)); box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.9), 0 3px 10px rgba(255, 255, 255, 0.4); color: #000; }
    .glass-yellow { background: linear-gradient(135deg, rgba(255, 204, 0, 0.85), rgba(160, 120, 0, 0.9)); box-shadow: inset 0 0 12px rgba(255, 204, 0, 0.8), 0 3px 10px rgba(255, 204, 0, 0.3); color: #000; }
    .glass-pink   { background: linear-gradient(135deg, rgba(255, 102, 204, 0.85), rgba(145, 10, 100, 0.9)); box-shadow: inset 0 0 12px rgba(255, 102, 204, 0.7), 0 3px 10px rgba(255, 102, 204, 0.3); color: #fff; }
    .glass-green  { background: linear-gradient(135deg, rgba(0, 230, 118, 0.85), rgba(0, 95, 45, 0.9)); box-shadow: inset 0 0 12px rgba(0, 230, 118, 0.7), 0 3px 10px rgba(0, 230, 118, 0.3); color: #fff; }

    /* Central Dealer Deck Stack */
    .dealer-deck {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 68px;
      background: linear-gradient(135deg, rgba(70, 30, 130, 0.9), rgba(25, 10, 55, 0.95));
      border: 1.5px solid rgba(255, 204, 0, 0.6);
      border-radius: 6px;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #ffcc00;
      box-shadow: 0 8px 20px rgba(0,0,0,0.9), inset 0 0 8px rgba(255,204,0,0.4);
      z-index: 10;
    }

    /* Compact History Box */
    .history-box {
      width: 100%;
      max-width: 480px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 204, 0, 0.2);
      border-radius: 10px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }

    .history-title {
      font-size: 9px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .history-list {
      display: flex;
      flex-direction: row;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      justify-content: flex-start;
    }
    .history-list::-webkit-scrollbar { display: none; }

    .history-item {
      min-width: 22px;
      height: 48px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px;
    }

    .h-card {
      width: 16px;
      height: 12px;
      border-radius: 2px;
      backdrop-filter: blur(4px);
    }

    .chips-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .chip {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px dashed #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 10px;
      cursor: pointer;
    }

    .chip.active {
      transform: scale(1.1);
      border-style: solid;
      border-color: #ffcc00;
    }

    .chip-10 { background: #ff3366; }
    .chip-50 { background: #2575fc; }
    .chip-100 { background: #ffcc00; color: #000; }
    .chip-500 { background: #00e676; color: #000; }

    /* Betting Grid */
    .grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .color-card {
      height: 55px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      cursor: pointer;
      position: relative;
    }

    .c-red    { background: linear-gradient(135deg, #ff3366, #a1002b); }
    .c-blue   { background: linear-gradient(135deg, #2575fc, #00369e); }
    .c-white  { background: linear-gradient(135deg, #ffffff, #b0b0b0); color: #000; }
    .c-yellow { background: linear-gradient(135deg, #ffcc00, #b89200); color: #000; }
    .c-pink   { background: linear-gradient(135deg, #ff66cc, #a81379); }
    .c-green  { background: linear-gradient(135deg, #00e676, #007a3d); }

    .card-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .bet-badge {
      align-self: flex-end;
      background: rgba(0, 0, 0, 0.7);
      color: #ffcc00;
      padding: 1px 4px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 800;
      display: none;
    }

    .c-white .bet-badge, .c-yellow .bet-badge { color: #000; }

    /* Actions */
    .actions {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-clear {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      flex: 0.35;
    }

    .btn-start {
      background: linear-gradient(135deg, #ffcc00, #ff9900);
      color: #000;
    }

    .btn-start:disabled {
      filter: grayscale(1);
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Customized Popup Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 3, 20, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .custom-modal {
      width: 85%;
      max-width: 320px;
      background: linear-gradient(135deg, #2a085c, #140a23);
      border: 2px solid #ffcc00;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(255, 204, 0, 0.2);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .custom-modal {
      transform: scale(1);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffcc00;
      margin-bottom: 8px;
    }

    .modal-message {
      font-size: 12px;
      color: #fff;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-btn {
      background: linear-gradient(135deg, #ffcc00, #ff9900);
      color: #000;
      border: none;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 153, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="header">
    <button class="btn-back" onclick="location.href='index.html'">← Home</button>
    <div class="coin-box">🪙 <span id="userCoins">1000</span></div>
  </div>

  <div class="title">Color Card Flip</div>
  <div class="xp-display" id="userXpDisplay">XP: 0</div>
  <div class="instruction" id="instructionText">Place bets, then click START GAME!</div>

  <!-- Arena Table -->
  <div class="arena">
    <div class="cards-grid" id="cardsGrid"></div>
    <div class="dealer-deck" id="dealerDeck">🎴</div>
  </div>

  <!-- Compact History Box -->
  <div class="history-box">
    <div class="history-title">Result History</div>
    <div class="history-list" id="historyList">
      <span style="font-size:9px; color:rgba(255,255,255,0.4); padding: 3px;">No rounds played yet</span>
    </div>
  </div>

  <div class="chips-bar">
    <div class="chip chip-10 active" onclick="selectChip(10, this)">10</div>
    <div class="chip chip-50" onclick="selectChip(50, this)">50</div>
    <div class="chip chip-100" onclick="selectChip(100, this)">100</div>
    <div class="chip chip-500" onclick="selectChip(500, this)">500</div>
  </div>

  <div class="grid">
    <div class="color-card c-red" onclick="placeBet('red')"><span class="card-title">Red</span><span id="bet-red" class="bet-badge">🪙 0</span></div>
    <div class="color-card c-blue" onclick="placeBet('blue')"><span class="card-title">Blue</span><span id="bet-blue" class="bet-badge">🪙 0</span></div>
    <div class="color-card c-white" onclick="placeBet('white')"><span class="card-title">White</span><span id="bet-white" class="bet-badge">🪙 0</span></div>
    <div class="color-card c-yellow" onclick="placeBet('yellow')"><span class="card-title">Yellow</span><span id="bet-yellow" class="bet-badge">🪙 0</span></div>
    <div class="color-card c-pink" onclick="placeBet('pink')"><span class="card-title">Pink</span><span id="bet-pink" class="bet-badge">🪙 0</span></div>
    <div class="color-card c-green" onclick="placeBet('green')"><span class="card-title">Green</span><span id="bet-green" class="bet-badge">🪙 0</span></div>
  </div>

  <div class="actions">
    <button class="btn btn-clear" onclick="clearBets()">Clear</button>
    <button id="startBtn" class="btn btn-start" onclick="startGame()">START GAME</button>
  </div>

  <!-- Customized Popup Modal Overlay -->
  <div class="modal-overlay" id="customModalOverlay">
    <div class="custom-modal">
      <div class="modal-title" id="modalTitle">Notice</div>
      <div class="modal-message" id="modalMessage">Message content goes here.</div>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const COLORS = ['red', 'blue', 'white', 'yellow', 'pink', 'green'];
    const HEX_MAP = {
      red: '#ff3366', blue: '#2575fc', white: '#ffffff',
      yellow: '#ffcc00', pink: '#ff66cc', green: '#00e676'
    };

    let selectedChip = 10;
    let totalCoins = parseInt(localStorage.getItem('userCoins')) || 1000;
    let userXp = parseInt(localStorage.getItem('userXp')) || 0;
    
    let bets = { red: 0, blue: 0, white: 0, yellow: 0, pink: 0, green: 0 };
    let gameState = 'IDLE'; 
    let deckColors = [];
    let flippedCount = 0;
    let playerPickedResults = [];
    let gameHistory = [];

    function showPopup(title, message) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').innerHTML = message;
      document.getElementById('customModalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('customModalOverlay').classList.remove('active');
    }

    function syncUserData() {
      localStorage.setItem('userCoins', totalCoins);
      localStorage.setItem('userXp', userXp);
    }

    function initBoard() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      for (let i = 0; i < 18; i++) {
        const slot = document.createElement('div');
        slot.className = 'card-slot';
        slot.id = `cardSlot-${i}`;
        slot.onclick = () => handleCardClick(i);

        slot.innerHTML = `
          <div class="card-inner" id="cardInner-${i}">
            <div class="card-face card-back">🎴</div>
            <div class="card-face card-front" id="cardFront-${i}">?</div>
          </div>
        `;
        grid.appendChild(slot);
      }
    }

    function updateUI() {
      document.getElementById('userCoins').textContent = totalCoins;
      document.getElementById('userXpDisplay').textContent = `XP: ${userXp}`;
      syncUserData();

      COLORS.forEach(c => {
        const badge = document.getElementById(`bet-${c}`);
        if (bets[c] > 0) {
          badge.textContent = `🪙 ${bets[c]}`;
          badge.style.display = 'block';
        } else {
          badge.style.display = 'none';
        }
      });
    }

    function selectChip(amount, element) {
      if (gameState !== 'IDLE') return;
      selectedChip = amount;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
    }

    function placeBet(color) {
      if (gameState !== 'IDLE') return;
      if (totalCoins < selectedChip) {
        showPopup("Insufficient Balance", "You don't have enough coins to place this bet!");
        return;
      }
      totalCoins -= selectedChip;
      bets[color] += selectedChip;
      updateUI();
    }

    function clearBets() {
      if (gameState !== 'IDLE') return;
      let totalRefund = 0;
      COLORS.forEach(c => {
        totalRefund += bets[c];
        bets[c] = 0;
      });
      totalCoins += totalRefund;
      updateUI();
    }

    function startGame() {
      const totalBetAmount = Object.values(bets).reduce((a, b) => a + b, 0);
      if (totalBetAmount === 0) {
        showPopup("No Bets Placed", "Please place at least one bet before starting the game!");
        return;
      }

      gameState = 'ANIMATING';
      document.getElementById('startBtn').disabled = true;
      document.getElementById('instructionText').textContent = "👀 Look at the cards layout...";

      deckColors = [];
      COLORS.forEach(c => deckColors.push(c, c, c));
      deckColors.sort(() => Math.random() - 0.5);

      flippedCount = 0;
      playerPickedResults = [];

      for (let i = 0; i < 18; i++) {
        const slot = document.getElementById(`cardSlot-${i}`);
        const front = document.getElementById(`cardFront-${i}`);
        const color = deckColors[i];
        
        front.textContent = color;
        front.className = `card-face card-front glass-${color}`;

        slot.classList.add('flipped');
        slot.style.opacity = '1';
        slot.style.pointerEvents = 'none';
      }

      setTimeout(() => {
        document.getElementById('instructionText').textContent = "🔀 Shuffling neon deck...";
        for (let i = 0; i < 18; i++) {
          document.getElementById(`cardSlot-${i}`).classList.remove('flipped');
        }

        setTimeout(() => {
          const gridSlots = document.querySelectorAll('.card-slot');
          gridSlots.forEach(slot => slot.style.opacity = '0');
          
          const dealerDeck = document.getElementById('dealerDeck');
          dealerDeck.style.display = 'flex';
          
          let shakes = 0;
          const shakeInterval = setInterval(() => {
            shakes++;
            const rot = (shakes % 2 === 0) ? 6 : -6;
            const scale = (shakes % 2 === 0) ? 1.05 : 0.95;
            dealerDeck.style.transform = `translate(-50%, -50%) scale(${scale}) rotate(${rot}deg)`;
          }, 180);

          setTimeout(() => {
            clearInterval(shakeInterval);
            dealerDeck.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';
            dealerDeck.style.display = 'none';

            deckColors.sort(() => Math.random() - 0.5);

            gridSlots.forEach((slot, index) => {
              setTimeout(() => {
                slot.style.opacity = '1';
                const front = document.getElementById(`cardFront-${index}`);
                const color = deckColors[index];
                front.textContent = color;
                front.className = `card-face card-front glass-${color}`;
              }, index * 50);
            });

            setTimeout(() => {
              gameState = 'PICKING';
              document.getElementById('instructionText').textContent = "👉 Tap any 3 cards to pick your results!";
              gridSlots.forEach(slot => slot.style.pointerEvents = 'auto');
            }, 18 * 50 + 100);

          }, 2000);

        }, 600);

      }, 1500);
    }

    function handleCardClick(index) {
      if (gameState !== 'PICKING') return;
      const slot = document.getElementById(`cardSlot-${index}`);
      
      if (slot.classList.contains('flipped')) return;

      slot.classList.add('flipped');
      const color = deckColors[index];
      playerPickedResults.push(color);
      flippedCount++;

      document.getElementById('instructionText').textContent = `👉 Cards picked: ${flippedCount} / 3`;

      if (flippedCount === 3) {
        gameState = 'IDLE';
        setTimeout(() => evaluateGameResults(), 600);
      }
    }

    function evaluateGameResults() {
      let totalWinnings = 0;

      COLORS.forEach(color => {
        const betOnColor = bets[color];
        if (betOnColor > 0) {
          const matches = playerPickedResults.filter(r => r === color).length;
          if (matches > 0) {
            totalWinnings += betOnColor + (betOnColor * matches);
          }
        }
      });

      totalCoins += totalWinnings;
      userXp += 15; // Earn XP per round played

      for (let i = 0; i < 18; i++) {
        document.getElementById(`cardSlot-${i}`).style.pointerEvents = 'none';
      }

      gameHistory.push({ results: [...playerPickedResults], won: totalWinnings > 0 });
      if (gameHistory.length > 10) gameHistory.shift(); 
      renderHistory();

      if (totalWinnings > 0) {
        document.getElementById('instructionText').textContent = `🎉 YOU WON 🪙 ${totalWinnings}!`;
        showPopup("Victory!", `🎉 You won <b>🪙 ${totalWinnings}</b>!<br><br>Picked: ${playerPickedResults.join(' • ').toUpperCase()}`);
      } else {
        document.getElementById('instructionText').textContent = `😢 NO MATCHES.`;
        showPopup("Round Over", `😢 No matches found.<br><br>Picked: ${playerPickedResults.join(' • ').toUpperCase()}`);
      }

      COLORS.forEach(c => bets[c] = 0);
      document.getElementById('startBtn').disabled = false;
      updateUI();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';

      gameHistory.forEach(item => {
        const el = document.createElement('div');
        el.className = 'history-item';
        el.style.borderColor = item.won ? 'rgba(0, 230, 118, 0.4)' : 'rgba(255, 51, 102, 0.4)';
        
        let cardsHTML = item.results.map(c => `<div class="h-card glass-${c}"></div>`).join('');
        el.innerHTML = cardsHTML;
        list.appendChild(el);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initBoard();
      updateUI();
    });
  </script>
</body>
</html>
