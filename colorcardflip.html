<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Memory Card</title>
  <style>
    /* STACKED CSS: REMOVE ALL BROWSER FOCUS OUTLINES AND HIGHLIGHTS */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      outline: none !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
    }

    *:focus, *:active {
      outline: none !important;
      box-shadow: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f051d;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      user-select: none;
    }

    /* TOP BAR CONTAINER */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 420px;
      position: relative;
      margin-top: 20px;
      flex-shrink: 0;
    }

    .top-bar > *:nth-child(1) { position: absolute; left: 0; }
    .top-bar > *:nth-child(2) { width: 100%; display: flex; justify-content: center; }
    .top-bar > *:nth-child(3) { position: absolute; right: 0; }

    /* CIRCULAR BACK BUTTON */
    .icon-btn {
      background: rgba(20, 10, 35, 0.8);
      border: 2px solid #ffd700;
      color: #ffd700;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), inset 0 0 6px rgba(255, 215, 0, 0.2);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .icon-btn:hover, .icon-btn:active {
      background: rgba(255, 215, 0, 0.15);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.7), inset 0 0 10px rgba(255, 215, 0, 0.4);
      transform: scale(1.05);
    }

    /* PREMIUM GAME TITLE */
    .game-title-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .game-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #ffd700 60%, #b38f00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8)) drop-shadow(0px 0px 10px rgba(255, 215, 0, 0.4));
    }

    /* COIN BADGE */
    .coin-badge {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #ffd700;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      color: #ffd700;
      z-index: 2;
      display: flex;         
      align-items: center;   
      justify-content: center; 
      gap: 6px;              
    }

    /* HEADER WRAPPER FOR SUB-ELEMENTS */
    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Stage Indicator */
    .stage-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
    }

    /* Stats Box Container */
    .stats-container {
      display: flex;
      width: 100%;
      background: #18082e;
      border: 1.5px solid #3c1968;
      border-radius: 12px;
      padding: 6px;
    }

    .stat-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .stat-box:first-child {
      border-right: 1px solid #3c1968;
    }

    .stat-icon {
      font-size: 1.3rem;
    }

    .stat-details {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.6rem;
      color: #9a88b5;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
    }

    /* Main Board Container */
    .board-wrapper {
      width: 100%;
      max-width: 420px;
      flex: 1;
      background: #150628;
      border: 1.5px solid #3c1968;
      border-radius: 16px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      overflow: hidden;
    }

    /* Board Dynamic Grid */
    .board {
      display: grid;
      gap: 8px;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-content: center;
      justify-items: center;
      perspective: 1000px;
    }

    /* Card Styling (Strict 1:1 Aspect Ratio) */
    .card {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
      cursor: pointer;
      width: var(--card-size, 80px);
      height: var(--card-size, 80px);
      aspect-ratio: 1 / 1;
    }

    .card.flip, .card.matched {
      transform: rotateY(180deg);
    }

    .card.matched {
      cursor: default;
    }

    .card-face {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      border: 1.5px solid #ffd700;
      overflow: hidden;
      transition: filter 0.3s ease, border-color 0.3s ease;
    }

    /* Card Back Design (Face Down Logo vinz.png) */
    .card-front {
      background: #250a48;
      padding: 6px;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Card Front Design (Face Up Level Image) */
    .card-back {
      background: #351063;
      transform: rotateY(180deg);
      padding: 4px;
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      border-radius: 4px;
    }

    /* Matching Glow Effect */
    .card.matched .card-face {
      border-color: #00ff66 !important;
      filter: drop-shadow(0px 0px 8px #00ff66);
    }

    /* Modal Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 2, 20, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 10;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #1d0738;
      border: 2px solid #ffd700;
      padding: 22px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      width: 85%;
    }

    .modal h2 {
      color: #ffd700;
      margin-bottom: 8px;
      font-size: 1.5rem;
    }

    .modal p {
      margin-bottom: 18px;
      font-size: 0.95rem;
      color: #ddd;
    }

    .btn {
      background: #ffd700;
      color: #150628;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="bg-music" src="sounds/bgmusic.mp3" loop></audio>
  <audio id="tap-sound" src="select.mp3"></audio>

  <header>
    <!-- Integrated Top Bar Structure -->
    <div class="top-bar">
      <button class="icon-btn" id="backToHome" onclick="window.location.href='index.html'">‹</button>
      <div class="game-title-container">
        <span class="game-title">Memory Card</span>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">8944</span></div>
    </div>

    <div class="stage-title" id="stage-title">Stage 1</div>

    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-icon">⏱️</span>
        <div class="stat-details">
          <span class="stat-label">TIME</span>
          <span class="stat-value" id="time-count">00:00</span>
        </div>
      </div>
      <div class="stat-box">
        <span class="stat-icon">🔄</span>
        <div class="stat-details">
          <span class="stat-label">FLIPS</span>
          <span class="stat-value" id="flip-count">0</span>
        </div>
      </div>
    </div>
  </header>

  <div class="board-wrapper" id="board-wrapper">
    <div class="board" id="board"></div>
  </div>

  <!-- Stage Clear Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modal-title">Stage Cleared!</h2>
      <p id="modal-msg">Great job!</p>
      <button class="btn" id="next-btn" onclick="nextStage()">Next Stage</button>
    </div>
  </div>

  <script>
    let currentStage = 1;
    let coins = 8944;
    let flips = 0;
    let flippedCards = [];
    let matchedPairs = 0;
    let totalPairs = 0;
    let lockBoard = false;
    let timerInterval = null;
    let secondsElapsed = 0;

    const bgMusic = document.getElementById('bg-music');
    const tapSound = document.getElementById('tap-sound');

    function initAudio() {
      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
    }

    function playTapSound() {
      tapSound.currentTime = 0;
      tapSound.play().catch(() => {});
    }

    function getCardCountForStage(stage) {
      if (stage === 1) return 4;
      if (stage === 2) return 6;
      if (stage === 3) return 8;
      if (stage === 4) return 10;
      if (stage === 5) return 12;
      if (stage === 6) return 14;
      if (stage === 7) return 16;
      if (stage === 8) return 18;
      if (stage === 9) return 20;
      if (stage === 10) return 20;
      if (stage <= 20) return 22;
      if (stage <= 30) return 24;
      if (stage <= 40) return 26;
      if (stage <= 50) return 28;
      if (stage <= 60) return 30;
      if (stage <= 70) return 32;
      if (stage <= 80) return 34;
      if (stage <= 90) return 36;
      if (stage <= 100) return 40;
      return 40;
    }

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('time-count').textContent = `${mins}:${secs}`;
    }

    function startStage(stage) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      flips = 0;
      lockBoard = false;

      const numCards = getCardCountForStage(stage);
      totalPairs = numCards / 2;

      document.getElementById('stage-title').textContent = `Stage ${stage}`;
      document.getElementById('flip-count').textContent = flips;

      let selectedImages = [];
      for (let i = 1; i <= totalPairs; i++) {
        selectedImages.push(`image/level${i}.png`);
      }

      let cardDeck = [...selectedImages, ...selectedImages];
      cardDeck.sort(() => Math.random() - 0.5);

      cardDeck.forEach((imgSrc) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.symbol = imgSrc;

        card.innerHTML = `
          <div class="card-face card-front">
            <img src="image/vinz.png" alt="card back logo" />
          </div>
          <div class="card-face card-back">
            <img src="${imgSrc}" alt="card front image" />
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });

      configureGridAndSizing(numCards);
      startTimer();
    }

    function configureGridAndSizing(cardCount) {
      const board = document.getElementById('board');
      const wrapper = document.getElementById('board-wrapper');

      let cols = 2;
      if (cardCount === 4 || cardCount === 6) cols = 2;
      else if (cardCount <= 12) cols = 3;
      else if (cardCount <= 24) cols = 4;
      else cols = 5;

      const rows = Math.ceil(cardCount / cols);
      const gap = 8;

      const availableWidth = wrapper.clientWidth - 20;
      const availableHeight = wrapper.clientHeight - 20;

      let cardSize = Math.min(
        (availableWidth - (cols - 1) * gap) / cols,
        (availableHeight - (rows - 1) * gap) / rows
      );

      document.documentElement.style.setProperty('--card-size', `${Math.floor(cardSize)}px`);
      board.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    }

    function flipCard() {
      initAudio();
      if (lockBoard) return;
      if (this.classList.contains('flip') || this.classList.contains('matched')) return;

      playTapSound();
      this.classList.add('flip');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        flips++;
        document.getElementById('flip-count').textContent = flips;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.symbol === card2.dataset.symbol;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        flippedCards = [];

        if (matchedPairs === totalPairs) {
          stopTimer();
          setTimeout(stageComplete, 400);
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flip');
          card2.classList.remove('flip');
          flippedCards = [];
          lockBoard = false;
        }, 750);
      }
    }

    function stageComplete() {
      coins += 10;
      document.getElementById('coinCount').textContent = coins;

      const overlay = document.getElementById('overlay');
      const title = document.getElementById('modal-title');
      const msg = document.getElementById('modal-msg');
      const btn = document.getElementById('next-btn');

      if (currentStage === 100) {
        title.textContent = "🏆 Stage 100 Cleared!";
        msg.textContent = `Congratulations! You beat all stages!`;
        btn.textContent = "Play Again";
        btn.onclick = () => {
          currentStage = 1;
          overlay.classList.remove('active');
          startStage(currentStage);
        };
      } else {
        title.textContent = `Stage ${currentStage} Cleared!`;
        msg.textContent = `Time: ${document.getElementById('time-count').textContent} | Flips: ${flips}`;
        btn.textContent = "Next Stage";
        btn.onclick = nextStage;
      }

      overlay.classList.add('active');
    }

    function nextStage() {
      document.getElementById('overlay').classList.remove('active');
      currentStage++;
      startStage(currentStage);
    }

    window.addEventListener('resize', () => configureGridAndSizing(getCardCountForStage(currentStage)));
    document.addEventListener('click', initAudio, { once: true });

    startStage(currentStage);
  </script>
</body>
</html>
