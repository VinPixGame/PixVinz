<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixVinz - Crypto Dice Deluxe</title>
    <link rel="stylesheet" href="dice.css">
</head>
<body>

    <header class="top-bar">
      <button class="icon-btn" onclick="playSound('click'); window.location.href='index.html'">←</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">950.00</span></div>
    </header>

    <div class="external-title-area">
        <h2 class="external-title">🎯 PROVABLY FAIR DICE</h2>
        <p class="external-subtitle">Slide to adjust odds & hit roll!</p>
    </div>

    <div class="game-container">
        <div class="card">
            
            <div class="history-bar" id="historyBar">
                <div class="history-pill">12.50</div>
                <div class="history-pill win">74.12</div>
                <div class="history-pill">45.00</div>
                <div class="history-pill win">91.05</div>
                <div class="history-pill">30.22</div>
                <div class="history-pill win">65.80</div>
            </div>
            
            <div class="slider-section">
                <div class="floating-cube-indicator" id="floatingCube">53.00</div>
                <div class="slider-labels">
                    <span>0</span>
                    <span>25</span>
                    <span>50</span>
                    <span>75</span>
                    <span>100</span>
                </div>
                <div class="track-container">
                    <div class="slider-track" id="sliderTrackBg">
                        <div class="slider-track-fill" id="successTrack"></div>
                    </div>
                    <input type="range" min="2" max="98" value="47" class="range-input" id="rollSlider" oninput="onSliderDrag(this.value)">
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Multiplier</div>
                    <div class="stat-value" id="multiplierVal">1.87x</div>
                </div>
                <div class="stat-box interactive" onclick="playSound('click'); toggleRollMode()">
                    <div class="stat-label" id="modeLabel">Roll Over 🔄</div>
                    <div class="stat-value" id="rollOverVal">47.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Chance</div>
                    <div class="stat-value" id="winChanceVal">53.00%</div>
                </div>
            </div>

            <div class="input-group">
                <div class="input-left">
                    <div class="input-label">Bet Amount</div>
                    <input type="number" id="betAmountInput" class="bet-input" value="10">
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="playSound('click'); halveBet()">½</button>
                    <button class="quick-btn" onclick="playSound('click'); doubleBet()">2×</button>
                </div>
            </div>

            <div class="auto-controls" id="autoControls">
                <div class="auto-row">
                    <div class="auto-input-box">
                        <div class="input-label">Number of Rolls</div>
                        <input type="number" id="autoRollsInput" class="auto-input" value="10">
                    </div>
                    <div class="auto-input-box">
                        <div class="input-label">On Win (%)</div>
                        <input type="number" id="onWinInput" class="auto-input" value="0">
                    </div>
                </div>
                <div class="auto-row">
                    <div class="auto-input-box">
                        <div class="input-label">On Loss (%)</div>
                        <input type="number" id="onLossInput" class="auto-input" value="0">
                    </div>
                    <div class="auto-input-box">
                        <div class="input-label">Speed (ms)</div>
                        <input type="number" id="autoSpeedInput" class="auto-input" value="400">
                    </div>
                </div>
            </div>

            <div class="error-msg-container">
                <div class="error-msg" id="errorMsg">Not enough balance</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; font-size: 13px;">
                <span style="color: #94a3b8; font-weight: 700;">Profit on Win:</span>
                <span style="color: #4ade80; font-weight: 800;" id="profitVal">8.70 Coins</span>
            </div>

            <button class="btn-bet" id="betBtn" onclick="playSound('click'); handleMainButtonClick()">ROLL</button>

            <div class="mode-tabs">
                <button class="mode-tab active" id="manualTab" onclick="switchMode('manual')">Manual</button>
                <button class="mode-tab" id="autoTab" onclick="switchMode('auto')">Auto</button>
            </div>
        </div>
    </div>

    <script src="profile.js"></script>
    <script src="playerstat.js"></script>
    <script src="script.js"></script>
    <script src="dice.js"></script>
</body>
</html>
