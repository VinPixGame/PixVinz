<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixVinz - Crypto Dice Deluxe</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1e293b;
            z-index: 1000;
            box-sizing: border-box;
            border-bottom: 2px solid #334155;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #334155;
            border: 2px solid #6366f1;
            overflow: hidden;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .logo-container {
            height: 35px;
        }
        .logo-container video {
            height: 100%;
            background: transparent;
        }
        .coin-badge {
            background: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #fbbf24;
            font-weight: bold;
            font-size: 14px;
            color: #fbbf24;
        }

        /* Main Game Layout */
        .game-container {
            width: 100%;
            max-width: 440px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 75px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Recent History Bar (Top of Card) */
        .history-bar {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .history-bar::-webkit-scrollbar {
            display: none;
        }
        .history-pill {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .history-pill.win {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
            color: #4ade80;
        }
        .history-pill.lose {
            background: #0f172a;
            border-color: #334155;
            color: #94a3b8;
        }

        /* Stake Style Slider Section with Floating Cube */
        .slider-section {
            margin: 35px 0 30px 0;
            position: relative;
        }

        /* Floating Hex/Cube Result Indicator */
        .floating-cube-indicator {
            position: absolute;
            top: -42px;
            left: 50%;
            transform: translateX(-50%);
            background: #f8fafc;
            color: #0f172a;
            font-weight: 900;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #cbd5e1;
            transition: left 0.4s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            white-space: nowrap;
            z-index: 20;
            display: none;
        }
        .floating-cube-indicator::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 10px;
            height: 10px;
            background: #f8fafc;
            border-right: 2px solid #cbd5e1;
            border-bottom: 2px solid #cbd5e1;
        }
        .floating-cube-indicator.win {
            background: #22c55e;
            color: #fff;
            border-color: #86efac;
        }
        .floating-cube-indicator.win::after {
            background: #22c55e;
            border-color: #86efac;
        }
        .floating-cube-indicator.lose {
            background: #ef4444;
            color: #fff;
            border-color: #fca5a5;
        }
        .floating-cube-indicator.lose::after {
            background: #ef4444;
            border-color: #fca5a5;
        }
        
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .track-container {
            position: relative;
            height: 32px;
            display: flex;
            align-items: center;
        }

        .slider-track {
            position: absolute;
            width: 100%;
            height: 14px;
            background: #ef4444;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .slider-track-success {
            position: absolute;
            height: 100%;
            right: 0;
            width: 53%;
            background: #22c55e;
            border-radius: 0 8px 8px 0;
        }

        .range-input {
            position: absolute;
            width: 100%;
            height: 32px;
            background: transparent;
            appearance: none;
            cursor: pointer;
            z-index: 10;
            margin: 0;
        }

        .range-input::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 36px;
            background: #3b82f6;
            border: 3px solid #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 800;
            color: #f8fafc;
        }

        /* Bet Amount Input */
        .input-group {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .input-left {
            text-align: left;
        }

        .input-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 18px;
            font-weight: 800;
            width: 120px;
            outline: none;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
        }

        .quick-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
        .quick-btn:hover {
            background: #334155;
        }

        /* Main Bet Button */
        .btn-bet {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: 2px solid #60a5fa;
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-bet:active {
            transform: scale(0.98);
        }

        .btn-back {
            background: transparent;
            border: 2px solid #64748b;
            color: #94a3b8;
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Header Bar -->
    <header class="top-bar" id="mainHeader">
      <button class="icon-btn" id="profileHeaderBtn" onclick="window.location.href='index.html'">
        <span id="profileIconFallback">👤</span>
        <img id="profileHeaderImg" src="" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;">
      </button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">950</span></div>
    </header>

    <!-- Game Container -->
    <div class="game-container">
        <div class="card">
            
            <!-- Recent 8 Results Rolling History Bar -->
            <div class="history-bar" id="historyBar">
                <div class="history-pill">53.20</div>
                <div class="history-pill win">88.41</div>
                <div class="history-pill">12.50</div>
                <div class="history-pill win">74.12</div>
                <div class="history-pill">45.00</div>
                <div class="history-pill win">91.05</div>
                <div class="history-pill">30.22</div>
                <div class="history-pill win">65.80</div>
            </div>

            <h2 style="margin: 0 0 5px 0; color: #fbbf24;">🎯 PROVABLY FAIR DICE</h2>
            <p style="color: #94a3b8; font-size: 12px; margin: 0 0 15px 0;">Slide to adjust odds & hit roll!</p>
            
            <!-- Slider Section with Floating Hex Cube Indicator -->
            <div class="slider-section">
                <div class="floating-cube-indicator" id="floatingCube">53.00</div>
                <div class="slider-labels">
                    <span>0</span>
                    <span>25</span>
                    <span>50</span>
                    <span>75</span>
                    <span>100</span>
                </div>
                <div class="track-container">
                    <div class="slider-track">
                        <div class="slider-track-success" id="successTrack"></div>
                    </div>
                    <input type="range" min="2" max="98" value="47" class="range-input" id="rollSlider" oninput="updateSlider(this.value)">
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Multiplier</div>
                    <div class="stat-value" id="multiplierVal">1.87x</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Roll Over</div>
                    <div class="stat-value" id="rollOverVal">47.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Chance</div>
                    <div class="stat-value" id="winChanceVal">53.00%</div>
                </div>
            </div>

            <!-- Bet Amount Input -->
            <div class="input-group">
                <div class="input-left">
                    <div class="input-label">Bet Amount</div>
                    <input type="number" id="betAmountInput" class="bet-input" value="10">
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="halveBet()">½</button>
                    <button class="quick-btn" onclick="doubleBet()">2×</button>
                </div>
            </div>

            <!-- Profit on Win -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; font-size: 13px;">
                <span style="color: #94a3b8; font-weight: 700;">Profit on Win:</span>
                <span style="color: #4ade80; font-weight: 800;" id="profitVal">8.70 Coins</span>
            </div>

            <!-- Bet Action Button -->
            <button class="btn-bet" id="betBtn" onclick="executeRoll()">BET</button>

            <button class="btn-back" onclick="window.location.href='index.html'">← BACK TO HOME</button>
        </div>
    </div>

    <script>
        let currentCoins = parseInt(localStorage.getItem('pixvinz_coins')) || 950;
        document.getElementById('coinCount').innerText = currentCoins;

        let recentHistory = [53.20, 88.41, 12.50, 74.12, 45.00, 91.05, 30.22, 65.80];

        function updateSlider(val) {
            let rollOver = parseFloat(val);
            let winChance = 100 - rollOver;
            let multiplier = (99 / winChance).toFixed(4);

            document.getElementById('rollOverVal').innerText = rollOver.toFixed(2);
            document.getElementById('winChanceVal').innerText = winChance.toFixed(2) + '%';
            document.getElementById('multiplierVal').innerText = multiplier + 'x';

            document.getElementById('successTrack').style.width = winChance + '%';
            updateProfit();
        }

        function updateProfit() {
            let bet = parseFloat(document.getElementById('betAmountInput').value) || 0;
            let mult = parseFloat(document.getElementById('multiplierVal').innerText);
            let profit = (bet * mult) - bet;
            document.getElementById('profitVal').innerText = profit.toFixed(2) + ' Coins';
        }

        document.getElementById('betAmountInput').addEventListener('input', updateProfit);

        function halveBet() {
            let input = document.getElementById('betAmountInput');
            let val = Math.max(1, Math.floor(parseFloat(input.value) / 2));
            input.value = val;
            updateProfit();
        }

        function doubleBet() {
            let input = document.getElementById('betAmountInput');
            let val = Math.floor(parseFloat(input.value) * 2);
            input.value = val;
            updateProfit();
        }

        function renderHistory(latestRoll, isWin) {
            recentHistory.push(latestRoll);
            if (recentHistory.length > 8) {
                recentHistory.shift();
            }

            let bar = document.getElementById('historyBar');
            bar.innerHTML = '';
            recentHistory.forEach((roll, idx) => {
                let pill = document.createElement('div');
                pill.className = 'history-pill';
                // Highlight winning thresholds for historical context (mocked win state or stored flags)
                let rollOverCurrent = parseFloat(document.getElementById('rollOverVal').innerText);
                if (roll > rollOverCurrent) {
                    pill.classList.add('win');
                }
                pill.innerText = roll.toFixed(2);
                bar.appendChild(pill);
            });
        }

        function executeRoll() {
            let betAmount = parseFloat(document.getElementById('betAmountInput').value);
            if (isNaN(betAmount) || betAmount <= 0) {
                alert("Please enter a valid bet amount!");
                return;
            }
            if (betAmount > currentCoins) {
                alert("Not enough coins!");
                return;
            }

            currentCoins -= betAmount;
            document.getElementById('coinCount').innerText = currentCoins;

            let rollOver = parseFloat(document.getElementById('rollOverVal').innerText);
            let multiplier = parseFloat(document.getElementById('multiplierVal').innerText);

            // Generate random roll
            let rolledNum = Math.random() * 100;
            let isWin = rolledNum > rollOver;

            // Animate Floating Cube Indicator to position
            let cube = document.getElementById('floatingCube');
            cube.style.display = 'block';
            // Position percentage along the slider track (2 to 98 bounds)
            let percentage = rolledNum; 
            cube.style.left = percentage + '%';
            cube.innerText = rolledNum.toFixed(2);

            if (isWin) {
                cube.className = "floating-cube-indicator win";
                let payout = betAmount * multiplier;
                currentCoins += payout;
            } else {
                cube.className = "floating-cube-indicator lose";
            }

            document.getElementById('coinCount').innerText = currentCoins.toFixed(2);
            localStorage.setItem('pixvinz_coins', currentCoins);

            renderHistory(rolledNum, isWin);
        }

        updateSlider(47);
    </script>
</body>
</html>
