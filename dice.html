<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixVinz - Crypto Dice Deluxe</title>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header Bar - Fixed */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 440px;
            position: relative;
            flex-shrink: 0;
            padding: 12px 15px;
            background: #0f172a;
            box-sizing: border-box;
            border-bottom: none;
            margin-top: 1cm;
            z-index: 50;
        }

        .top-bar > *:nth-child(1) { position: absolute; left: 15px; }
        .top-bar > *:nth-child(2) { width: 100%; display: flex; justify-content: center; }
        .top-bar > *:nth-child(3) { position: absolute; right: 15px; }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 40px;
        }

        .logo-container video,
        #logoVideo {
            width: 160px;
            height: auto;
            object-fit: contain;
            background: transparent;
        }

        .icon-btn {
            background: rgba(20, 10, 35, 0.8);
            border: 2px solid #ffd700;
            color: #ffd700;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), inset 0 0 6px rgba(255, 215, 0, 0.2);
            transition: all 0.2s ease;
            padding: 0;
            outline: none;
        }

        .icon-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7), inset 0 0 10px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.85);
        }

        .coin-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #ffd700;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            color: #ffd700;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* External Title Area - Fixed */
        .external-title-area {
            width: 100%;
            max-width: 440px;
            padding: 0 15px;
            box-sizing: border-box;
            text-align: center;
            margin-top: 6px;
            margin-bottom: 14px;
            flex-shrink: 0;
            background: #0f172a;
            z-index: 40;
        }

        .external-title {
            margin: 0 0 4px 0;
            color: #fbbf24;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .external-subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin: 0;
        }

        /* Main Game Layout - Scrollable Area */
        .game-container {
            width: 100%;
            max-width: 450px;
            padding: 0 15px 30px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .game-container::-webkit-scrollbar {
            display: none;
        }

        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Recent History Bar - 6 recent results */
        .history-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .history-bar::-webkit-scrollbar {
            display: none;
        }
        .history-pill {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .history-pill.win {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
            color: #4ade80;
        }
        .history-pill.lose {
            background: #0f172a;
            border-color: #334155;
            color: #94a3b8;
        }

        /* Slider Section */
        .slider-section {
            margin: 40px 0 24px 0;
            position: relative;
        }

        .floating-cube-indicator {
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            background: #f8fafc;
            color: #0f172a;
            font-weight: 900;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 7px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #cbd5e1;
            transition: left 0.3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            white-space: nowrap;
            z-index: 20;
            display: none;
        }
        .floating-cube-indicator::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 8px;
            height: 8px;
            background: #f8fafc;
            border-right: 2px solid #cbd5e1;
            border-bottom: 2px solid #cbd5e1;
        }
        .floating-cube-indicator.win {
            background: #22c55e;
            color: #fff;
            border-color: #86efac;
        }
        .floating-cube-indicator.win::after {
            background: #22c55e;
            border-color: #86efac;
        }
        .floating-cube-indicator.lose {
            background: #ef4444;
            color: #fff;
            border-color: #fca5a5;
        }
        .floating-cube-indicator.lose::after {
            background: #ef4444;
            border-color: #fca5a5;
        }
        
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .track-container {
            position: relative;
            height: 32px;
            display: flex;
            align-items: center;
        }

        .slider-track {
            position: absolute;
            width: 100%;
            height: 14px;
            background: #22c55e;
            border-radius: 7px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .slider-track-fill {
            position: absolute;
            height: 100%;
            left: 0;
            width: 47%;
            background: #ef4444;
            border-radius: 7px 0 0 7px;
        }

        .range-input {
            position: absolute;
            width: 100%;
            height: 32px;
            background: transparent;
            appearance: none;
            cursor: pointer;
            z-index: 10;
            margin: 0;
            outline: none;
        }

        .range-input::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 36px;
            background: #3b82f6;
            border: 2px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .range-input::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 11px 6px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .stat-box:active {
            transform: scale(0.92);
        }
        .stat-box.interactive:hover {
            border-color: #6366f1;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 800;
            color: #f8fafc;
        }

        /* Bet Amount Input Container */
        .input-group {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .input-left {
            text-align: left;
        }

        .input-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 18px;
            font-weight: 800;
            width: 120px;
            outline: none;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
        }

        .quick-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
        }
        .quick-btn:active {
            transform: scale(0.85);
            background: #475569;
        }

        /* Auto Bet Specific Controls */
        .auto-controls {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .auto-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .auto-input-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 8px 12px;
            text-align: left;
        }

        .auto-input {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 800;
            width: 100%;
            outline: none;
        }

        /* Centered Disappearing Error Message */
        .error-msg-container {
            height: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-msg {
            font-size: 12px;
            font-weight: 700;
            color: #ef4444;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .error-msg.show {
            opacity: 1;
        }

        /* Action Buttons */
        .btn-bet {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: 2px solid #60a5fa;
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-bet:active {
            transform: scale(0.95);
        }
        .btn-bet:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .btn-bet.stop-auto {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-color: #f87171;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        /* Mode Switcher Tabs - Bottom Navigation */
        .mode-tabs {
            display: flex;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 3px;
            margin-top: 14px;
        }

        .mode-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 800;
            padding: 10px 0;
            border-radius: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .mode-tab.active {
            background: #334155;
            color: #f8fafc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- Header - Fixed -->
    <header class="top-bar">
      <button class="icon-btn" onclick="playSound('click'); window.location.href='index.html'">←</button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">950.00</span></div>
    </header>

    <!-- External Title Area - Fixed (6px spacing from top bar) -->
    <div class="external-title-area">
        <h2 class="external-title">🎯 PROVABLY FAIR DICE</h2>
        <p class="external-subtitle">Slide to adjust odds & hit roll!</p>
    </div>

    <!-- Game Container - Independently Scrollable -->
    <div class="game-container">
        <div class="card">
            
            <div class="history-bar" id="historyBar">
                <div class="history-pill">12.50</div>
                <div class="history-pill win">74.12</div>
                <div class="history-pill">45.00</div>
                <div class="history-pill win">91.05</div>
                <div class="history-pill">30.22</div>
                <div class="history-pill win">65.80</div>
            </div>
            
            <div class="slider-section">
                <div class="floating-cube-indicator" id="floatingCube">53.00</div>
                <div class="slider-labels">
                    <span>0</span>
                    <span>25</span>
                    <span>50</span>
                    <span>75</span>
                    <span>100</span>
                </div>
                <div class="track-container">
                    <div class="slider-track" id="sliderTrackBg">
                        <div class="slider-track-fill" id="successTrack"></div>
                    </div>
                    <input type="range" min="2" max="98" value="47" class="range-input" id="rollSlider" oninput="onSliderDrag(this.value)">
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Multiplier</div>
                    <div class="stat-value" id="multiplierVal">1.87x</div>
                </div>
                <div class="stat-box interactive" onclick="playSound('click'); toggleRollMode()">
                    <div class="stat-label" id="modeLabel">Roll Over 🔄</div>
                    <div class="stat-value" id="rollOverVal">47.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Chance</div>
                    <div class="stat-value" id="winChanceVal">53.00%</div>
                </div>
            </div>

            <div class="input-group">
                <div class="input-left">
                    <div class="input-label">Bet Amount</div>
                    <input type="number" id="betAmountInput" class="bet-input" value="10">
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="playSound('click'); halveBet()">½</button>
                    <button class="quick-btn" onclick="playSound('click'); doubleBet()">2×</button>
                </div>
            </div>

            <!-- Auto-Roll Specific Config Panel -->
            <div class="auto-controls" id="autoControls">
                <div class="auto-row">
                    <div class="auto-input-box">
                        <div class="input-label">Number of Rolls</div>
                        <input type="number" id="autoRollsInput" class="auto-input" value="10">
                    </div>
                    <div class="auto-input-box">
                        <div class="input-label">On Win (%)</div>
                        <input type="number" id="onWinInput" class="auto-input" value="0">
                    </div>
                </div>
                <div class="auto-row">
                    <div class="auto-input-box">
                        <div class="input-label">On Loss (%)</div>
                        <input type="number" id="onLossInput" class="auto-input" value="0">
                    </div>
                    <div class="auto-input-box">
                        <div class="input-label">Speed (ms)</div>
                        <input type="number" id="autoSpeedInput" class="auto-input" value="400">
                    </div>
                </div>
            </div>

            <div class="error-msg-container">
                <div class="error-msg" id="errorMsg">Not enough balance</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; font-size: 13px;">
                <span style="color: #94a3b8; font-weight: 700;">Profit on Win:</span>
                <span style="color: #4ade80; font-weight: 800;" id="profitVal">8.70 Coins</span>
            </div>

            <button class="btn-bet" id="betBtn" onclick="playSound('click'); handleMainButtonClick()">ROLL</button>

            <!-- Mode Switcher Tabs (Bottom Navigation) -->
            <div class="mode-tabs">
                <button class="mode-tab active" id="manualTab" onclick="switchMode('manual')">Manual</button>
                <button class="mode-tab" id="autoTab" onclick="switchMode('auto')">Auto</button>
            </div>
        </div>
    </div>

    <script>
        let currentCoins = parseFloat(localStorage.getItem('pixvinz_coins')) || 950.00;
        document.getElementById('coinCount').innerText = currentCoins.toFixed(2);

        let recentHistory = [12.50, 74.12, 45.00, 91.05, 30.22, 65.80];
        let isRollOver = true; 
        let lastSliderSoundVal = 47;
        let isRolling = false;
        let gameMode = 'manual'; // 'manual' or 'auto'
        let isAutoRunning = false;
        let autoInterval = null;
        let rollsRemaining = 0;

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } 
                else if (type === 'slide') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.02);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.02);
                    osc.start(now);
                    osc.stop(now + 0.02);
                }
                else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(freq, now + index * 0.08);
                        g.gain.setValueAtTime(0.2, now + index * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
                        o.start(now + index * 0.08);
                        o.stop(now + index * 0.08 + 0.3);
                    });
                } 
                else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(70, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.log("Audio blocked.");
            }
        }

        function switchMode(mode) {
            if (isAutoRunning) return;
            gameMode = mode;
            let manualTab = document.getElementById('manualTab');
            let autoTab = document.getElementById('autoTab');
            let autoControls = document.getElementById('autoControls');
            let betBtn = document.getElementById('betBtn');

            if (mode === 'manual') {
                manualTab.classList.add('active');
                autoTab.classList.remove('active');
                autoControls.style.display = 'none';
                betBtn.innerText = "ROLL";
            } else {
                autoTab.classList.add('active');
                manualTab.classList.remove('active');
                autoControls.style.display = 'flex';
                betBtn.innerText = "START AUTO ROLL";
            }
        }

        function toggleRollMode() {
            isRollOver = !isRollOver;
            document.getElementById('modeLabel').innerText = isRollOver ? "Roll Over 🔄" : "Roll Under 🔄";
            updateSlider(document.getElementById('rollSlider').value);
        }

        function onSliderDrag(val) {
            let numVal = parseInt(val);
            if (Math.abs(numVal - lastSliderSoundVal) >= 2) {
                playSound('slide');
                lastSliderSoundVal = numVal;
            }
            updateSlider(val);
        }

        function updateSlider(val) {
            let threshold = parseFloat(val);
            let winChance = isRollOver ? (100 - threshold) : threshold;
            if (winChance < 1) winChance = 1;
            if (winChance > 98) winChance = 98;

            let multiplier = (99 / winChance).toFixed(4);

            document.getElementById('rollOverVal').innerText = threshold.toFixed(2);
            document.getElementById('winChanceVal').innerText = winChance.toFixed(2) + '%';
            document.getElementById('multiplierVal').innerText = multiplier + 'x';

            let trackBg = document.getElementById('sliderTrackBg');
            let successTrack = document.getElementById('successTrack');

            if (isRollOver) {
                trackBg.style.background = '#ef4444';
                successTrack.style.background = '#22c55e';
                successTrack.style.left = 'unset';
                successTrack.style.right = '0';
                successTrack.style.width = (100 - threshold) + '%';
                successTrack.style.borderRadius = '0 7px 7px 0';
            } else {
                trackBg.style.background = '#ef4444';
                successTrack.style.background = '#22c55e';
                successTrack.style.right = 'unset';
                successTrack.style.left = '0';
                successTrack.style.width = threshold + '%';
                successTrack.style.borderRadius = '7px 0 0 7px';
            }

            updateProfit();
        }

        function updateProfit() {
            let bet = parseFloat(document.getElementById('betAmountInput').value) || 0;
            let mult = parseFloat(document.getElementById('multiplierVal').innerText);
            let profit = (bet * mult) - bet;
            document.getElementById('profitVal').innerText = profit.toFixed(2) + ' Coins';
        }

        document.getElementById('betAmountInput').addEventListener('input', updateProfit);

        function showNotEnoughBalanceError(customText = "Not enough balance") {
            let errEl = document.getElementById('errorMsg');
            errEl.innerText = customText;
            errEl.classList.add('show');
            setTimeout(() => {
                errEl.classList.remove('show');
            }, 2000);
        }

        function halveBet() {
            let input = document.getElementById('betAmountInput');
            let val = Math.max(1, Math.floor(parseFloat(input.value) / 2));
            input.value = val;
            updateProfit();
        }

        function doubleBet() {
            let input = document.getElementById('betAmountInput');
            let currentBet = parseFloat(input.value) || 0;
            let doubled = currentBet * 2;

            if (doubled > currentCoins) {
                if (currentCoins <= 0) {
                    input.value = 0;
                } else {
                    input.value = currentCoins;
                }
                showNotEnoughBalanceError();
            } else {
                input.value = doubled;
            }
            updateProfit();
        }

        function renderHistory(latestRoll) {
            recentHistory.push(latestRoll);
            if (recentHistory.length > 6) {
                recentHistory.shift();
            }

            let bar = document.getElementById('historyBar');
            bar.innerHTML = '';
            let threshold = parseFloat(document.getElementById('rollOverVal').innerText);

            recentHistory.forEach((roll) => {
                let pill = document.createElement('div');
                pill.className = 'history-pill';
                let won = isRollOver ? (roll > threshold) : (roll < threshold);
                if (won) {
                    pill.classList.add('win');
                }
                pill.innerText = roll.toFixed(2);
                bar.appendChild(pill);
            });
        }

        function handleMainButtonClick() {
            if (gameMode === 'manual') {
                executeManualRoll();
            } else {
                if (!isAutoRunning) {
                    startAutoRoll();
                } else {
                    stopAutoRoll();
                }
            }
        }

        function executeManualRoll() {
            if (isRolling) return;

            let betAmount = parseFloat(document.getElementById('betAmountInput').value);
            if (isNaN(betAmount) || betAmount <= 0 || betAmount > currentCoins) {
                showNotEnoughBalanceError();
                return;
            }

            isRolling = true;
            let betBtn = document.getElementById('betBtn');
            betBtn.innerText = "ROLLING...";
            betBtn.disabled = true;

            currentCoins -= betAmount;
            document.getElementById('coinCount').innerText = currentCoins.toFixed(2);

            setTimeout(() => {
                let threshold = parseFloat(document.getElementById('rollOverVal').innerText);
                let multiplier = parseFloat(document.getElementById('multiplierVal').innerText);

                let rolledNum = Math.random() * 100;
                let isWin = isRollOver ? (rolledNum > threshold) : (rolledNum < threshold);

                let cube = document.getElementById('floatingCube');
                cube.style.display = 'block';
                cube.style.left = rolledNum + '%';
                cube.innerText = rolledNum.toFixed(2);

                if (isWin) {
                    cube.className = "floating-cube-indicator win";
                    let payout = betAmount * multiplier;
                    currentCoins += payout;
                    playSound('win');
                } else {
                    cube.className = "floating-cube-indicator lose";
                    playSound('lose');
                }

                document.getElementById('coinCount').innerText = currentCoins.toFixed(2);
                localStorage.setItem('pixvinz_coins', currentCoins);

                renderHistory(rolledNum);

                betBtn.innerText = "ROLL";
                betBtn.disabled = false;
                isRolling = false;
            }, 300);
        }

        function startAutoRoll() {
            let betAmount = parseFloat(document.getElementById('betAmountInput').value);
            if (isNaN(betAmount) || betAmount <= 0 || betAmount > currentCoins) {
                showNotEnoughBalanceError();
                return;
            }

            rollsRemaining = parseInt(document.getElementById('autoRollsInput').value) || 10;
            let speed = parseInt(document.getElementById('autoSpeedInput').value) || 400;

            isAutoRunning = true;
            let betBtn = document.getElementById('betBtn');
            betBtn.classList.add('stop-auto');
            betBtn.innerText = `STOP AUTO (${rollsRemaining})`;

            autoInterval = setInterval(() => {
                if (rollsRemaining <= 0 || currentCoins < betAmount) {
                    stopAutoRoll();
                    if (currentCoins < betAmount) showNotEnoughBalanceError("Stopped: Low balance");
                    return;
                }

                rollsRemaining--;
                betBtn.innerText = `STOP AUTO (${rollsRemaining})`;

                currentCoins -= betAmount;
                document.getElementById('coinCount').innerText = currentCoins.toFixed(2);

                let threshold = parseFloat(document.getElementById('rollOverVal').innerText);
                let multiplier = parseFloat(document.getElementById('multiplierVal').innerText);

                let rolledNum = Math.random() * 100;
                let isWin = isRollOver ? (rolledNum > threshold) : (rolledNum < threshold);

                let cube = document.getElementById('floatingCube');
                cube.style.display = 'block';
                cube.style.left = rolledNum + '%';
                cube.innerText = rolledNum.toFixed(2);

                let onWinPct = parseFloat(document.getElementById('onWinInput').value) || 0;
                let onLossPct = parseFloat(document.getElementById('onLossInput').value) || 0;

                if (isWin) {
                    cube.className = "floating-cube-indicator win";
                    let payout = betAmount * multiplier;
                    currentCoins += payout;
                    playSound('win');
                    if (onWinPct !== 0) {
                        betAmount = betAmount * (1 + (onWinPct / 100));
                    }
                } else {
                    cube.className = "floating-cube-indicator lose";
                    playSound('lose');
                    if (onLossPct !== 0) {
                        betAmount = betAmount * (1 + (onLossPct / 100));
                    }
                }

                if (betAmount < 0.01) betAmount = 0.01;
                if (betAmount > currentCoins && currentCoins > 0) {
                    betAmount = currentCoins;
                }
                document.getElementById('betAmountInput').value = betAmount.toFixed(2);
                updateProfit();

                document.getElementById('coinCount').innerText = currentCoins.toFixed(2);
                localStorage.setItem('pixvinz_coins', currentCoins);

                renderHistory(rolledNum);

                if (rollsRemaining <= 0) {
                    stopAutoRoll();
                }
            }, speed);
        }

        function stopAutoRoll() {
            clearInterval(autoInterval);
            isAutoRunning = false;
            let betBtn = document.getElementById('betBtn');
            betBtn.classList.remove('stop-auto');
            betBtn.innerText = "START AUTO ROLL";
        }

        updateSlider(47);
    </script>
</body>
</html>
