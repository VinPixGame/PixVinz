<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixVinz - Crypto Dice</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1e293b;
            z-index: 1000;
            box-sizing: border-box;
            border-bottom: 2px solid #334155;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #334155;
            border: 2px solid #6366f1;
            overflow: hidden;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .logo-container {
            height: 35px;
        }
        .logo-container video {
            height: 100%;
            background: transparent;
        }
        .coin-badge {
            background: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #fbbf24;
            font-weight: bold;
            font-size: 14px;
            color: #fbbf24;
        }

        /* Main Game Layout */
        .game-container {
            width: 100%;
            max-width: 440px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 75px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* Stake Style Slider Arena */
        .slider-section {
            margin: 20px 0 30px 0;
            position: relative;
        }
        
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .track-container {
            position: relative;
            height: 32px;
            display: flex;
            align-items: center;
        }

        .slider-track {
            position: absolute;
            width: 100%;
            height: 14px;
            background: #ef4444; /* Red for roll under */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .slider-track-success {
            position: absolute;
            height: 100%;
            right: 0;
            width: 53%;
            background: #22c55e; /* Green for roll over win zone */
            border-radius: 0 8px 8px 0;
        }

        .range-input {
            position: absolute;
            width: 100%;
            height: 32px;
            background: transparent;
            appearance: none;
            cursor: pointer;
            z-index: 10;
            margin: 0;
        }

        .range-input::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 36px;
            background: #3b82f6;
            border: 3px solid #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .range-input::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }

        /* Stats Grid (Multiplier, Roll Over, Win Chance) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 800;
            color: #f8fafc;
        }

        /* Bet Amount Section */
        .input-group {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .input-left {
            text-align: left;
        }

        .input-label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 18px;
            font-weight: 800;
            width: 120px;
            outline: none;
        }

        .quick-actions {
            display: flex;
            gap: 6px;
        }

        .quick-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quick-btn:hover {
            background: #334155;
        }

        /* Main Bet Button */
        .btn-bet {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: 2px solid #60a5fa;
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-bet:active {
            transform: scale(0.98);
        }

        .btn-back {
            background: transparent;
            border: 2px solid #64748b;
            color: #94a3b8;
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Result Popup Banner inside UI or Modal */
        .result-display {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            display: none;
        }
        .result-display.win {
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid #22c55e;
            color: #4ade80;
        }
        .result-display.lose {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            color: #f87171;
        }
    </style>
</head>
<body>

    <!-- Top Header Bar -->
    <header class="top-bar" id="mainHeader">
      <button class="icon-btn" id="profileHeaderBtn" onclick="window.location.href='index.html'">
        <span id="profileIconFallback">👤</span>
        <img id="profileHeaderImg" src="" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; display: none;">
      </button>
      <div class="logo-container">
        <video id="logoVideo" autoplay loop muted playsinline preload="auto">
          <source src="image/logo.webm" type="video/webm">
        </video>
      </div>
      <div class="coin-badge">🪙 <span id="coinCount">950</span></div>
    </header>

    <!-- Game Container -->
    <div class="game-container">
        <div class="card">
            <h2 style="margin: 0 0 5px 0; color: #fbbf24;">🎯 PIXVINZ DICE</h2>
            <p style="color: #94a3b8; font-size: 12px; margin: 0 0 15px 0;">Slide to pick your target & roll higher to win!</p>
            
            <!-- Stake Style Slider Section -->
            <div class="slider-section">
                <div class="slider-labels">
                    <span>0</span>
                    <span>25</span>
                    <span>50</span>
                    <span>75</span>
                    <span>100</span>
                </div>
                <div class="track-container">
                    <div class="slider-track">
                        <div class="slider-track-success" id="successTrack"></div>
                    </div>
                    <input type="range" min="2" max="98" value="47" class="range-input" id="rollSlider" oninput="updateSlider(this.value)">
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Multiplier</div>
                    <div class="stat-value" id="multiplierVal">1.87x</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Roll Over</div>
                    <div class="stat-value" id="rollOverVal">47.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Chance</div>
                    <div class="stat-value" id="winChanceVal">53.00%</div>
                </div>
            </div>

            <!-- Bet Amount Input -->
            <div class="input-group">
                <div class="input-left">
                    <div class="input-label">Bet Amount</div>
                    <input type="number" id="betAmountInput" class="bet-input" value="10">
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="halveBet()">½</button>
                    <button class="quick-btn" onclick="doubleBet()">2×</button>
                </div>
            </div>

            <!-- Profit on Win -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; font-size: 13px;">
                <span style="color: #94a3b8; font-weight: 700;">Profit on Win:</span>
                <span style="color: #4ade80; font-weight: 800;" id="profitVal">8.70 Coins</span>
            </div>

            <!-- Bet Action Button -->
            <button class="btn-bet" id="betBtn" onclick="executeRoll()">BET</button>

            <!-- Result Feedback Banner -->
            <div class="result-display" id="resultBanner"></div>

            <button class="btn-back" onclick="window.location.href='index.html'">← BACK TO HOME</button>
        </div>
    </div>

    <script>
        let currentCoins = parseInt(localStorage.getItem('pixvinz_coins')) || 950;
        document.getElementById('coinCount').innerText = currentCoins;

        function updateSlider(val) {
            let rollOver = parseFloat(val);
            let winChance = 100 - rollOver;
            // House edge calculation standard to crypto dice (e.g., 1%)
            let multiplier = (99 / winChance).toFixed(4);

            document.getElementById('rollOverVal').innerText = rollOver.toFixed(2);
            document.getElementById('winChanceVal').innerText = winChance.toFixed(2) + '%';
            document.getElementById('multiplierVal').innerText = multiplier + 'x';

            // Adjust green success track width dynamically
            document.getElementById('successTrack').style.width = winChance + '%';

            updateProfit();
        }

        function updateProfit() {
            let bet = parseFloat(document.getElementById('betAmountInput').value) || 0;
            let mult = parseFloat(document.getElementById('multiplierVal').innerText);
            let profit = (bet * mult) - bet;
            document.getElementById('profitVal').innerText = profit.toFixed(2) + ' Coins';
        }

        document.getElementById('betAmountInput').addEventListener('input', updateProfit);

        function halveBet() {
            let input = document.getElementById('betAmountInput');
            let val = Math.max(1, Math.floor(parseFloat(input.value) / 2));
            input.value = val;
            updateProfit();
        }

        function doubleBet() {
            let input = document.getElementById('betAmountInput');
            let val = Math.floor(parseFloat(input.value) * 2);
            input.value = val;
            updateProfit();
        }

        function executeRoll() {
            let betAmount = parseFloat(document.getElementById('betAmountInput').value);
            if (isNaN(betAmount) || betAmount <= 0) {
                alert("Please enter a valid bet amount!");
                return;
            }
            if (betAmount > currentCoins) {
                alert("Not enough coins!");
                return;
            }

            currentCoins -= betAmount;
            document.getElementById('coinCount').innerText = currentCoins;

            let rollOver = parseFloat(document.getElementById('rollOverVal').innerText);
            let multiplier = parseFloat(document.getElementById('multiplierVal').innerText);

            // Generate random roll between 0.00 and 100.00
            let rolledNum = Math.random() * 100;
            let isWin = rolledNum > rollOver;

            let banner = document.getElementById('resultBanner');
            banner.style.display = 'block';

            if (isWin) {
                let payout = betAmount * multiplier;
                let profit = payout - betAmount;
                currentCoins += payout;
                banner.className = "result-display win";
                banner.innerHTML = `🎉 Rolled ${rolledNum.toFixed(2)} — YOU WON +${profit.toFixed(2)} Coins!`;
            } else {
                banner.className = "result-display lose";
                banner.innerHTML = `💥 Rolled ${rolledNum.toFixed(2)} — You Lost ${betAmount} Coins`;
            }

            document.getElementById('coinCount').innerText = currentCoins.toFixed(2);
            localStorage.setItem('pixvinz_coins', currentCoins);
        }

        // Initialize calculations on load
        updateSlider(47);
    </script>
</body>
</html>
